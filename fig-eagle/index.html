<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c7b7a">
<meta name="color-scheme" content="light">
<title>Fig & Eagle Command Center</title>
<meta name="description" content="Fig and Eagle Command Center. The setter game scored in bonus dollars. Read only from GHL.">
<link rel="icon" href="mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f7f6f3;--card:#ffffff;--ink:#000000;--muted:#242424;
  --teal:#2c7b7a;--good:#37ca37;--bad:#e93d3d;--track:#f0f0f0;
  --line:rgba(44,123,122,.28);
  --serif:Fraunces,Georgia,"Times New Roman",serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased}
button,a,input{font-family:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:var(--teal);text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;border-top:4px solid var(--teal)}
.top{flex:none;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-height:44px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line)}
.logo{height:40px;width:auto;display:block}
.livepill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 8px;background:rgba(55,202,55,.16);color:#146814;border:1px solid var(--good);font-size:10px;font-weight:800;letter-spacing:.12em}
.livepill.wait,.livepill.stale,.livepill.down{background:rgba(233,61,61,.12);color:var(--bad);border-color:var(--bad)}
.gdot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.sysline{font-size:13px;font-weight:700}
.asof,.next,.clock{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.clock{margin-left:auto;font-variant-numeric:tabular-nums}
.nav{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line)}
.nav button{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:999px;min-height:34px;padding:0 14px;font-weight:700;font-size:13px}
.nav button.on{color:#fff;background:#000;border-color:#000}
.helpbtn{margin-left:auto;width:34px;padding:0}
.stage{flex:1;min-height:0;position:relative}
.stage.scroll{overflow:auto}
.stage.lock{overflow:hidden}
.play{height:100%;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.9fr);grid-template-rows:auto minmax(0,1fr);gap:8px;padding:8px 10px;box-sizing:border-box}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.play:has(.banner){gap:6px;padding:6px 10px}
.play:has(.banner) .col{gap:6px}
.play:has(.banner) .card{padding:8px 10px}
.play:has(.banner) .wtrack{margin-bottom:16px}
.money{grid-column:1;grid-row:1}
.long{grid-column:1;grid-row:2}
.race{grid-column:2;grid-row:1 / span 2}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:800}
.who{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.who h2{font-family:var(--serif);font-weight:560;font-size:28px;line-height:1}
.streak{display:flex;align-items:center;gap:6px;font-weight:800}
.streak svg{width:14px;height:20px}
.dollars{font-family:var(--serif);font-weight:650;font-size:clamp(46px,8vh,68px);line-height:.88;letter-spacing:-.03em;margin:2px 0}
.good{color:var(--good)}
.bad{color:var(--bad)}
.sub{color:var(--muted);font-size:12px}
.meter{height:14px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--good);transition:width .6s ease}
.meter.bad{background:rgba(233,61,61,.16)}
.meter.full{background:var(--good)}
.mrow{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-width:0}
.chip b{display:block;font-family:var(--serif);font-size:22px;font-weight:650;line-height:1;margin-top:2px}
.chip span{display:block;color:var(--muted);font-size:11px;line-height:1.25;margin-top:2px}
.line-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.line-in label{font-size:12px;font-weight:700;color:var(--muted)}
.line-in input{width:96px;border:1px solid var(--teal);border-radius:8px;background:#fff;padding:6px 8px;font-size:16px}
.assume{font-size:12px;font-weight:700;margin-top:4px}
.bars{display:grid;gap:8px}
.wtrack{position:relative;height:12px;border-radius:99px;background:var(--track);margin:8px 4px 22px;overflow:visible}
.wfill{display:block;height:100%;width:0;border-radius:99px;background:var(--bad);transition:width .6s ease}
.wtrack.hit .wfill{background:var(--good)}
.wtick{position:absolute;top:-4px;width:2px;height:20px;background:#000}
.wtick span{position:absolute;top:20px;font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;text-transform:uppercase}
.wtick.promise span{left:50%;transform:translateX(-50%)}
.wtick.goal span{right:0}
.race{display:flex;flex-direction:column;min-height:0;height:100%}
.pass{font-family:var(--serif);font-weight:560;font-size:clamp(22px,3.2vh,32px);line-height:1.05;margin-top:2px}
.shead,.srow{display:grid;grid-template-columns:28px minmax(0,1.4fr) auto auto;gap:8px;align-items:center}
.shead{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:0 8px}
.slist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.srow{padding:6px 8px;border-radius:10px}
.srow.you{background:rgba(233,61,61,.1);box-shadow:inset 3px 0 0 var(--bad)}
.srow.you.ahead{background:rgba(55,202,55,.14);box-shadow:inset 3px 0 0 var(--good)}
.rk{font-variant-numeric:tabular-nums;font-weight:800;display:flex;align-items:center;gap:2px}
.arr{width:10px;height:10px}
.nm{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you-tag{margin-left:6px;font-style:normal;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#000;border-radius:999px;padding:1px 5px}
.sets,.dials{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.sheet{padding:12px;display:grid;gap:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h2{font-family:var(--serif);font-weight:560;font-size:28px}
.caption{font-size:16px;font-weight:750;margin:6px 0}
.src{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;list-style:none;margin:8px 0 0;padding:0;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--bad);margin-right:6px;vertical-align:middle}
.legend i.good{border-top-color:var(--good)}
.legend i.dash{border-top:1.5px dashed var(--teal)}
.legend i.shade{width:14px;height:10px;border:0;background:rgba(44,123,122,.2)}
.chart,.trend{width:100%;height:auto;display:block}
.chart text,.trend text{font-family:var(--sans);fill:#242424}
.pacefig b{font-family:var(--serif);font-size:48px;line-height:.9}
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}
.krow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:750}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px}
.days,.hours{list-style:none;margin:8px 0 0;padding:0}
.days li,.hours li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid rgba(44,123,122,.15);font-size:13px}
.score{height:100%;min-height:0;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
.scoretop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:999px;min-height:34px;padding:0 12px;font-weight:800;font-size:13px}
.tab.on{color:#fff;background:#000;border-color:#000}
.behind{margin:0 12px 12px;border:1px solid var(--line);border-radius:16px;background:#fff}
.behind summary{cursor:pointer;padding:12px 14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--teal);list-style:none}
.behind .inn{padding:0 14px 14px}
.src-list{list-style:none;margin:8px 0 0;padding:0}
.src-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid rgba(44,123,122,.15);font-size:13px}
.fail{max-width:520px;margin:8vh auto;text-align:center}
.fail h2{font-family:var(--serif);font-weight:560;font-size:32px}
.btn{border:0;border-radius:999px;min-height:40px;padding:0 16px;font-weight:800;background:#000;color:#fff}
.banner{padding:8px 10px;border-radius:10px;background:rgba(55,202,55,.16);color:#146814;border:1px solid var(--good);font-weight:800}
.guide{position:fixed;inset:0;z-index:30;background:rgba(247,246,243,.9);display:grid;place-items:center;padding:16px}
.guide article{width:min(560px,100%);background:#fff;border:2px solid var(--teal);border-radius:18px;padding:18px}
.guide h2{font-family:var(--serif);font-weight:560;font-size:34px;margin:4px 0}
.guide p{margin-top:8px;color:var(--muted)}
.guide .row{display:flex;justify-content:flex-end;margin-top:14px}
footer.site{padding:0 14px 16px;color:var(--muted);font-size:12px}
.emptyviz{min-height:80px;display:grid;place-items:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media (max-width:820px){
  .top{padding:calc(6px + env(safe-area-inset-top)) 10px 6px}
  .logo{height:32px}
  .clock{margin-left:0}
  .play{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;padding:6px}
  .money,.long,.race{grid-column:1}
  .money{grid-row:1}
  .race{grid-row:2;height:auto}
  .long{grid-row:3}
  .play .extra,.play .fine,.play .wtrack{display:none}
  .play .card{padding:6px 8px}
  .play .sub,.play .assume,#goal-line{font-size:11px;margin-top:2px}
  .who h2{font-size:22px}
  .dollars{font-size:34px}
  .meter{height:8px}
  .chip{padding:4px 6px}
  .chip b{font-size:18px}
  .line-in{flex-wrap:nowrap}
  .line-in input{width:72px;padding:4px 6px}
  .pass{font-size:18px;margin:0}
  .srow{padding:2px 6px}
  .slist{gap:2px;margin-top:2px}
  .split{grid-template-columns:1fr}
  .shead{display:none}
  .score{height:auto}
  .slist{overflow:visible}
}
@media (max-height:720px){
  .dollars{font-size:36px}
  .card{padding:6px 8px}
  .chips{gap:4px}
  .chip{padding:4px 6px}
  .who h2{font-size:22px}
}
@media (max-width:820px) and (max-height:740px){
  .top{padding:4px 8px;gap:2px 8px;min-height:0}
  .nav{padding:4px 8px}
  .nav button,.helpbtn{min-height:28px}
  .play{gap:4px;padding:4px}
  .play .meter{display:none}
  .play .card{padding:4px 6px}
  .who h2{font-size:18px}
  .dollars{font-size:28px}
  .chip span{font-size:10px;line-height:1.15}
  .caption{margin:0}
  .pass{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<h1 class="sr">Fig &amp; Eagle Command Center</h1>
<p class="sr" id="livesum" aria-live="polite"></p>
<div class="app">
  <header class="top">
    <img class="logo" src="mark.svg" alt="Fig and Eagle">
    <span class="livepill wait" id="livepill"><i class="gdot"></i> <span id="pillt">WAIT</span></span>
    <span class="sysline" id="sysline">Checking the feed</span>
    <span class="asof" id="asof">As of no data</span>
    <span class="next" id="next">Reading</span>
    <a href="../command-center/">Command Center</a>
    <div class="clock"><span id="clock">CT</span></div>
  </header>
  <nav class="nav" aria-label="Game">
    <button type="button" data-view="play" class="on">Play</button>
    <button type="button" data-view="board">Scoreboard</button>
    <button type="button" data-view="stats">Stats</button>
    <button type="button" class="helpbtn" data-help aria-label="The incentive">?</button>
  </nav>
  <main class="stage lock" id="stage">
    <p class="sub" style="padding:16px">Reading the live feed from GHL. Missing numbers stay blank. Nothing here is filled in as zero.</p>
  </main>
</div>
<script>
(function () {
  var SB_URL = 'https://udkbnlpnfyjuwlstfxhr.supabase.co';
  var SB_KEY = 'sb_publishable_lwmiHRxf1Hdf2Z4b_aJkjg_ck7u1ms4';
  var REFRESH_MS = 5 * 60 * 1000;
  var BLOCKS = [[11, 13], [15, 18]];
  var PACE_RATE = 30;
  var BONUS = 50;
  var OUTBOUND_CUT = 0.05;
  var GUIDE_KEY = 'fe-guide-money';
  var LEVEL_KEY = 'fe-level';
  var AVG_KEY = 'fe-avg-deal';
  var GOAL_KEY = 'fe-income-goal';
  var sb = null;
  var state = { row: null, fetchedAt: null, error: '', stale: false, period: 'today', view: 'play', nextAt: 0, booted: false, inflight: false, rendered: false, fineOpen: false, guide: false, animated: false };
  try {
    var hash = (location.hash || '').replace('#', '');
    if (hash === 'stats' || hash === 'pace' || hash === 'trend') state.view = 'stats';
    if (hash === 'board') state.view = 'board';
    if (hash === 'today' || hash === 'week' || hash === 'month') { state.view = 'board'; state.period = hash; }
    state.guide = localStorage.getItem(GUIDE_KEY) !== '1';
  } catch (e) { state.guide = true; }

  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : null;
    if (typeof v === 'string' && v.trim() !== '' && isFinite(Number(v))) return Number(v);
    return null;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function textOr(v) {
    if (v == null) return 'no data';
    var s = String(v).trim();
    return s ? s : 'no data';
  }
  function fmtCount(v) {
    var n = num(v);
    if (n == null) return 'no data';
    var r = Math.round(n * 10) / 10;
    if (Math.abs(r - Math.round(r)) < 1e-6) return Math.round(r).toLocaleString('en-US');
    return r.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }
  function fmtMoney(v) {
    var n = num(v);
    if (n == null) return 'no data';
    var r = Math.round(n);
    return (r < 0 ? '-' : '') + '$' + Math.abs(r).toLocaleString('en-US');
  }
  function fmtTalk(v) {
    var n = num(v);
    if (n == null) return 'no data';
    var neg = n < 0;
    var r = Math.round(Math.abs(n) * 10) / 10;
    var body;
    if (r < 60) body = (Math.abs(r - Math.round(r)) < 1e-6 ? String(Math.round(r)) : r.toFixed(1)) + 'm';
    else {
      var h = Math.floor(r / 60);
      var m = Math.round((r - h * 60) * 10) / 10;
      if (m >= 60) { h += 1; m = 0; }
      body = m === 0 ? (h + 'h') : (h + 'h ' + (Math.abs(m - Math.round(m)) < 1e-6 ? String(Math.round(m)) : m.toFixed(1)) + 'm');
    }
    return (neg ? '-' : '') + body;
  }
  function setting(key) {
    try {
      var s = localStorage.getItem(key);
      if (s == null || String(s).trim() === '') return null;
      var n = Number(s);
      if (!isFinite(n) || n < 0) return null;
      return n;
    } catch (e) { return null; }
  }
  function sameName(a, b) {
    return String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
  }
  function meName(data) {
    var n = data && data.me;
    if (n == null || String(n).trim() === '') return 'Cristian';
    return String(n).trim();
  }
  function meMissing(data) {
    return !(data && data.me != null && String(data.me).trim() !== '');
  }
  function periodOf(data, key) {
    var p = data && data.periods && data.periods[key];
    return (p && typeof p === 'object') ? p : null;
  }
  function findMe(data, key) {
    var p = periodOf(data, key);
    if (!p || !Array.isArray(p.rows)) return null;
    var name = meName(data);
    for (var i = 0; i < p.rows.length; i++) if (p.rows[i] && sameName(p.rows[i].name, name)) return p.rows[i];
    return null;
  }
  function paceAt(t) {
    var n = num(t);
    if (n == null) return null;
    var p = 0;
    for (var i = 0; i < BLOCKS.length; i++) {
      if (n <= BLOCKS[i][0]) continue;
      p += (Math.min(n, BLOCKS[i][1]) - BLOCKS[i][0]) * PACE_RATE;
    }
    return p;
  }
  function ctClock(date) {
    try { return new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true }).format(date) + ' CT'; }
    catch (e) { return 'CT'; }
  }
  function fmtStamp(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    try { return new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true }).format(d) + ' CT'; }
    catch (e) { return null; }
  }
  function asOfText(row) {
    var data = (row && row.data) || {};
    if (data.generated) return String(data.generated);
    return fmtStamp(data.generated_iso) || fmtStamp(row && row.generated_at) || 'no data';
  }
  function fmtRemain(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function hourLabel(h) {
    var hr = ((h % 24) + 24) % 24;
    var n = hr % 12; if (n === 0) n = 12;
    return n + (hr < 12 ? 'a' : 'p');
  }
  function hourName(h) {
    var hr = ((h % 24) + 24) % 24;
    var n = hr % 12; if (n === 0) n = 12;
    return n + (hr < 12 ? ' AM' : ' PM');
  }
  function fmtHour(h) {
    var n = num(h);
    if (n == null) return 'no data';
    var hr = Math.floor(n);
    var min = Math.round((n - hr) * 60);
    if (min === 60) { hr += 1; min = 0; }
    hr = ((hr % 24) + 24) % 24;
    var disp = hr % 12; if (disp === 0) disp = 12;
    return disp + ':' + String(min).padStart(2, '0') + ' ' + (hr < 12 ? 'AM' : 'PM');
  }
  function shortDay(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    if (!m) return textOr(iso);
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return months[Number(m[2]) - 1] + ' ' + Number(m[3]);
  }
  function ctYMD(iso) {
    var d = iso ? new Date(iso) : null;
    if (!d || isNaN(d.getTime())) return null;
    try {
      var parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(d);
      var o = {};
      parts.forEach(function (p) { o[p.type] = p.value; });
      if (!o.year || !o.month || !o.day) return null;
      return { y: Number(o.year), m: Number(o.month), d: Number(o.day), key: o.year + '-' + o.month + '-' + o.day };
    } catch (e) { return null; }
  }
  function weekdaysInMonth(y, m) {
    var n = 0;

      if (c > a) shades += '<rect x="' + xOf(a).toFixed(1) + '" y="' + padT + '" width="' + (xOf(c) - xOf(a)).toFixed(1) + '" height="' + innerH + '" fill="rgba(44,123,122,.12)"/>';
    });
    for (var g = 0; g <= yMax; g += 30) {
      var gy = yOf(g);
      grid += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" stroke="rgba(0,0,0,.08)"/>';
      grid += '<text x="' + (padL - 6) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" font-size="12">' + g + '</text>';
    }
    for (var h = Math.ceil(x0); h <= x1; h++) if (h === 8 || h === 11 || h === 13 || h === 15 || h === 18 || h === x1) ticks += '<text x="' + xOf(h).toFixed(1) + '" y="' + (H - 14) + '" text-anchor="middle" font-size="12">' + hourLabel(h) + '</text>';
    var samples = [], seen = {};
    function add(t) { var k = t.toFixed(2); if (seen[k] || t < x0 - 0.001 || t > x1 + 0.001) return; seen[k] = 1; samples.push(t); }
    for (var t = x0; t <= x1 + 0.001; t += 0.25) add(Math.min(t, x1));
    BLOCKS.forEach(function (b) { add(b[0]); add(b[1]); });
    samples.sort(function (a, b) { return a - b; });
    var target = samples.map(function (tt) { return xOf(tt).toFixed(1) + ',' + yOf(paceAt(tt)).toFixed(1); }).join(' ');
    var color = behind ? '#e93d3d' : '#37ca37';
    var actual = '', dot = '';
    if (pts && pts.length) {
      actual = '<polyline fill="none" stroke="' + color + '" stroke-width="2.6" points="' + pts.map(function (p) { return xOf(p.t).toFixed(1) + ',' + yOf(p.y).toFixed(1); }).join(' ') + '"/>';
      var last = pts[pts.length - 1];
      dot = '<circle cx="' + xOf(last.t).toFixed(1) + '" cy="' + yOf(last.y).toFixed(1) + '" r="4.5" fill="' + color + '"/>';
    }
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cumulative dials by hour. The line is green when you are on pace or ahead, red when you are behind.">' + shades + grid + '<polyline fill="none" stroke="#2c7b7a" stroke-width="1.6" stroke-dasharray="5 5" points="' + target + '"/>' + actual + dot + ticks + '<text x="' + (W / 2) + '" y="' + (H - 2) + '" text-anchor="middle" font-size="11">Hour, CT</text></svg>';
  }
  function paceBlock(data, row) {
    var c = (data && data.computed) || {};
    var now = num(data && data.now_hour);
    var logged = row ? num(row.dials) : null;
    var fed = num(c.dials_vs_pace);
    var chartPace = paceAt(now);
    var delta = fed != null ? fed : ((logged != null && chartPace != null) ? logged - chartPace : null);
    var behind = delta != null && delta < -0.05;
    var when = now == null ? '' : (' at ' + fmtHour(now) + ' CT');
    var caption = delta == null ? 'Pace: no data.' : (Math.abs(delta) < 0.05 ? ('You are on the pace target' + when + '.') : (behind ? ('You are ' + fmtCount(Math.abs(delta)) + ' dials behind where you need to be' + when + '.') : ('You are ' + fmtCount(delta) + ' dials ahead of the pace target' + when + '.')));
    var big = delta == null ? 'no data' : (Math.abs(delta) < 0.05 ? 'On pace' : fmtCount(Math.abs(delta)));
    return '<section class="panel" id="pace"><p class="kicker">Dial pace</p><h2>Where you should be by this hour</h2><p class="caption ' + (behind ? 'bad' : 'good') + '">' + esc(caption) + '</p><p class="pacefig"><b class="' + (behind ? 'bad' : 'good') + '">' + esc(big) + '</b></p><p class="sub">' + esc((logged == null ? 'Dials logged: no data' : fmtCount(logged) + ' dials logged') + ' · pace target ' + (num(c.pace_target_dials) == null ? 'no data' : fmtCount(c.pace_target_dials))) + '</p>' + paceSvg(data && data.my_hourly_today, now, behind) + '<ul class="legend"><li><i class="' + (behind ? '' : 'good') + '"></i>Dials logged, ' + (behind ? 'behind' : 'on pace or ahead') + '</li><li><i class="dash"></i>30 per hour target</li><li><i class="shade"></i>Dial block</li></ul><p class="src">Vertical axis: dials. Horizontal axis: hour CT. GHL. ' + esc(asOfText(state.row)) + '</p></section>';
  }
  function weekBlock(data) {
    var row = findMe(data, 'week');
    var sets = row ? num(row.sets) : num(data && data.my_week_sets);
    var promise = num(data && data.promise), goal = num(data && data.goal);
    var hit = sets != null && promise != null && sets + 0.05 >= promise;
    var days = data && data.my_daily;
    var kpi = kpiOf(data);
    var dayHtml = !Array.isArray(days) ? '<p class="sub">Your days: no data</p>' : '<ul class="days">' + days.map(function (d) {
      var s = num(d && d.sets);
      var cls = toneSets(s, kpi);
      return '<li><b>' + esc(shortDay(d && d.day)) + '</b><span class="' + cls + '">' + esc(fmtCount(s)) + ' sets</span><span>' + esc(fmtCount(d && d.dials)) + ' dials</span><span>' + esc(s == null || kpi == null ? '' : fmtMoney(Math.max(0, kpi - s) * BONUS) + ' short') + '</span></li>';
    }).join('') + '</ul>';
    return '<section class="panel"><p class="kicker">Week</p><h2>Sets against Promise and Goal</h2><p class="caption ' + (hit ? 'good' : 'bad') + '">' + esc((sets == null ? 'Sets: no data' : fmtCount(sets) + ' sets, ' + fmtMoney(sets == null ? null : sets * BONUS)) + '. Promise ' + (promise == null ? 'no data' : fmtCount(promise)) + '. Goal ' + (goal == null ? 'no data' : fmtCount(goal)) + '.') + '</p>' + dayHtml + '<p class="src">A day is green at the daily KPI and red under it. GHL. ' + esc(asOfText(state.row)) + '</p></section>';
  }
  function trendBlock(data) {
    var series = data && data.team_series;
    if (!Array.isArray(series) || !series.length) return '<section class="panel"><p class="kicker">Team trend</p><div class="emptyviz">Team trend: no data</div></section>';
    var last = series[series.length - 1] || {};
    var W = 640, H = 180, padL = 36, padR = 12, padT = 16, padB = 28, n = series.length;
    function runs(key) {
      var out = [], cur = [];
      series.forEach(function (row, i) { var v = num(row && row[key]); if (v == null) { if (cur.length) out.push(cur); cur = []; } else cur.push({ i: i, v: v }); });
      if (cur.length) out.push(cur);
      return out;
    }
    function domain(rs) {
      var lo = Infinity, hi = -Infinity;
      rs.forEach(function (run) { run.forEach(function (p) { if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; }); });
      if (!isFinite(lo)) return null;
      if (lo === hi) { lo -= 1; hi += 1; }
      var pad = (hi - lo) * 0.12;
      return { lo: lo - pad, hi: hi + pad };
    }
    var dRuns = runs('dials'), sRuns = runs('sets'), dDom = domain(dRuns), sDom = domain(sRuns);
    var innerW = W - padL - padR, innerH = H - padT - padB;
    function xOf(i) { return padL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW); }
    function yOf(v, dom) { return padT + innerH - ((v - dom.lo) / (dom.hi - dom.lo)) * innerH; }
    function poly(rs, dom, color) {
      if (!dom) return '';
      return rs.map(function (run) { return '<polyline fill="none" stroke="' + color + '" stroke-width="2.2" points="' + run.map(function (p) { return xOf(p.i).toFixed(1) + ',' + yOf(p.v, dom).toFixed(1); }).join(' ') + '"/>'; }).join('');
    }
    var svg = '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Team dials and sets by day. No team target is in the feed, so these lines are not green or red.">' + poly(dRuns, dDom, '#2c7b7a') + poly(sRuns, sDom, '#000000') + '</svg>';
    return '<section class="panel" id="trend"><p class="kicker">Team trend</p><h2>The desk by day</h2><p class="caption">' + esc(shortDay(last.day) + ': ' + fmtCount(last.dials) + ' dials, ' + fmtCount(last.sets) + ' sets, ' + fmtCount(last.active) + ' active.') + '</p>' + svg + '<p class="src">No team target is in the feed, so this chart stays teal and black instead of green and red. team_series. GHL. ' + esc(asOfText(state.row)) + '</p></section>';
  }
  function statsHtml(data, row) {
    return '<div class="sheet">' + paceBlock(data, row) + '<div class="split">' + weekBlock(data) + trendBlock(data) + '</div></div>' + fineHtml(data);
  }
  function fineHtml(data) {
    function line(k, v) { return '<li><span>' + esc(k) + '</span><b>' + esc(textOr(v)) + '</b></li>'; }
    var counts = data && data.counts;
    var countHtml = (!counts || typeof counts !== 'object') ? '' : '<ul class="src-list">' + line('Calls read', counts.calls_fetched) + line('Sets attributed', counts.sets_attributed) + line('Appointments in window', counts.appointments_in_window) + '</ul>';
    return '<details class="behind" id="fine"' + (state.fineOpen ? ' open' : '') + '><summary>How this board counts</summary><div class="inn"><p>Sets are inferred from bookings after a setter\'s call. Talk time includes voicemails. Source GHL, refreshed hourly during dial blocks.</p><p class="sub">Bonus math is $50 times outbound sets. Opportunity lost is $50 for each set short of the daily KPI on past days in the feed. Commission percents are the pay plan. They are not added unless you type an average deal size, and then only the 5% outbound figure, labeled as an assumption.</p>' + (meMissing(data) ? '<p class="sub">Feed name: no data. This board is Cristian\'s.</p>' : '') + countHtml + '</div></details><footer class="site">Fig &amp; Eagle Command Center. Read only. <a href="../command-center/">Command Center</a></footer>';
  }
  function guideHtml() {
    return '<div class="guide" id="guide" role="dialog" aria-labelledby="guide-title"><article><p class="kicker">How to play</p><h2 id="guide-title">The incentive</h2><p>Each outbound set pays a $50 bonus. The daily KPI is the sets target in the feed. Three sets is $150. Green means the money is earned, still on the table, or you are ahead. Red means it is behind, missed, or already lost.</p><p>Commission is separate: 5% of cash collected on outbound, and 3% on intercept. This board does not know cash collected. Type an average deal size to see the 5% outbound upside. That number is an assumption. Intercept sets are not in the feed, so the 3% is not estimated.</p><p>The board ranks the team by sets, then dials. Your dollar figure is yours alone. The pass line is the sets between you and the person above. Opportunity lost adds $50 for each set short of the KPI on past days in the feed. Arrows appear when a rank changes from the last time this page was open.</p><div class="row"><button type="button" class="btn" data-guide="close">Play</button></div></article></div>';
  }
  function failHtml() {
    return '<section class="card fail"><p class="kicker">Feed</p><h2>The scoreboard did not load</h2><p class="sub">No numbers on this page until the read succeeds. Nothing here is filled in as zero.</p><p class="bad">' + esc(state.error || 'The read failed.') + '</p><button type="button" class="btn" data-retry>Try again</button></section>';
  }
  function stageHtml() {
    if (!state.row) return failHtml();
    var data = state.row.data;
    var row = findMe(data, 'today');
    var body = state.view === 'board' ? boardHtml(data) : (state.view === 'stats' ? statsHtml(data, row) : playHtml(data, row));
    return body + (state.guide ? guideHtml() : '');
  }
  function paintNav() {
    document.querySelectorAll('[data-view]').forEach(function (btn) { btn.classList.toggle('on', btn.getAttribute('data-view') === state.view); });
    var stage = document.getElementById('stage');
    if (stage) stage.className = 'stage ' + (state.view === 'play' ? 'lock' : 'scroll');
  }
  function kick(root) {
    if (!root) return;
    root.querySelectorAll('[data-fill]').forEach(function (bar) {
      var fill = parseFloat(bar.getAttribute('data-fill') || '');
      if (isFinite(fill)) bar.style.width = Math.max(0, Math.min(100, fill)) + '%';
    });
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || state.animated) return;
    var nodes = root.querySelectorAll('.count');
    if (!nodes.length) return;
    state.animated = true;
    var t0 = performance.now();
    function frame(now) {
      var p = Math.min(1, (now - t0) / 640);
      var e = 1 - Math.pow(1 - p, 3);
      nodes.forEach(function (el) {
        if (p >= 1) { el.textContent = el.getAttribute('data-final') || ''; return; }
        var n = parseFloat(el.getAttribute('data-n') || '');
        if (!isFinite(n)) return;
        el.textContent = el.getAttribute('data-kind') === 'money' ? fmtMoney(n * e) : fmtCount(n * e);
      });
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function paintChrome() {
    var clock = document.getElementById('clock');
    if (clock) clock.textContent = ctClock(new Date());
    var mode = !state.booted ? 'wait' : (state.row && state.stale ? 'stale' : (state.row ? 'live' : 'down'));
    var pill = document.getElementById('livepill');
    if (pill) { pill.className = 'livepill ' + mode; var t = document.getElementById('pillt'); if (t) t.textContent = mode === 'live' ? 'LIVE' : mode === 'stale' ? 'STALE' : mode === 'down' ? 'DOWN' : 'WAIT'; }
    var line = document.getElementById('sysline');
    if (line) line.textContent = mode === 'live' ? 'Source GHL' : mode === 'stale' ? 'Refresh failed' : mode === 'down' ? 'Feed unavailable' : 'Checking the feed';
    var asof = document.getElementById('asof');
    if (asof) asof.textContent = 'As of ' + (state.row ? asOfText(state.row) : 'no data');
    var next = document.getElementById('next');
    if (next) next.textContent = (!state.booted || state.inflight) ? 'Reading' : ('Next read ' + fmtRemain(state.nextAt - Date.now()));
  }
  function render() {
    var stage = document.getElementById('stage');
    stage.innerHTML = stageHtml();
    paintNav();
    if (!state.rendered) { state.rendered = true; document.body.setAttribute('data-ready', ''); }
    var sum = document.getElementById('livesum');
    if (sum && state.row) {
      var row = findMe(state.row.data, 'today');
      var sets = row ? num(row.sets) : null;
      sum.textContent = meName(state.row.data) + '. Earned today ' + (sets == null ? 'no data' : fmtMoney(sets * BONUS)) + '. As of ' + asOfText(state.row) + '.';
    }
    paintChrome();
    requestAnimationFrame(function () { kick(stage); });
  }
  function setView(view) {
    if (view !== 'play' && view !== 'board' && view !== 'stats') return;
    state.view = view;
    try { history.replaceState(null, '', location.pathname + location.search + '#' + view); } catch (e) {}
    render();
    var stage = document.getElementById('stage');
    if (stage) stage.scrollTop = 0;
  }
  function refreshMoneyCopy() {
    if (!state.row) return;
    var row = findMe(state.row.data, 'today');
    var sets = row ? num(row.sets) : null;
    var line = document.getElementById('commission-line');
    if (line) line.textContent = commissionText(sets);
    var goal = document.getElementById('goal-line');
    if (goal) {
      var goalSet = setting(GOAL_KEY);
      var month = monthMoney(state.row.data);
      var monthBonus = month && month.sets != null ? month.sets * BONUS : null;
      goal.textContent = goalSet == null ? 'Set a monthly income goal to track it.' : (monthBonus == null ? 'Month bonus: no data' : (fmtMoney(monthBonus) + ' bonus toward your ' + fmtMoney(goalSet) + ' goal. Commission is not included.'));
    }
  }
  async function load() {
    if (state.inflight) return;
    state.inflight = true;
    paintChrome();
    try {
      state.row = normalize(await fetchRow());
      state.error = ''; state.stale = false;
      state.fetchedAt = new Date().toISOString();
      state.nextAt = Date.now() + REFRESH_MS;
      state.booted = true;
      render();
    } catch (err) {
      state.error = errText(err);
      state.stale = !!state.row;
      state.nextAt = Date.now() + REFRESH_MS;
      state.booted = true;
      render();
    } finally { state.inflight = false; paintChrome(); }
  }
  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (h === 'play' || h === 'board' || h === 'stats') { if (h !== state.view) setView(h); }
    else if (h === 'today' || h === 'week' || h === 'month') { state.view = 'board'; state.period = h; render(); }
  });
  document.body.addEventListener('click', function (e) {
    var view = e.target.closest && e.target.closest('[data-view]');
    if (view) { setView(view.getAttribute('data-view')); return; }
    var tab = e.target.closest && e.target.closest('[data-period]');
    if (tab) {
      var next = tab.getAttribute('data-period');
      if (next && next !== state.period) { state.period = next; state.view = 'board'; render(); }
      return;
    }
    if (e.target.closest && e.target.closest('[data-help]')) {
      state.guide = true;
      if (!document.getElementById('guide')) document.getElementById('stage').insertAdjacentHTML('beforeend', guideHtml());
      return;
    }
    if (e.target.closest && e.target.closest('[data-guide]')) {
      state.guide = false;
      try { localStorage.setItem(GUIDE_KEY, '1'); } catch (err) {}
      var node = document.getElementById('guide'); if (node) node.remove();
      return;
    }
    if (e.target.closest && e.target.closest('[data-retry]')) load();
  });
  document.body.addEventListener('input', function (e) {
    if (!e.target || (e.target.id !== 'avg-deal' && e.target.id !== 'month-goal')) return;
    var key = e.target.id === 'avg-deal' ? AVG_KEY : GOAL_KEY;
    var v = String(e.target.value || '').trim();
    try {
      if (v === '') localStorage.removeItem(key);
      else if (isFinite(Number(v)) && Number(v) >= 0) localStorage.setItem(key, String(Number(v)));
    } catch (err) {}
    refreshMoneyCopy();
  });
  document.body.addEventListener('toggle', function (e) {
    if (e.target && e.target.id === 'fine') state.fineOpen = !!e.target.open;
  }, true);
  paintChrome();
  paintNav();
  setInterval(function () {
    paintChrome();
    if (state.booted && !state.inflight && state.nextAt && Date.now() >= state.nextAt) load();
  }, 1000);
  load();
})();
</script>
