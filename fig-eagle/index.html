<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c7b7a">
<meta name="color-scheme" content="light">
<script>
(function(){var s='light';try{s=localStorage.getItem('fe-theme')||'light';}catch(e){}if(s!=='dark'&&s!=='auto')s='light';document.documentElement.setAttribute('data-theme',s);})();
</script>
<title>Fig & Eagle Command Center</title>
<meta name="description" content="Fig and Eagle Command Center. The setter game scored in bonus dollars. Read only from GHL.">
<link rel="icon" href="mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f7f6f3;--card:#ffffff;--surface:#ffffff;--ink:#000000;--muted:#242424;
  --teal:#2c7b7a;--good:#37ca37;--bad:#e93d3d;--calm:#188bf6;--track:#f0f0f0;
  --line:rgba(44,123,122,.28);--edge:#000000;--on:#000000;--on-ink:#ffffff;
  --good-ink:#146814;--bad-ink:#8d1c1c;--calm-ink:#0b4f93;
  --grid:rgba(0,0,0,.08);--logo-plate:transparent;--logo-pad:0;--guide:rgba(247,246,243,.9);--shadow-good:#146814;
  --serif:Fraunces,Georgia,"Times New Roman",serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121614;--card:#1c2422;--surface:#24302d;--ink:#f6f3ec;--muted:#d7d1c7;
  --teal:#9ed9d7;--track:#2a3331;--line:rgba(158,217,215,.4);
  --edge:#f6f3ec;--on:#f6f3ec;--on-ink:#121614;
  --good-ink:#c8f7c8;--bad-ink:#ffc7c3;--calm-ink:#c5e2ff;
  --grid:rgba(246,243,236,.16);--logo-plate:#ffffff;--logo-pad:2px 4px;--guide:rgba(10,14,13,.92);--shadow-good:#8ef08e;
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    color-scheme:dark;
    --bg:#121614;--card:#1c2422;--surface:#24302d;--ink:#f6f3ec;--muted:#d7d1c7;
    --teal:#9ed9d7;--track:#2a3331;--line:rgba(158,217,215,.4);
    --edge:#f6f3ec;--on:#f6f3ec;--on-ink:#121614;
    --good-ink:#c8f7c8;--bad-ink:#ffc7c3;--calm-ink:#c5e2ff;
    --grid:rgba(246,243,236,.16);--logo-plate:#ffffff;--logo-pad:2px 4px;--guide:rgba(10,14,13,.92);--shadow-good:#8ef08e;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased}
button,a,input{font-family:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:var(--teal);text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;border-top:4px solid var(--teal)}
.app:before{content:"";pointer-events:none;position:fixed;inset:0;z-index:4;box-shadow:inset 0 0 0 0 transparent}
.app.mode-alert{border-top-color:var(--bad)}
.app.mode-alert:before{box-shadow:inset 0 0 90px rgba(233,61,61,.38);animation:vignette 1.1s ease-in-out infinite}
.app.mode-calm{border-top-color:var(--calm)}
.app.mode-calm:before{box-shadow:inset 0 0 70px rgba(24,139,246,.2)}
.app.mode-win{border-top-color:var(--good)}
.app.mode-win:before{box-shadow:inset 0 0 80px rgba(55,202,55,.32)}
@keyframes vignette{50%{box-shadow:inset 0 0 28px rgba(233,61,61,.18)}}
.top{flex:none;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-height:44px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{height:40px;width:auto;display:block;background:var(--logo-plate);border-radius:6px;padding:var(--logo-pad)}
.theme{display:inline-flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--card);flex:none}
.theme button{border:0;background:transparent;color:var(--ink);min-height:32px;padding:0 8px;font-size:11px;font-weight:800;letter-spacing:.02em}
.theme button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.livepill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 8px;background:rgba(55,202,55,.16);color:var(--good-ink);border:1px solid var(--good);font-size:10px;font-weight:800;letter-spacing:.12em}
.livepill.wait,.livepill.stale,.livepill.down{background:rgba(233,61,61,.12);color:var(--bad);border-color:var(--bad)}
.gdot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.livepill.live .gdot{animation:blink 1.3s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.sysline{font-size:13px;font-weight:700}
.asof,.next,.clock{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.timer{margin-left:auto;text-align:right;min-width:108px}
.timer b{display:block;font-family:var(--serif);font-weight:650;font-size:26px;line-height:.9;font-variant-numeric:tabular-nums}
.timer span{display:block;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--muted);max-width:220px}
.nav{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pad{border:1px solid var(--edge);background:var(--card);color:var(--ink);border-radius:12px;min-height:44px;padding:0 12px;font-weight:800;font-size:12px;letter-spacing:.04em;box-shadow:0 3px 0 var(--edge);transform:translateY(0)}
.pad:hover{transform:translateY(1px);box-shadow:0 2px 0 var(--edge)}
.pad:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.pad:disabled{cursor:wait;opacity:.72}
.pad[aria-busy="true"]::after{content:"";display:inline-block;width:10px;height:10px;margin-left:6px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-1px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pad.on,.nav button.on{color:var(--on-ink);background:var(--on);border-color:var(--on)}
.pads{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.status{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;font-weight:800;font-size:14px;border-bottom:1px solid var(--line);background:var(--surface)}
.status svg{width:18px;height:18px;flex:none}
.status .txt{min-width:0}
.status.alert{background:rgba(233,61,61,.16);color:var(--bad-ink);border-color:var(--bad)}
.status.calm{background:rgba(24,139,246,.16);color:var(--calm-ink);border-color:var(--calm)}
.status.win{background:rgba(55,202,55,.16);color:var(--good-ink);border-color:var(--good)}
.status.wait{color:var(--muted)}
.stage{flex:1;min-height:0;position:relative}
.stage.scroll{overflow:auto}
.stage.lock{overflow:auto}
.play{height:auto;min-height:100%;overflow:visible;display:grid;grid-template-columns:minmax(250px,.76fr) minmax(360px,1.24fr);grid-template-rows:auto auto auto auto auto auto;gap:8px;padding:8px 10px;box-sizing:border-box}
.lens{grid-column:1 / -1;grid-row:1;display:flex;gap:6px}
.lens .tab{flex:1}
.lens-note{margin:4px 0 0;font-size:12px;font-weight:700;color:var(--muted)}
.hero{grid-column:1 / -1;grid-row:2;display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px 14px;align-items:center;padding:8px 12px 8px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--teal)}
.hero.bad:before{background:var(--bad)}
.hero.good:before{background:var(--good)}
.hero.calm:before{background:var(--calm)}
.ringwrap{position:relative;width:104px;height:104px;color:var(--teal)}
.ringwrap.bad{color:var(--bad)}
.ringwrap.good{color:var(--good)}
.ringwrap.calm{color:var(--calm)}
.ring{width:104px;height:104px;display:block}
.ring-arc{transition:stroke-dashoffset .9s linear}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-mid b{font-family:var(--serif);font-weight:650;font-size:17px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.ring-track{stroke:var(--track)}
.ring-mid span{margin-top:3px;font-size:8px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.hero-title{font-family:var(--serif);font-weight:560;font-size:clamp(20px,3.1vh,30px);line-height:1;margin:1px 0}
.hero-commit,.hero-pace{margin:2px 0 0;font-size:13px;font-weight:700}
.hero-money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.hero-money span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--teal)}
.hero-money b{display:block;font-family:var(--serif);font-weight:650;font-size:clamp(26px,4.4vh,40px);line-height:.9;font-variant-numeric:tabular-nums}
.hero-money b.urgent{animation:urgent 1.35s ease-in-out infinite}
.hero-money .comm,.meterfigs .comm,.paycard p.comm{display:block;font-size:13px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1.2}
.hero-money .fee,.meterfigs .fee,.paycard .fee,.est .fee,.lrow .fee{display:block;font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;font-style:normal;color:var(--muted);line-height:1.25}
.est b{display:block;font-size:13px;line-height:1.1;font-weight:800}
@keyframes urgent{50%{opacity:.45}}
.cline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.cline b{min-width:52px;font-size:12px}
.cline label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cline input{width:64px;border:1px solid var(--edge);border-radius:8px;padding:4px 6px;font-size:16px;font-weight:700;background:var(--card);color:var(--ink)}
.cline.on{background:rgba(44,123,122,.08);border-radius:10px;padding:4px 6px}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.play:has(.banner){gap:6px;padding:6px 10px}
.play:has(.banner) .col{gap:6px}
.play:has(.banner) .card{padding:8px 10px}
.play:has(.banner) .wtrack{margin-bottom:16px}
.meterbar{grid-column:1 / -1;grid-row:3}
.paycard{grid-column:1 / -1;grid-row:5;padding:8px 10px}
.dayboard{grid-column:1 / -1;grid-row:6;display:grid;gap:8px}
.paytop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.paywhen{font-family:var(--serif);font-weight:650;font-size:18px;line-height:1;color:var(--ink)}
.paygrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,.8fr);gap:2px 16px;align-items:start}
.paycard p{margin:0;font-size:12px;font-weight:700;line-height:1.25}
.paygrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(180px,.7fr) minmax(200px,.8fr);gap:8px 14px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--track);border:1px solid var(--line);margin-top:4px}
.stack i{display:block;height:100%}
.stack .sql{background:var(--teal)}
.stack .comm{background:var(--good)}
.ladder{display:grid;gap:6px;margin-top:8px}
.lrow{display:grid;grid-template-columns:52px minmax(48px,1fr) minmax(0,1.3fr);gap:6px;align-items:center;font-size:12px;font-weight:800}
.lrow span:last-child{font-weight:800;line-height:1.15}
.lrow b{display:block;height:16px;border-radius:6px;background:var(--teal);min-width:4px}
.lrow.mark b{background:var(--good)}
.lrow.on b{outline:2px solid var(--edge)}
.step{display:flex;align-items:center;gap:6px;margin-top:4px}
.step button,.tog button,.qrow button{border:1px solid var(--edge);background:var(--card);color:var(--ink);border-radius:8px;min-height:32px;padding:0 8px;font-weight:800}
.tog{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tog button.on{background:var(--on);color:var(--on-ink)}
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.funnel .chip b{font-size:16px}
.qrow{display:grid;grid-template-columns:minmax(0,1.2fr) auto auto auto 72px;gap:6px;align-items:center;padding:4px 0;border-top:1px solid rgba(44,123,122,.15);font-size:12px}
.qrow input{width:72px;border:1px solid var(--teal);border-radius:8px;padding:4px 6px;font-weight:700;background:var(--card);color:var(--ink)}
.banner.bad{background:rgba(233,61,61,.16);color:var(--bad-ink);border-color:var(--bad)}
.meterfigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meterfigs span,.meterfigs b{display:block}
.meterfigs b{font-family:var(--serif);font-weight:650;font-size:28px;line-height:.9}
.money{grid-column:1;grid-row:4;min-height:0;overflow:visible}
.long{grid-column:1;grid-row:4}
.race{grid-column:2;grid-row:4;height:auto;min-height:220px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:800}
.who{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.who h2{font-family:var(--serif);font-weight:560;font-size:28px;line-height:1}
.streak{display:flex;align-items:center;gap:6px;font-weight:800}
.streak svg{width:14px;height:20px}
.dollars{font-family:var(--serif);font-weight:650;font-size:clamp(46px,8vh,68px);line-height:.88;letter-spacing:-.03em;margin:2px 0}
.good{color:var(--good)}
.bad{color:var(--bad)}
.sub{color:var(--muted);font-size:12px}
.meter{height:14px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--good);transition:width .6s ease}
.meter.bad i{background:var(--bad);animation:pacepulse 1.15s ease-in-out infinite}
@keyframes pacepulse{50%{transform:scaleX(1.02);filter:brightness(1.25)}}
.meter.bad{background:rgba(233,61,61,.16)}
.meter.full{background:var(--good)}
.mrow{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-width:0}
.chip b{display:block;font-family:var(--serif);font-size:22px;font-weight:650;line-height:1;margin-top:2px}
.chip span{display:block;color:var(--muted);font-size:11px;line-height:1.25;margin-top:2px}
.line-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.line-in label{font-size:12px;font-weight:700;color:var(--muted)}
.line-in input{width:96px;border:1px solid var(--teal);border-radius:8px;background:var(--card);color:var(--ink);padding:6px 8px;font-size:16px}
.assume{font-size:12px;font-weight:700;margin-top:4px}
.bars{display:grid;gap:8px}
.wtrack{position:relative;height:12px;border-radius:99px;background:var(--track);margin:8px 4px 22px;overflow:visible}
.wfill{display:block;height:100%;width:0;border-radius:99px;background:var(--bad);transition:width .6s ease}
.wtrack.hit .wfill{background:var(--good)}
.wtick{position:absolute;top:-4px;width:2px;height:20px;background:var(--edge)}
.wtick span{position:absolute;top:20px;font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;text-transform:uppercase}
.wtick.promise span{left:50%;transform:translateX(-50%)}
.wtick.goal span{right:0}
.race{display:flex;flex-direction:column;min-height:220px;height:auto;overflow:visible}
.pass{font-family:var(--serif);font-weight:560;font-size:clamp(26px,4vh,40px);line-height:1.02;margin-top:2px}
.shead,.srow{display:grid;grid-template-columns:26px minmax(0,1.3fr) auto auto auto;gap:6px;align-items:center}
.est{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;font-size:12px}
.shead{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:0 8px}
.slist{flex:none;min-height:0;overflow:visible;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.srow{padding:6px 8px;border-radius:10px;opacity:.62}
.srow.near{opacity:1;background:rgba(24,139,246,.08);box-shadow:inset 3px 0 0 var(--calm)}
.srow.moved{animation:rowpop .45s ease}
@keyframes rowpop{from{transform:translateX(-10px)}to{transform:none}}
.srow.you{background:rgba(233,61,61,.1);box-shadow:inset 3px 0 0 var(--bad);opacity:1}
.srow.you.ahead{background:rgba(55,202,55,.14);box-shadow:inset 3px 0 0 var(--good)}
.rk{font-variant-numeric:tabular-nums;font-weight:800;display:flex;align-items:center;gap:2px}
.arr{width:10px;height:10px}
.nm{font-weight:750;min-width:0}
.nm-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prior{display:block;margin-top:0;font-style:normal;font-size:10px;line-height:1.15;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow:has(.prior){padding:2px 8px}
.slist:has(.prior){gap:2px}
.play:has(.prior) .pass{font-size:clamp(20px,3vh,28px)}
.you-tag{margin-left:6px;font-style:normal;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-ink);background:var(--on);border-radius:999px;padding:1px 5px}
.sets,.dials{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.sheet{padding:12px;display:grid;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h2{font-family:var(--serif);font-weight:560;font-size:28px}
.caption{font-size:16px;font-weight:750;margin:6px 0}
.src{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;list-style:none;margin:8px 0 0;padding:0;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--bad);margin-right:6px;vertical-align:middle}
.legend i.good{border-top-color:var(--good)}
.legend i.dash{border-top:1.5px dashed var(--teal)}
.legend i.shade{width:14px;height:10px;border:0;background:rgba(44,123,122,.2)}
.chart,.trend{width:100%;height:auto;display:block}
.chart text,.trend text{font-family:var(--sans);fill:var(--ink)}
.chart .gridline{stroke:var(--grid)}
.line-ink{stroke:var(--ink)}
.line-teal{stroke:var(--teal)}
.pacefig b{font-family:var(--serif);font-size:48px;line-height:.9}
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}
.krow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:750}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px}
.days,.hours{list-style:none;margin:8px 0 0;padding:0}
.days li,.hours li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid rgba(44,123,122,.15);font-size:13px}
.score{height:100%;min-height:0;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
.scoretop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--edge);background:var(--card);color:var(--ink);border-radius:12px;min-height:44px;padding:0 12px;font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--edge)}
.tab:hover{transform:translateY(1px);box-shadow:0 2px 0 var(--edge)}
.tab:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.tab.on{color:var(--on-ink);background:var(--on);border-color:var(--on)}
.behind{margin:0 12px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.behind summary{cursor:pointer;padding:12px 14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--teal);list-style:none}
.behind .inn{padding:0 14px 14px}

    if (e.target.closest && e.target.closest('[data-coach="next"]')) {
      playClick();
      state.coachStep = (state.coachStep || 0) + 1;
      if (state.coachStep >= 3) storeSet('fe-coach-' + dayKey(), '1');
      render(); return;
    }
    if (e.target.closest && e.target.closest('[data-debrief]')) { playClick(); storeSet('fe-debrief-' + dayKey(), '1'); render(); return; }
    if (e.target.closest && e.target.closest('[data-help]')) {
      playClick();
      state.guide = true;
      if (!document.getElementById('guide')) document.getElementById('stage').insertAdjacentHTML('beforeend', guideHtml());
      return;
    }
    if (e.target.closest && e.target.closest('[data-guide]')) {
      state.guide = false;
      try { localStorage.setItem(GUIDE_KEY, '1'); } catch (err) {}
      var node = document.getElementById('guide'); if (node) node.remove();
      return;
    }
    if (e.target.closest && e.target.closest('[data-retry]')) load();
  });
  document.body.addEventListener('input', function (e) {
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-cash')) {
      var cashId = e.target.getAttribute('data-cash');
      var cashRaw = String(e.target.value || '').trim();
      setFlag(cashId, 'cash', cashRaw === '' ? null : cashRaw);
      return;
    }
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-commit')) {
      var ck = e.target.getAttribute('data-commit');
      var map = loadCommitMap();
      var raw = String(e.target.value || '').trim();
      if (raw === '' || !isFinite(Number(raw)) || Number(raw) < 0) delete map[ck];
      else map[ck] = Number(raw);
      storeSet(COMMIT_KEY, JSON.stringify(map));
      paintLive();
      return;
    }
    if (!e.target || (e.target.id !== 'avg-deal' && e.target.id !== 'month-goal')) return;
    var key = e.target.id === 'avg-deal' ? AVG_KEY : GOAL_KEY;
    var v = String(e.target.value || '').trim();
    try {
      if (v === '') localStorage.removeItem(key);
      else if (isFinite(Number(v)) && Number(v) >= 0) localStorage.setItem(key, String(Number(v)));
    } catch (err) {}
    refreshMoneyCopy();
  });
  document.body.addEventListener('change', function (e) {
    if (!e.target || !e.target.getAttribute || !e.target.getAttribute('data-commit')) return;
    var raw = String(e.target.value || '').trim();
    if (raw !== '' && isFinite(Number(raw)) && Number(raw) >= 0) return;
    var map = loadCommitMap();
    delete map[e.target.getAttribute('data-commit')];
    storeSet(COMMIT_KEY, JSON.stringify(map));
    render();
  });
  document.body.addEventListener('toggle', function (e) {
    if (e.target && e.target.id === 'fine') state.fineOpen = !!e.target.open;
  }, true);
  applyTheme(themeChoice());
  if (window.matchMedia) {
    var schemeMq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function () { if (themeChoice() === 'auto') applyTheme('auto'); };
    if (schemeMq.addEventListener) schemeMq.addEventListener('change', onScheme);
    else if (schemeMq.addListener) schemeMq.addListener(onScheme);
  }
  paintChrome();
  paintNav();
  setInterval(function () {
    paintChrome();
    if (state.booted && !state.inflight && state.nextAt && Date.now() >= state.nextAt) load(false);
  }, 1000);
  load(false);
})();
</script>
</body>
</html>
