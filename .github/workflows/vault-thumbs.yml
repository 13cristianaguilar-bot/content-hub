name: Vault thumbnails

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download missing reel covers
        run: python3 scripts/fetch-vault-thumbs.py
      - name: Commit saved covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs format-vault/catalog.json index.html
          if git diff --cached --quiet; then
            echo "No new covers."
          else
            git commit -m "Save Format Vault reel covers"
            git push
          fi
