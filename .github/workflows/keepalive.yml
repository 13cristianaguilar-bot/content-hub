name: Supabase Keepalive

on:
  schedule:
    # Runs every 5 days at 8am UTC — well within the 7-day pause window
    - cron: '0 8 */5 * *'
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://udkbnlpnfyjuwlstfxhr.supabase.co/rest/v1/scripts?select=id&limit=1" \
            -H "apikey: sb_publishable_lwmiHRxf1Hdf2Z4b_aJkjg_ck7u1ms4" \
            -H "Authorization: Bearer sb_publishable_lwmiHRxf1Hdf2Z4b_aJkjg_ck7u1ms4")
          echo "Supabase response: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
            echo "Project is awake."
          else
            echo "Unexpected status $STATUS — project may still be waking."
          fi
