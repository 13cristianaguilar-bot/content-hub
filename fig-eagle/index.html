<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fig & Eagle">
<title>Fig & Eagle Command Center</title>
<meta name="description" content="Fig & Eagle Command Center. Live setter scoreboard for dials, talk time, sets, pace, and the team. Read only from GHL.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23080808' width='32' height='32' rx='7'/%3E%3Cpath fill='%23ed3039' d='M6 22h3V14H6zm5 0h3V9h-3zm5 0h3V6h-3zm5 0h3V11h-3z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#080808;--ink:#f6f5f3;--muted:#a3a3a3;--dim:#737373;
  --line:rgba(255,255,255,.08);--glass:rgba(255,255,255,.04);
  --red:#ed3039;--red-deep:#b71a23;--red-soft:#ff8a8e;
  --good:#3DDC97;--gray:#8a8f98;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:Geist,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%;background:var(--bg);height:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:var(--sans);font-size:15px;line-height:1.4;height:100%;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body[data-ready]{
  background:
    radial-gradient(880px 420px at 78% -10%,rgba(237,48,57,.28),transparent 58%),
    radial-gradient(520px 320px at 0% 0%,rgba(237,48,57,.1),transparent 50%),
    var(--bg);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(circle at 50% 0%,#000 8%,transparent 72%);
  mask-image:radial-gradient(circle at 50% 0%,#000 8%,transparent 72%);
}
button,input,textarea,select{font-family:inherit;color:inherit}
button,a,summary{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:var(--red-soft);text-decoration:none}
a:hover{color:#fff}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column}
.top{
  flex:none;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;
  min-height:44px;padding:6px 12px;background:rgba(8,8,8,.92);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.mark{width:22px;height:22px;border-radius:6px;background:#080808;border:1px solid #333;display:grid;grid-template-columns:repeat(5,1fr);gap:1px;padding:4px 3px;align-items:end;flex:none}
.mark span{display:block;background:var(--red);border-radius:1px}
.mark span:nth-child(1){height:35%}
.mark span:nth-child(2){height:60%}
.mark span:nth-child(3){height:100%}
.mark span:nth-child(4){height:55%}
.mark span:nth-child(5){height:40%}
.brand strong{font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.livepill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 8px;background:rgba(61,220,151,.12);color:var(--good);border:1px solid rgba(61,220,151,.35);font-size:10px;font-weight:800;letter-spacing:.12em}
.livepill.wait,.livepill.stale,.livepill.down{background:rgba(237,48,57,.12);color:#ffb4b4;border-color:rgba(237,48,57,.45)}
.livepill .gdot{background:currentColor;box-shadow:0 0 8px currentColor}
.gdot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);flex:none;display:inline-block}
.gdot.dim{background:#555;box-shadow:none}
.gdot.good{background:var(--good);box-shadow:0 0 8px var(--good)}
.gdot.live{animation:pulse 1.8s ease-in-out infinite}
.sysline{font-size:13px;font-weight:700}
.asof,.next,.clock{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.clock{font-family:var(--mono);margin-left:auto}
.textbtn{border:0;background:transparent;color:var(--muted);font-weight:750;font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-height:32px;padding:0 2px}
.textbtn:hover{color:#fff}
.stage{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column}
.arena{
  flex:0 0 100%;min-height:0;overflow:hidden;box-sizing:border-box;
  display:grid;grid-template-columns:minmax(0,1.18fr) minmax(300px,.86fr);
  gap:10px;padding:10px 12px;
}
.hud{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.ident{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.badge{position:relative;width:68px;height:76px;flex:none;filter:drop-shadow(0 0 10px rgba(237,48,57,.45))}
.badge svg{width:100%;height:100%;display:block}
.badge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:22px;font-weight:600;padding-top:6px}
.badge b.na{font-family:var(--sans);font-size:11px;font-weight:750;letter-spacing:0;color:var(--muted);padding:8px}
.who{min-width:0}
.who h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.6vh,46px);line-height:.95;letter-spacing:-.03em}
.meta{margin-top:3px;color:var(--muted);font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{display:flex;align-items:center;gap:6px;min-width:0}
.flame{width:22px;height:30px;display:block;filter:drop-shadow(0 0 6px rgba(237,48,57,.65))}
.flame.off{opacity:.35;filter:none}
.streak b{font-family:var(--mono);font-size:clamp(22px,3.6vh,34px);font-weight:600;letter-spacing:-.04em;line-height:1}
.streak b.na{font-family:var(--sans);font-size:13px;letter-spacing:0;color:var(--muted)}
.streak span{display:block;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
.xprow{min-width:0}
.xpbar{height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.xpbar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#b71a23,#ed3039);box-shadow:0 0 14px rgba(237,48,57,.55);transform:scaleX(0);transform-origin:left center;transition:transform .7s cubic-bezier(.22,.8,.3,1)}
.xpbar.hit i{background:var(--good);box-shadow:0 0 14px rgba(61,220,151,.45)}
.xpline{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.xpline b{color:var(--ink);font-weight:700}
.questblock{min-height:0;display:flex;flex-direction:column;gap:4px;flex:1 1 auto}
.gk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-soft);font-weight:750}
.quests{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.quest{
  min-width:0;text-align:center;border:1px solid var(--line);background:var(--glass);
  border-radius:16px;padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.quest .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.ringbox{position:relative;width:min(150px,100%);margin:4px auto 2px;aspect-ratio:1}
.ringbox svg{width:100%;height:100%;display:block}
.ringbox .ctr{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;pointer-events:none;padding:22%}
.ringbox .ctr b{font-family:var(--mono);font-size:clamp(16px,2.8vh,30px);font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.ringbox .ctr b.na{font-family:var(--sans);font-size:13px;letter-spacing:0;color:var(--muted)}
.ringbox .ctr span{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:700}
.togo{font-weight:800;font-size:clamp(12px,1.7vh,16px);line-height:1.15;margin-top:2px}
.pct{font-family:var(--mono);font-size:12px;margin-top:1px;color:var(--dim)}
.tone-low .togo,.tone-low .pct{color:var(--gray)}
.tone-mid .togo,.tone-mid .pct{color:var(--red-soft)}
.tone-hit .togo,.tone-hit .pct{color:var(--good)}
.tone-none .togo,.tone-none .pct{color:var(--dim)}
.tone-hit{box-shadow:0 0 16px rgba(61,220,151,.22),inset 0 1px 0 rgba(255,255,255,.05)}
.arc{transition:stroke-dashoffset .7s cubic-bezier(.22,.8,.3,1)}
.tone-mid .arc{filter:drop-shadow(0 0 5px rgba(237,48,57,.75))}
.tone-hit .arc{filter:drop-shadow(0 0 6px rgba(61,220,151,.8))}
.unlock{
  padding:8px 12px 10px;border-radius:14px;
  background:linear-gradient(180deg,rgba(237,48,57,.2),rgba(255,255,255,.03));
  border:1px solid rgba(237,48,57,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 28px rgba(237,48,57,.14);
}
.unlock h2{font-family:var(--serif);font-weight:400;font-size:clamp(24px,4vh,40px);line-height:1.05;letter-spacing:-.02em;margin-top:2px}
.unlock p{color:var(--muted);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{
  min-width:0;min-height:0;display:flex;flex-direction:column;gap:4px;
  padding:8px 10px 6px;border-radius:16px;border:1px solid rgba(237,48,57,.28);
  background:rgba(255,255,255,.035);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 24px rgba(237,48,57,.08);
}
.scoretop{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.scoremeta{min-width:0;flex:1 1 auto;overflow:hidden}
.scoretop .sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;flex:none}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;min-height:32px;padding:0 10px;font-weight:800;font-size:12px}
.tab.on{color:#fff;background:var(--red-deep);border-color:transparent;box-shadow:0 0 16px rgba(237,48,57,.4)}
.shead,.srow{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,.9fr) auto;column-gap:6px;align-items:center}
.shead{color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:0 8px}
.slist{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.srow{flex:1 1 0;min-height:0;overflow:hidden;align-content:center;grid-template-rows:auto 3px;row-gap:3px;padding:0 8px;border-radius:8px}
.srow.you{background:rgba(237,48,57,.16);box-shadow:inset 3px 0 0 #ed3039}
.rk{grid-row:1 / span 2;font-family:var(--mono);font-weight:600;color:var(--muted);font-size:13px}
.rk.top{color:var(--red-soft)}
.nm{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you-tag{margin-left:6px;font-style:normal;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--red);border-radius:999px;padding:1px 5px;vertical-align:1px}
.lv{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.you .lv{color:var(--ink)}
.xp{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.xp .na,.na{color:var(--muted);font-family:var(--sans);font-weight:700}
.mbar{grid-column:2 / -1;height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.mbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#b71a23,#ed3039);transition:width .7s cubic-bezier(.22,.8,.3,1)}
.srow.you .mbar i{box-shadow:0 0 8px rgba(237,48,57,.7)}
.dchip{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--line);line-height:1.3}
.dchip.act{color:#ffd0d0;border-color:rgba(237,48,57,.45);background:rgba(237,48,57,.14)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.banner{padding:6px 8px;border-radius:10px;border:1px solid rgba(237,48,57,.5);background:rgba(237,48,57,.14);font-weight:700;font-size:12px}
.stats,.behind{flex:none;margin:0 12px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03)}
.stats summary,.behind summary{cursor:pointer;padding:12px 14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--red-soft);list-style:none}
.stats summary::-webkit-details-marker,.behind summary::-webkit-details-marker{display:none}
.stats summary span,.behind summary span{letter-spacing:0;text-transform:none;color:var(--muted);font-weight:650;margin-left:8px}
.statsinn,.inn{padding:0 12px 14px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.panel h2.serif,.panel h2{font-family:var(--serif);font-weight:400;font-size:28px;letter-spacing:-.02em}
.sub,.quiet{color:var(--muted);font-size:13px;line-height:1.45}
.src{display:block;margin-top:6px;font-size:12px;color:var(--dim)}
.pacefig{display:flex;align-items:baseline;gap:10px;margin:4px 0}
.pacefig b{font-family:var(--mono);font-size:56px;font-weight:600;letter-spacing:-.05em;line-height:.85}
.pacefig b.words{font-family:var(--sans);font-size:36px;letter-spacing:-.03em}
.pacefig b.na{font-family:var(--sans);font-size:28px;color:var(--muted)}
.pacefig span{font-size:18px;font-weight:750}
.tone-behind b,.tone-behind span{color:var(--red-soft)}
.tone-ahead b,.tone-ahead span{color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;list-style:none;margin:8px 0 0;padding:0;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--red);margin-right:6px;vertical-align:middle}
.legend i.dash{border-top:1.5px dashed rgba(255,255,255,.7)}
.legend i.shade{width:14px;height:10px;border:0;background:rgba(237,48,57,.28);vertical-align:middle}
.chart,.trend{width:100%;height:auto;display:block}
.chart text,.trend text{font-family:var(--sans);fill:#a3a3a3}
.hours{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 12px}
.hours li{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;border-top:1px solid rgba(255,255,255,.06);padding:4px 0}
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}
.krow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:750}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.04em;margin-top:4px}
.big{font-family:var(--mono);font-size:42px;font-weight:600;letter-spacing:-.05em;line-height:.95;margin:6px 0}
.big span{font-size:18px;color:var(--muted);font-weight:600}
.wtrack{position:relative;height:14px;border-radius:99px;background:rgba(255,255,255,.08);margin:22px 8px 36px}
.wfill{display:block;height:100%;width:0;border-radius:99px;background:var(--red);box-shadow:0 0 16px rgba(237,48,57,.35);transition:width .7s cubic-bezier(.22,.8,.3,1)}
.wfill.on{min-width:4px}
.wtrack.hit .wfill{background:var(--good);box-shadow:0 0 16px rgba(61,220,151,.35)}
.wtick{position:absolute;top:-6px;width:2px;height:26px;background:#fff}
.wtick span{position:absolute;top:28px;white-space:nowrap;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.wtick.promise span{left:50%;transform:translateX(-50%)}
.wtick.goal span{right:0;left:auto}
.days{list-style:none;margin:10px 0 0;padding:0}
.days li{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
.days b{font-weight:750}
.days span{color:var(--muted);font-variant-numeric:tabular-nums}
.mini{margin-top:8px;border-top:1px solid var(--line)}
.mini summary{cursor:pointer;padding:8px 0;font-weight:700;color:var(--muted)}
.src-list{list-style:none;margin:8px 0 0;padding:0}
.src-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
.src-list span{color:var(--muted)}
.src-list b{font-weight:650;text-align:right}
.fail{max-width:520px;margin:8vh auto;text-align:center;padding:28px 22px}
.fail h2{font-family:var(--serif);font-weight:400;font-size:36px;margin:6px 0}
.err{color:#ffb4b4;margin-top:8px}
.btn{border:0;border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;margin-top:14px}
.btn.p{background:var(--red);color:#fff}
.emptyviz{min-height:80px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed rgba(255,255,255,.16);border-radius:14px;padding:12px}
.boot{padding:8px 4px}
footer.site{flex:none;padding:0 14px 18px;color:var(--dim);font-size:12px;line-height:1.5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes rise{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes hitglow{0%{box-shadow:0 0 0 rgba(61,220,151,0)}40%{box-shadow:0 0 22px rgba(61,220,151,.5)}100%{box-shadow:0 0 12px rgba(61,220,151,.22)}}
@media (prefers-reduced-motion:no-preference){
  .stage.enter .hud,.stage.enter .score{animation:rise .35s ease}
  .quest.tone-hit{animation:hitglow .7s ease-out 1}
}
@media (max-width:820px){
  .top{padding:calc(6px + env(safe-area-inset-top)) 10px 6px}
  .clock{margin-left:0}
  .arena{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:6px;padding:6px 8px}
  .hud{gap:5px}
  .badge{width:48px;height:54px}
  .badge b{font-size:16px;padding-top:4px}
  .who h2{font-size:26px}
  .meta{font-size:12px}
  .flame{width:16px;height:22px}
  .streak b{font-size:22px}
  .questblock{flex:none}
  .quests{gap:5px}
  .quest{padding:4px 3px 5px;border-radius:12px}
  .ringbox{width:72px;margin:2px auto}
  .ringbox .ctr{padding:18%}
  .ringbox .ctr b{font-size:15px}
  .ringbox .ctr span{font-size:9px}
  .togo{font-size:11px}
  .pct{font-size:10px}
  .unlock{padding:6px 8px 7px}
  .unlock h2{font-size:22px}
  .unlock p{font-size:11px}
  .score{padding:6px 6px 4px}
  .tab{min-height:36px;padding:0 8px}
  .shead{display:none}
  .srow{grid-template-columns:18px minmax(0,1fr) minmax(0,.72fr) auto;padding:0 4px;row-gap:2px}
  .lv{font-size:10px}
  .mbar{grid-column:2 / -1}
  .split{grid-template-columns:1fr}
  footer.site{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
}
@media (max-height:760px){
  .hud{gap:4px}
  .badge{width:40px;height:46px}
  .who h2{font-size:22px}
  .ringbox{width:56px}
  .quest{padding:2px 2px 3px}
  .pct{display:none}
  .unlock{padding:4px 8px 5px}
  .unlock h2{font-size:18px}
  .xpbar{height:8px}
  .xpline{margin-top:2px}
}
@media (prefers-reduced-motion:reduce){

    var row = findMe(data, 'today');
    var statsOpen = state.statsOpen ? ' open' : '';
    return '<section class="arena" id="play">' + hudHtml(data, row) + boardHtml(data) + '</section>' +
      '<details class="stats" id="stats"' + statsOpen + '><summary>Stats <span>Pace, week, and team trend</span></summary><div class="statsinn">' +
      paceHtml(data, row) + '<div class="split">' + weekHtml(data) + trendHtml(data) + '</div>' + badgeBook(data, row) +
      '</div></details>' + fineHtml(data, state.row) +
      '<footer class="site">Fig &amp; Eagle Command Center. Read only. Source GHL, refreshed hourly during dial blocks. <a href="../command-center/">Command Center</a></footer>';
  }
  function paintBoard() {
    var data = state.row && state.row.data;
    if (!data) return;
    document.querySelectorAll('[data-period]').forEach(function (btn) {
      var on = btn.getAttribute('data-period') === state.period;
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    var p = periodOf(data, state.period);
    var sub = document.getElementById('board-sub');
    var body = document.getElementById('board-body');
    if (sub) sub.innerHTML = boardSub(p);
    if (body) {
      body.innerHTML = boardRows(data, p);
      kick(body);
    }
    var sum = document.getElementById('livesum');
    if (sum) {
      var names = (p && Array.isArray(p.rows)) ? ranked(p.rows).map(function (r) {
        return textOr(r && r.name) + ' ' + fmtCount(r && r.xp);
      }).join(', ') : 'no data';
      sum.textContent = (p && p.label ? p.label : 'no data') + '. ' + names;
    }
  }
  function setPeriod(next) {
    if (next !== 'today' && next !== 'week' && next !== 'month') return;
    if (next === state.period) return;
    state.period = next;
    paintBoard();
    try {
      if (location.hash !== '#' + next) history.replaceState(null, '', location.pathname + location.search + '#' + next);
    } catch (e) {}
  }
  function kick(root) {
    if (!root) return;
    var token = (root._kick || 0) + 1;
    root._kick = token;
    root.querySelectorAll('.arc').forEach(function (arc) {
      arc.style.strokeDashoffset = arc.getAttribute('data-off') || '0';
    });
    root.querySelectorAll('[data-fill]').forEach(function (bar) {
      var fill = parseFloat(bar.getAttribute('data-fill') || '');
      if (!isFinite(fill)) return;
      var pct = Math.max(0, Math.min(100, fill));
      if (bar.hasAttribute('data-scale')) bar.style.transform = 'scaleX(' + (pct / 100) + ')';
      else bar.style.width = pct + '%';
    });
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var nodes = root.querySelectorAll('.count');
    if (reduce || !nodes.length) return;
    nodes.forEach(function (el) { el.textContent = el.getAttribute('data-kind') === 'talk' ? '0m' : '0'; });
    var t0 = performance.now();
    var dur = 640;
    function frame(now) {
      if (root._kick !== token) return;
      var p = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      nodes.forEach(function (el) {
        if (p >= 1) {
          el.textContent = el.getAttribute('data-final') || '';
          return;
        }
        var n = parseFloat(el.getAttribute('data-n') || '');
        if (!isFinite(n)) return;
        var v = n * e;
        el.textContent = el.getAttribute('data-kind') === 'talk' ? fmtTalk(v) : fmtCount(Math.round(v));
      });
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function paintChrome() {
    var clock = document.getElementById('clock');
    if (clock) clock.textContent = ctClock(new Date());
    var mode = 'wait';
    if (state.booted) {
      if (state.row && state.stale) mode = 'stale';
      else if (state.row) mode = 'live';
      else mode = 'down';
    }
    var pill = document.getElementById('livepill');
    if (pill) {
      pill.className = 'livepill ' + mode;
      var label = mode === 'live' ? 'LIVE' : mode === 'stale' ? 'STALE' : mode === 'down' ? 'DOWN' : 'WAIT';
      var pillt = document.getElementById('pillt');
      if (pillt) pillt.textContent = label;
    }
    var lineEl = document.getElementById('sysline');
    if (lineEl) lineEl.textContent = mode === 'live' ? 'Source GHL' : mode === 'stale' ? 'Refresh failed' : mode === 'down' ? 'Feed unavailable' : 'Checking the feed';
    var asof = document.getElementById('asof');
    if (asof) asof.textContent = 'As of ' + (state.row ? asOfText(state.row) : 'no data');
    var next = document.getElementById('next');
    if (next) {
      if (!state.booted || state.inflight) next.textContent = 'Reading';
      else next.textContent = 'Next read ' + fmtRemain(state.nextAt - Date.now());
    }
  }
  function render() {
    var stage = document.getElementById('stage');
    var scroller = stage;
    var y = scroller ? scroller.scrollTop : 0;
    var first = !state.rendered;
    stage.innerHTML = stageHtml();
    if (first) {
      stage.classList.add('enter');
      state.rendered = true;
      document.body.setAttribute('data-ready', '');
    } else stage.classList.remove('enter');
    var sum = document.getElementById('livesum');
    if (sum) sum.textContent = summaryText(state.row && state.row.data, state.row && findMe(state.row.data, 'today'));
    paintChrome();
    if (scroller) scroller.scrollTop = y;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { kick(stage); });
    });
  }
  function openStats() {
    var d = document.getElementById('stats');
    if (!d) return;
    d.open = true;
    state.statsOpen = true;
    d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  async function load() {
    if (state.inflight) return;
    state.inflight = true;
    paintChrome();
    try {
      var row = normalize(await fetchRow());
      state.row = row;
      state.error = '';
      state.stale = false;
      state.fetchedAt = new Date().toISOString();
      state.nextAt = Date.now() + REFRESH_MS;
      state.booted = true;
      render();
    } catch (err) {
      state.error = errText(err);
      state.fetchedAt = state.fetchedAt || new Date().toISOString();
      state.stale = !!state.row;
      state.nextAt = Date.now() + REFRESH_MS;
      state.booted = true;
      render();
    } finally {
      state.inflight = false;
      paintChrome();
    }
  }
  document.body.addEventListener('click', function (e) {
    var tab = e.target.closest && e.target.closest('[data-period]');
    if (tab) {
      setPeriod(tab.getAttribute('data-period'));
      return;
    }
    if (e.target.closest && e.target.closest('[data-stats]')) {
      openStats();
      return;
    }
    if (e.target.closest && e.target.closest('[data-retry]')) load();
  });
  document.body.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var tab = e.target.closest && e.target.closest('[data-period]');
    if (!tab) return;
    var keys = ['today', 'week', 'month'];
    var i = keys.indexOf(state.period);
    if (i < 0) i = 0;
    i = e.key === 'ArrowRight' ? (i + 1) % keys.length : (i + keys.length - 1) % keys.length;
    setPeriod(keys[i]);
    var focus = document.querySelector('[data-period="' + state.period + '"]');
    if (focus) focus.focus();
  });
  document.body.addEventListener('toggle', function (e) {
    if (!e.target) return;
    if (e.target.id === 'fine') state.fineOpen = !!e.target.open;
    if (e.target.id === 'stats') state.statsOpen = !!e.target.open;
  }, true);
  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if ((h === 'today' || h === 'week' || h === 'month') && h !== state.period) {
      state.period = h;
      paintBoard();
    }
    if (h === 'stats' || h === 'pace' || h === 'trend') openStats();
  });
  paintChrome();
  setInterval(function () {
    paintChrome();
    if (state.booted && !state.inflight && state.nextAt && Date.now() >= state.nextAt) load();
  }, 1000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.booted && !state.inflight && state.nextAt && Date.now() >= state.nextAt) load();
  });
  load();
})();
</script>
</body>
</html>
