<style>
:root{
  --bg:#080808;--ink:#f6f5f3;--muted:#a3a3a3;--dim:#737373;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased}

button,a{font-family:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:var(--red-soft);text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-height:40px;padding:6px 12px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.92)}
.brand{display:flex;align-items:center;gap:8px}

.brand .mark span{display:block;background:var(--red);border-radius:1px}
.brand .mark span:nth-child(1){height:35%}.brand .mark span:nth-child(2){height:60%}.brand .mark span:nth-child(3){height:100%}.brand .mark span:nth-child(4){height:55%}.brand .mark span:nth-child(5){height:40%}
.brand strong{font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.livepill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 8px;background:rgba(61,220,151,.12);color:var(--good);border:1px solid rgba(61,220,151,.35);font-size:10px;font-weight:800;letter-spacing:.12em}

.gdot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;display:inline-block}

.nav{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.88)}

.nav button.on{color:#fff;background:var(--red-deep);border-color:transparent;box-shadow:0 0 16px rgba(237,48,57,.35)}
.helpbtn{margin-left:auto;width:36px;min-height:36px;padding:0;border-radius:999px}
.stage{flex:1;min-height:0}
.stage.scroll{overflow:auto}
.stage.lock{overflow:hidden}
.play{height:100%;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.82fr);gap:10px;padding:10px 12px;box-sizing:border-box}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.ident{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}

.streak span{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.xpbar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}

.gk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-soft);font-weight:800}

.ringbox svg{width:100%;height:100%;display:block}
.ringbox .ctr{position:absolute;inset:0;display:grid;place-items:center;align-content:center;padding:20%;text-align:center}

.togo{font-weight:800;font-size:13px;line-height:1.15}
.qmark{color:var(--dim);font-size:11px;margin-top:2px;line-height:1.25}
.tone-low .togo{color:var(--gray)}
.tone-mid .togo{color:var(--red-soft)}
.tone-hit .togo{color:var(--good)}
.tone-hit{box-shadow:0 0 16px rgba(61,220,151,.28)}
.arc{transition:stroke-dashoffset .7s cubic-bezier(.22,.8,.3,1)}
.tone-mid .arc{filter:drop-shadow(0 0 4px rgba(237,48,57,.7))}
.tone-hit .arc{filter:drop-shadow(0 0 6px rgba(61,220,151,.8))}
.move,.challenge,.rival,.preview{border-radius:14px;border:1px solid rgba(237,48,57,.4);background:linear-gradient(180deg,rgba(237,48,57,.16),rgba(255,255,255,.03));padding:10px 12px;min-width:0}
.move{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-start}
.move h2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,3.4vh,34px);line-height:1.08;margin-top:4px}
.move p,.challenge p,.rival p{color:var(--muted);font-size:12px;margin-top:4px}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:var(--red);transition:width .7s cubic-bezier(.22,.8,.3,1)}
.meter.ahead i{background:var(--good)}
.meter.even i{background:#f6f5f3}
.sidepair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rival b,.challenge b.big{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.03em}
.gaptext{font-family:var(--serif);font-weight:400;font-size:clamp(18px,2.6vh,26px);line-height:1.1;color:var(--ink);margin-top:2px}
.preview h2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,3vh,30px);line-height:1;margin-top:2px}
.sheet{padding:12px;display:grid;gap:12px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.panel h2{font-family:var(--serif);font-weight:400;font-size:28px;letter-spacing:-.02em}
.sub,.quiet{color:var(--muted);font-size:13px;line-height:1.45}
.src{display:block;margin-top:6px;font-size:12px;color:var(--dim)}
.caption{font-size:16px;font-weight:700;margin:6px 0}
.pacefig{display:flex;align-items:baseline;gap:8px}
.pacefig b{font-family:var(--mono);font-size:48px;letter-spacing:-.04em;line-height:.9}
.pacefig b.words{font-family:var(--sans);font-size:32px}
.pacefig b.na{font-family:var(--sans);font-size:28px;color:var(--muted)}
.tone-behind b,.tone-behind span{color:var(--red-soft)}
.tone-ahead b,.tone-ahead span{color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;list-style:none;margin:8px 0 0;padding:0;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--red);margin-right:6px;vertical-align:middle}
.legend i.dash{border-top:1.5px dashed rgba(255,255,255,.7)}
.legend i.shade{width:14px;height:10px;border:0;background:rgba(237,48,57,.28)}
.chart,.trend{width:100%;height:auto;display:block}
.chart text,.trend text{font-family:var(--sans);fill:#a3a3a3}
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}
.krow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:750}
.kpi .v{font-family:var(--mono);font-size:22px;margin-top:2px}
.big{font-family:var(--mono);font-size:40px;letter-spacing:-.04em;margin:4px 0}
.big span{font-size:16px;color:var(--muted)}
.wtrack{position:relative;height:12px;border-radius:99px;background:rgba(255,255,255,.08);margin:18px 8px 32px}
.wfill{display:block;height:100%;width:0;border-radius:99px;background:var(--red);transition:width .7s cubic-bezier(.22,.8,.3,1)}
.wtrack.hit .wfill{background:var(--good)}
.wtick{position:absolute;top:-5px;width:2px;height:22px;background:#fff}
.wtick span{position:absolute;top:24px;white-space:nowrap;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.wtick.promise span{left:50%;transform:translateX(-50%)}
.wtick.goal span{right:0}
.days{list-style:none;margin:8px 0 0;padding:0}
.days li{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;padding:6px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
.hours{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 12px}
.hours li{font-size:13px;color:var(--muted);border-top:1px solid rgba(255,255,255,.06);padding:4px 0}
.score{height:100%;min-height:0;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
.scoretop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;min-height:36px;padding:0 12px;font-weight:800;font-size:13px}
.tab.on{color:#fff;background:var(--red-deep);border-color:transparent}
.gapline{border:1px solid rgba(237,48,57,.4);border-radius:12px;padding:8px 12px;background:rgba(237,48,57,.1)}
.gapline strong{font-family:var(--serif);font-weight:400;font-size:26px}
.shead,.srow{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,.8fr) auto;column-gap:8px;align-items:center}
.shead{color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:0 8px}
.slist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px}
.srow{position:relative;padding:6px 8px 8px;border-radius:8px}
.srow.you{background:rgba(237,48,57,.16);box-shadow:inset 3px 0 0 #ed3039}
.srow.above{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.rk{font-family:var(--mono);color:var(--muted)}
.rk.top{color:var(--red-soft)}
.nm{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you-tag{margin-left:6px;font-style:normal;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--red);border-radius:999px;padding:1px 5px}
.lv{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{font-family:var(--mono);text-align:right}
.mbar{grid-column:2 / -1;height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}

.dchip{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;border:1px solid var(--line);color:var(--muted);margin:2px 4px 0 0}
.dchip.act{color:#ffd0d0;border-color:rgba(237,48,57,.45);background:rgba(237,48,57,.14)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.banner{padding:8px 10px;border-radius:10px;border:1px solid rgba(237,48,57,.5);background:rgba(237,48,57,.14);font-weight:700;font-size:13px}
.levelup{border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.12);color:var(--good)}
.behind{margin:0 12px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03)}
.behind summary{cursor:pointer;padding:12px 14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--red-soft);list-style:none}
.behind .inn{padding:0 14px 14px}
.src-list{list-style:none;margin:8px 0 0;padding:0}
.src-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
.src-list span{color:var(--muted)}
.fail{max-width:520px;margin:8vh auto;text-align:center}
.fail h2{font-family:var(--serif);font-weight:400;font-size:32px}
.err{color:#ffb4b4}
.btn{border:0;border-radius:999px;min-height:40px;padding:0 16px;font-weight:800;background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.emptyviz{min-height:80px;display:grid;place-items:center;color:var(--muted);border:1px dashed rgba(255,255,255,.16);border-radius:12px}
.stage{position:relative}
.guide{position:fixed;inset:0;z-index:30;background:rgba(8,8,8,.82);display:grid;place-items:center;padding:16px}
.guide article{width:min(520px,100%);border:1px solid rgba(237,48,57,.5);border-radius:18px;background:#0e0e0e;padding:18px 18px 14px;box-shadow:0 0 32px rgba(237,48,57,.2)}
.guide h2{font-family:var(--serif);font-weight:400;font-size:32px;margin:6px 0}
.guide p{color:var(--muted);margin-top:6px}
.guide .row{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.mini summary{cursor:pointer;color:var(--muted);padding:8px 0}
footer.site{padding:0 14px 16px;color:var(--dim);font-size:12px}
@keyframes hitglow{0%{box-shadow:0 0 0 rgba(61,220,151,0)}40%{box-shadow:0 0 22px rgba(61,220,151,.55)}100%{box-shadow:0 0 12px rgba(61,220,151,.25)}}
@media (prefers-reduced-motion:no-preference){.qcard.tone-hit{animation:hitglow .7s ease-out 1}}
@media (max-width:820px){
  .top{padding:calc(6px + env(safe-area-inset-top)) 10px 6px}

  .ringbox{width:64px}
  .scoretop{flex-direction:column}
  .tabs{width:100%}
  .badge{width:44px;height:50px}
  .who h2{font-size:24px}

  .sidepair{grid-template-columns:1fr 1fr}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none !important;transition:none !important}}
</style>

<body>
<h1 class="sr">Fig &amp; Eagle Command Center</h1>
<p class="sr" id="livesum" aria-live="polite"></p>

</div>
<script>

    root.querySelectorAll('[data-fill]').forEach(function (bar) {
      var fill = parseFloat(bar.getAttribute('data-fill') || '');
      if (!isFinite(fill)) return;
      var pct = Math.max(0, Math.min(100, fill));
      if (bar.hasAttribute('data-scale')) bar.style.transform = 'scaleX(' + (pct / 100) + ')';
      else bar.style.width = pct + '%';
    });
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || state.animated) return;
    var nodes = root.querySelectorAll('.count');
    if (!nodes.length) return;
    state.animated = true;
    nodes.forEach(function (el) { el.textContent = el.getAttribute('data-kind') === 'talk' ? '0m' : '0'; });
    var t0 = performance.now();
    function frame(now) {
      var p = Math.min(1, (now - t0) / 640);
      var e = 1 - Math.pow(1 - p, 3);
      nodes.forEach(function (el) {
        if (p >= 1) { el.textContent = el.getAttribute('data-final') || ''; return; }
        var n = parseFloat(el.getAttribute('data-n') || '');
        if (!isFinite(n)) return;
        el.textContent = el.getAttribute('data-kind') === 'talk' ? fmtTalk(n * e) : fmtCount(Math.round(n * e));
      });
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function paintChrome() {
    var clock = document.getElementById('clock');
    if (clock) clock.textContent = ctClock(new Date());
    var mode = !state.booted ? 'wait' : (state.row && state.stale ? 'stale' : (state.row ? 'live' : 'down'));
    var pill = document.getElementById('livepill');
    if (pill) {
      pill.className = 'livepill ' + mode;
      var label = mode === 'live' ? 'LIVE' : mode === 'stale' ? 'STALE' : mode === 'down' ? 'DOWN' : 'WAIT';
      var t = document.getElementById('pillt'); if (t) t.textContent = label;
    }
    var line = document.getElementById('sysline');
    if (line) line.textContent = mode === 'live' ? 'Source GHL' : mode === 'stale' ? 'Refresh failed' : mode === 'down' ? 'Feed unavailable' : 'Checking the feed';
    var asof = document.getElementById('asof');
    if (asof) asof.textContent = 'As of ' + (state.row ? asOfText(state.row) : 'no data');
    var next = document.getElementById('next');
    if (next) next.textContent = (!state.booted || state.inflight) ? 'Reading' : ('Next read ' + fmtRemain(state.nextAt - Date.now()));
  }
  function render() {
    var stage = document.getElementById('stage');
    stage.innerHTML = stageHtml();
    paintNav();
    if (!state.rendered) { state.rendered = true; document.body.setAttribute('data-ready', ''); }
    var sum = document.getElementById('livesum');
    if (sum && state.row) {
      var data = state.row.data, row = findMe(data, 'today'), move = nextMove(data, row);
      sum.textContent = meName(data) + '. ' + move.line + '. As of ' + asOfText(state.row) + '.';
    }
    paintChrome();
    requestAnimationFrame(function () { requestAnimationFrame(function () { kick(stage); }); });
  }
  function setView(view) {
    if (view !== 'play' && view !== 'board' && view !== 'stats') return;
    state.view = view;
    try { history.replaceState(null, '', location.pathname + location.search + '#' + view); } catch (e) {}
    render();
    var stage = document.getElementById('stage');
    if (stage) stage.scrollTop = 0;
  }
  async function load() {
    if (state.inflight) return;
    state.inflight = true;
    paintChrome();
    try {
      state.row = normalize(await fetchRow());
      state.error = ''; state.stale = false;
      state.fetchedAt = new Date().toISOString();
      state.nextAt = Date.now() + REFRESH_MS;
      state.booted = true;
      render();
    } catch (err) {
      state.error = errText(err);
      state.stale = !!state.row;
      state.nextAt = Date.now() + REFRESH_MS;
      state.booted = true;
      render();
    } finally { state.inflight = false; paintChrome(); }
  }
  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (h === 'play' || h === 'board' || h === 'stats') {
      if (h !== state.view) { state.view = h; render(); var stage = document.getElementById('stage'); if (stage) stage.scrollTop = 0; }
    } else if (h === 'today' || h === 'week' || h === 'month') {
      state.view = 'board'; state.period = h; render();
    }
  });
  document.body.addEventListener('click', function (e) {
    var view = e.target.closest && e.target.closest('[data-view]');
    if (view) { setView(view.getAttribute('data-view')); return; }
    var tab = e.target.closest && e.target.closest('[data-period]');
    if (tab) {
      var next = tab.getAttribute('data-period');
      if (next && next !== state.period) { state.period = next; paintBoard(); }
      return;
    }
    if (e.target.closest && e.target.closest('[data-help]')) {
      state.guide = true; state.guideStep = 0;
      var host = document.getElementById('stage');
      if (host && !document.getElementById('guide')) host.insertAdjacentHTML('beforeend', guideHtml());
      return;
    }
    var g = e.target.closest && e.target.closest('[data-guide]');
    if (g) {
      var act = g.getAttribute('data-guide');
      if (act === 'back') state.guideStep = Math.max(0, state.guideStep - 1);
      else if (state.guideStep >= 2) {
        state.guide = false;
        try { localStorage.setItem(GUIDE_KEY, '1'); } catch (err) {}
        var node = document.getElementById('guide'); if (node) node.remove();
        return;
      } else state.guideStep += 1;
      var old = document.getElementById('guide');
      if (old) old.outerHTML = guideHtml();
      return;
    }
    if (e.target.closest && e.target.closest('[data-retry]')) load();
  });
  document.body.addEventListener('toggle', function (e) {
    if (e.target && e.target.id === 'fine') state.fineOpen = !!e.target.open;
  }, true);
  paintChrome();
  paintNav();
  setInterval(function () {
    paintChrome();
    if (state.booted && !state.inflight && state.nextAt && Date.now() >= state.nextAt) load();
  }, 1000);
  load();
})();
</script>
</body>
</html>
