      ${modeChip}${statusChip}
    </div>` : '';

  // The full mode/status tabs block -- unchanged markup, just shown/hidden. Clients always see
  // it (no Filters pill for them); admin only sees it when the pill is expanded.
  const expandedFilterBlock = (viewTab === 'list' && (!isAdmin || filtersOpen)) ? `
    ${modeTabs}
    <div class="flex gap-2 overflow-x-auto no-scrollbar">${statusTabs}</div>` : '';

  // Glowing "New Scripts" banner — client-only, shows when Needs Review count > 0. Keeps
  // working from Calendar/Pipeline too (it's meaningless outside List, so it routes there).
  const nrCount = !isAdmin ? (countByStatus['Needs Review'] || 0) : 0;
  const newScriptsBanner = nrCount > 0 ? `
    <div class="px-4 pt-4">
      <button onclick="viewMode='all'; viewTab='list'; listSearch=''; setStatus2('Needs Review')"
        class="new-scripts-glow w-full rounded-2xl overflow-hidden text-left"
        style="background:linear-gradient(135deg,#16a34a 0%,#22c55e 100%);display:block;">
        <div class="px-5 py-4 flex items-center justify-between">
          <div>
            <div class="text-white font-bold text-base tracking-tight">🎬 ${nrCount} new script${nrCount === 1 ? '' : 's'} ready to film</div>
            <div class="text-green-100 text-xs mt-1">Tap to review →</div>
          </div>
          <div class="text-white font-black leading-none" style="font-size:3rem;opacity:0.9;">${nrCount}</div>
        </div>
      </button>
    </div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="hub-shell min-h-screen flex flex-col relative">

      <!-- Sticky header. Spacing lives on the header itself so Calendar/Pipeline don't
           double up with the toggle's own margin. -->
      <div class="hub-header">
        ${headerRow1}
        ${viewToggle}
        ${filtersRow}
        ${expandedFilterBlock}
      </div>

      <!-- Settings popover (Item 2) -- backdrop first (so it's visually "behind"), panel
           second. Both are siblings of the sticky header (not nested inside it) so z-index
           comparisons aren't capped by the header's own stacking context. -->
      ${settingsBackdrop}
      ${settingsPanel}

      <!-- New Scripts glowing banner — appears when Needs Review count > 0 -->
      ${newScriptsBanner}

      <!-- Client guide -- dismissible, never shown to admin -->
      ${(!isAdmin && showHelp) ? `
      <div class="px-4 pt-4">
        <div class="bg-violet-50 border border-violet-100 rounded-2xl p-4 relative">
          <button onclick="toggleHelp()" aria-label="Dismiss guide" class="absolute top-3 right-3 text-violet-300 hover:text-violet-500 text-xs">✕</button>
          <div class="font-semibold text-violet-700 text-sm mb-2">How this works</div>
          <ul class="text-xs text-violet-800 space-y-1.5 leading-relaxed">
            <li>🧪 <b>In Testing</b> — scripts with a few different versions to compare. <b>All Scripts</b> is everything else.</li>
            <li><b>Take A / B / C</b> tabs on a card — same idea, different opening hooks. Tap each one to compare before you film.</li>
            <li>Each card is a shot card: reference, your line, the script or question sheet, setup, a shot checklist, on-screen text, then the CTA.</li>
            <li><b>Full screen</b> opens a teleprompter. Pinch is not required — use A+ and Play.</li>
            <li><b>Film this</b> means you are shooting it as written. <b>Request a tweak</b> sends it back. <b>Pass</b> skips it.</li>
            ${CLIENT_VIEW_TABS ? `
            <li>📅 <b>Calendar</b> — see what's scheduled to post on any given day, and what hasn't been dated yet.</li>
            <li>📊 <b>Pipeline</b> — see how many scripts are at each stage, from draft to posted.</li>` : ''}
          </ul>
          <button onclick="toggleHelp()" class="mt-3 text-xs font-semibold text-violet-600 hover:text-violet-700">Got it →</button>
        </div>
      </div>` : ''}

      <!-- Body: List cards, or the Calendar/Pipeline view -->
      <div class="flex-1 px-4 py-4 space-y-3 pb-10">
        ${body}
      </div>
    </div>`;

  // Day-panel scroll (Calendar view only) -- DOM is fully rebuilt above, so the panel can't
  // be scrolled to until after this innerHTML assignment. See renderCalendar() for details.
  // One-shot: only consume calScrollPending (set by an actual day-tap/jump-to-date action),
  // never re-derive from calSelectedDay existing -- that would re-fire the scroll on every
  // unrelated redraw while a day stays selected (realtime updates, take-tab taps, status
  // buttons inside the day panel, expanding unscheduled, month nav).
  if (calScrollPending) { calScrollPending = false; scrollToDayPanel(); }

  // Restore the Next-7-days strip's scroll position captured at the top of this function --
  // same requestAnimationFrame-after-rebuild technique as scrollToDayPanel(), just for
  // scrollLeft instead of scrollIntoView. A no-op when the strip isn't in the DOM (not on
  // Calendar) or was already at scrollLeft 0.
  requestAnimationFrame(() => {
    const el = document.getElementById('next7-strip');
    if (el) el.scrollLeft = next7ScrollLeft;
  });

  // F2 -- single source of truth for "remember last view" persistence (admin only), instead of
  // requiring every individual navigation action to remember to call saveLastView() itself.
  // jumpToList() (Pipeline/Calendar -> List) was exactly this gap: it changes viewSlug/viewTab
  // just like setClient()/setViewTab() do, but never saved, so "Where I left off" silently
  // stopped reflecting reality after a jump-in. Runs once per render and compares against what's
  // already saved so it's a no-op write when nothing actually changed.
  if (isAdmin && user) {
    const saved = loadLastView(user.id);
    if (!saved || saved.viewSlug !== viewSlug || saved.viewTab !== viewTab) saveLastView();
  }

  // K1 -- restore keyboard focus into the just-rebuilt DOM, if a settings change captured it
  // above. No-op when nothing was captured (every other redraw path).
  restoreFocusAfterRedraw();
}

// ─────────────────────────────────────────────
// SETTINGS POPOVER (Item 2) — admin only. Anchored top-right under the header row, closes on
// backdrop tap / Escape / its own ✕. Changing a setting does NOT close it (so you can see the
// "Currently: ..." line update live, or flip the color-key toggle and immediately see the
// calendar react, without the panel snapping shut).
// ─────────────────────────────────────────────
function renderSettingsPanel() {
  // "Currently: ..." reflects whatever is actually SAVED to localStorage (what would be
  // restored on the next sign-in), not just the live in-memory state -- the two normally match
  // (renderDashInner() centrally calls saveLastView() once per render whenever viewSlug/viewTab
  // changed, see F2 there), but this is the one piece of UI that makes the otherwise-invisible
  // "remember last view" rule inspectable.
  const saved = user ? loadLastView(user.id) : null;
  const curSlug = (saved && CLIENTS[saved.viewSlug]) ? saved.viewSlug : viewSlug;
  const curTab  = (saved && VIEW_TABS.includes(saved.viewTab)) ? saved.viewTab : viewTab;
  const curTabLabel = VIEW_TAB_LABEL[curTab];
  const curClientLabel = CLIENTS[curSlug]?.label || curSlug;
  const currentlyLine = `${curTabLabel} · ${curClientLabel}`;

  const openOptions = [
    { v: 'last',     label: 'Where I left off' },
    { v: 'list',     label: 'List' },
    { v: 'calendar', label: 'Calendar' },
    { v: 'pipeline', label: 'Pipeline' },
  ];

  const radioRows = openOptions.map(o => `
    <label class="flex items-start gap-2.5 py-2 cursor-pointer">
      <input type="radio" name="openOnSignIn" value="${o.v}" data-focus-id="signin-${o.v}" ${settingOpenOnSignIn === o.v ? 'checked' : ''}
        onchange="window.setOpenOnSignIn('${o.v}')" class="mt-0.5 accent-slate-800">
      <span class="flex-1">
        <span class="block text-sm text-slate-700">${o.label}</span>
        ${o.v === 'last' ? `<span class="block text-[11px] text-slate-400 mt-0.5">Currently: ${currentlyLine}</span>` : ''}
      </span>
    </label>`).join('');

  return `
  <!-- C2 -- this outer wrapper is "fixed inset-x-0 top-0", anchored to the VIEWPORT, not to the
       page's scrolling flow. The old markup put "absolute" directly on the panel, positioned
       relative to the outer page wrapper (which scrolls with the page) -- so scrolling down even
       slightly carried the panel off-screen while the gear icon (sticky header) stayed visible,
       and the still-fixed, still-full-viewport backdrop kept eating the next tap. The wrapper
       itself has no height (zero-height box, "pointer-events-none") so it can't block clicks
       outside the panel; the panel re-enables pointer-events on itself. Constraining the inner
       column to "max-w-xl mx-auto" keeps the panel lined up with the rest of the app's content
       column exactly like before.

       K2 -- id="settings-panel" is how the document-level Tab-trap keydown listener (see its
       declaration above) finds this panel's focusable controls without needing its own
       per-render listener. max-h-[calc(100vh-5rem)]/overflow-y-auto keeps the whole panel
       reachable (scrollable) on a short/landscape screen instead of letting its bottom content
       get cut off with no way to scroll down to it. -->
  <div class="fixed inset-x-0 top-0 z-40 pointer-events-none">
    <div class="hub-shell relative">
      <div id="settings-panel" class="pointer-events-auto absolute right-4 top-16 w-72 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white rounded-2xl border border-slate-200 shadow-lg p-4" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm font-bold text-slate-800">Settings</div>
          <button data-focus-id="settings-close" onclick="window.closeSettings()" aria-label="Close settings" class="text-slate-300 hover:text-slate-500 text-sm w-7 h-7 flex items-center justify-center flex-shrink-0">✕</button>
        </div>

        <div class="mb-1">
          <div id="open-on-signin-label" class="text-[11px] font-semibold text-slate-400 uppercase tracking-widest mb-1">Open on sign-in</div>
          <div class="divide-y divide-slate-100" role="radiogroup" aria-labelledby="open-on-signin-label">${radioRows}</div>
        </div>

        <div class="border-t border-slate-100 mt-2 pt-3 flex items-center justify-between gap-3">
          <div id="always-show-key-label" class="text-sm text-slate-700">Always show color key</div>
          <button data-focus-id="always-show-key" onclick="window.toggleAlwaysShowKey()" role="switch" aria-checked="${settingAlwaysShowKey}" aria-labelledby="always-show-key-label"
            class="relative w-11 h-6 rounded-full flex-shrink-0 transition-colors ${settingAlwaysShowKey ? 'bg-slate-800' : 'bg-slate-200'}">
            <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform ${settingAlwaysShowKey ? 'translate-x-5' : ''}"></span>
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

// Shared by the dossier "Full script" box and the legacy expanded "Script" block. `s.id` is a

function copyScriptButton(s) {

function isDossierStyle(s) {

      <div class="mt-3 pt-4 px-3.5 pb-3.5 border-2 border-slate-200 rounded-2xl bg-white shadow-md">

        ${(s.format === 'Reaction' && s.clip_directions) ? `

        ${s.hook ? `
        <div class="bg-violet-50 border-2 border-violet-200 rounded-xl px-4 py-3.5 mb-2.5">

// ─────────────────────────────────────────────
// SHOT CARD — phone-first filming view. Parsers only reorganize text that
// already lives on the row. Every column is also printed, raw, under All fields.
// ─────────────────────────────────────────────
function asText(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); }
}
function clipText(str, n) {
  str = (str || '').trim();
  if (str.length <= n) return str;
  const cut = str.slice(0, n - 1);
  const sp = cut.lastIndexOf(' ');
  return ((sp > 40 ? cut.slice(0, sp) : cut).trim()) + '…';
}
function wordCount(text) {
  const m = String(text || '').trim().match(/\S+/g);
  return m ? m.length : 0;
}
function readLabel(text) {
  const w = wordCount(text);
  if (!w) return '';
  const sec = Math.max(1, Math.round((w / 150) * 60));
  const time = sec < 60 ? sec + ' sec' : Math.round(sec / 60) + ' min';
  return w + ' words · about ' + time;
}

function parseHookPair(hook) {
  const raw = asText(hook).trim();
  if (!raw) return { proven: '', adapted: '', raw: '' };
  const parts = raw.split(/\n(?=ADAPTED\b)/i);
  let proven = '', adapted = '';
  parts.forEach(part => {
    const p = part.trim();
    if (/^ADAPTED\b/i.test(p)) adapted = p.replace(/^ADAPTED\b[^:\n]*:\s*/i, '').trim();
    else if (/PROVEN HOOK/i.test(p)) proven = p.replace(/^[\s\S]*?PROVEN HOOK\b[^:\n]*:\s*/i, '').trim();
  });
  adapted = adapted.replace(/\n?On-screen bold caps:[\s\S]*$/i, '').trim();
  if (!proven && !adapted) return { proven: '', adapted: raw, raw };
  return { proven, adapted, raw };
}

function parseSetup(setup, camera) {
  const text = asText(setup).trim();
  const labeled = (name) => {
    // Labels are often inline ("…pass. LOCATION: Fairmont…"), not only at the start of a line.
    const m = text.match(new RegExp('(?:^|[\\n.]\\s*)' + name + '\\s*:\\s*([^\\n]+)', 'i'));
    return m ? m[1].trim() : '';
  };
  let location = labeled('LOCATION');
  let mic = labeled('MIC TIP') || labeled('MIC');
  let shots = '';
  const sm = text.match(/(?:^|\n)\s*SHOT LIST\s*:\s*([\s\S]*?)(?=\n\s*(?:TIME|MIC|LOCATION|HANDHELD OPTION|FRAMING|PHONE)\b|$)/i);
  if (sm) shots = sm[1].trim();
  let rig = '';
  const rigSentence = text.split(/(?<=\.)\s+|\n/).map(s => s.trim()).find(s => /handheld|tripod|gimbal|\bphone\b/i.test(s));
  if (rigSentence) rig = rigSentence.replace(/\s+/g, ' ').trim();
  if (!mic) {
    const mm = text.match(/[^.!\n]*\b(lav|shotgun|wireless mic|dji mic|clip\/wireless mic|mic)[^.!\n]*[.!]?/i);
    if (mm) mic = mm[0].trim();
  }
  const cam = asText(camera).trim();
  let framing = '';
  if (cam && /fram|chest|head-on|vertical|eye|two-shot|close|medium/i.test(cam)) framing = cam;
  if (!framing) {
    const fm = text.match(/[^.!\n]*\b(framing|head-on|chest-up|mid-chest|eye height)[^.!\n]*[.!]?/i);
    if (fm) framing = fm[0].trim();
  }
  return { location, rig, framing, mic, shots, raw: text, camera: cam };
}

function parseShots(raw) {
  raw = (raw || '').trim();
  if (!raw) return [];
  const out = [];
  const re = /(\d+)\)\s*([\s\S]*?)(?=\s*\d+\)|$)/g;
  let m;
  while ((m = re.exec(raw))) {
    const t = m[2].trim().replace(/[.\s]+$/, '');
    if (t) out.push(t);
  }
  if (out.length) return out;
  if (raw.includes('→')) return raw.split(/\s*→\s*/).map(s => s.trim()).filter(Boolean);
  return [raw];
}

function parseOnScreen(notes, hook) {
  const items = [];
  const text = [asText(notes), asText(hook)].filter(Boolean).join('\n');
  const block = text.match(/ON-SCREEN TEXT\s*:\s*([^\n]+)/i);
  if (block) {
    block[1].split(/\s+\/\s+/).forEach(part => {
      const p = part.trim();
      if (!p) return;
      const tm = p.match(/^(\d{1,2}:\d{2})\s+([\s\S]+)$/);
      if (tm) items.push({ t: tm[1], text: tm[2].trim() });
      else items.push({ t: '', text: p });
    });
  }
  const re = /on-screen(?:\s+text)?(?:\s+at)?\s*(\d{1,2}:\d{2})\s*:\s*["“']?([^"\n”']+)/gi;
  let m;
  while ((m = re.exec(text))) {
    const tx = m[2].trim();
    if (!items.some(i => i.t === m[1] && i.text.slice(0, 16) === tx.slice(0, 16))) items.push({ t: m[1], text: tx });
  }
  const lt = text.match(/lower third at\s*(\d{1,2}:\d{2})\s*:\s*([^\n]+)/i);
  if (lt) items.push({ t: lt[1], text: lt[2].trim() });
  const caps = asText(hook).match(/On-screen bold caps:\s*([^\n]+)/i);
  if (caps) items.unshift({ t: '0:00', text: caps[1].trim() });
  const ov = asText(notes).match(/OVERLAYS:\s*([^\n]+)/i);
  if (ov) items.push({ t: '', text: ov[1].trim() });
  return items;
}

function parsePasses(notes) {
  const raw = asText(notes);
  if (!/7-PASS/i.test(raw)) return [];
  const body = raw.split(/7-PASS REVIEW\s*:?/i)[1] || '';
  const out = [];
  const re = /(?:^|\n)\s*(\d+)\s+([^:\n]+):\s*([\s\S]*?)(?=\n\s*\d+\s+[^:\n]+:|$)/g;
  let m;
  while ((m = re.exec(body))) out.push({ n: m[1], name: m[2].trim(), text: m[3].trim() });
  return out;
}

function scriptReadModel(script) {
  const text = asText(script).trim();
  if (!text) return { mode: 'empty', intro: '', questions: [], prose: '' };
  const introM = text.match(/INTRO[^\n]*:\s*([^\n]+)/i);
  let questions = [];
  const qBlock = text.split(/QUESTION SHEET[^\n]*\n/i)[1];
  if (qBlock) {
    const re = /^\s*(\d+)\.\s+(.+)$/gm;
    let m;
    while ((m = re.exec(qBlock))) questions.push({ n: m[1], q: m[2].trim() });
  }
  let rest = '';
  if (questions.length) {
    const lines = text.split('\n');
    let lastQ = -1;
    lines.forEach((line, i) => { if (/^\s*\d+\.\s+/.test(line)) lastQ = i; });
    rest = lastQ >= 0 ? lines.slice(lastQ + 1).join('\n').trim() : '';
    return { mode: 'questions', intro: introM ? introM[1].trim() : '', questions, prose: text, rest };
  }
  return { mode: 'prose', intro: '', questions: [], prose: text, rest: '' };
}

function videoInfo(url) {
  const s = asText(url).trim();
  if (!s) return null;
  let m = s.match(/instagram\.com\/(?:reel|p|tv)\/([\w-]+)/i);
  if (m) {
    const kind = /\/p\//i.test(s) ? 'p' : 'reel';
    return { kind: 'ig', src: 'https://www.instagram.com/' + kind + '/' + m[1] + '/embed/', watch: s, label: 'Instagram' };
  }
  m = s.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]+)/i);
  if (m) return { kind: 'yt', src: 'https://www.youtube.com/embed/' + m[1], thumb: 'https://i.ytimg.com/vi/' + m[1] + '/hqdefault.jpg', watch: s, label: 'YouTube' };
  m = s.match(/tiktok\.com\/@([\w.]+)\/video\/(\d+)/i);
  if (m) return { kind: 'tt', src: 'https://www.tiktok.com/embed/v2/' + m[2], watch: s, label: 'TikTok · @' + m[1] };
  if (/^https?:\/\//i.test(s)) return { kind: 'link', watch: s, label: 'Link' };
  return { kind: 'text', label: s, watch: '' };
}
function embedHtml(info) {
  if (!info || !info.src) return '';
  return `<iframe class="embed-frame" src="${escHtml(info.src)}" title="Reference video" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>`;
}

const SOUS_FIELDS = ['Hook Visual Format', 'Text Overlays', 'Camera Format', 'Visual Fills', 'Intonation Cues', 'Energy Match', 'Sound/Music'];
const SCRIPT_FIELDS = [
  ['client_slug', 'Client'], ['title', 'Title'], ['format', 'Format'], ['status', 'Status'],
  ['hook', 'Hook'], ['full_script', 'Full script'], ['reference_clip', 'Reference clip'],
  ['camera', 'Camera'], ['cta', 'CTA'], ['editor_notes', 'Editor notes'], ['batch', 'Batch'],
  ['reel_number', 'Reel number'], ['date_planned', 'Date planned'], ['created_at', 'Created'],
  ['take_label', 'Take label'], ['sous_chef_pass', 'Sous chef pass'], ['filming_direction', 'Filming direction'],
  ['client_feedback', 'Client feedback'], ['filming_setup', 'Filming setup'], ['clip_directions', 'Clip directions'],
  ['tonality_delivery', 'Tonality and delivery'], ['proof_stats', 'Proof stats'], ['id', 'Id'],
];

function shotChecked(id, idx) {
  try { return !!JSON.parse(localStorage.getItem('hub_shots_' + id) || '{}')[idx]; }
  catch (e) { return false; }
}
window.toggleShot = (id, idx, on) => {
  const key = 'hub_shots_' + id;
  let map = {};
  try { map = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { map = {}; }
  map[String(idx)] = !!on;
  try { localStorage.setItem(key, JSON.stringify(map)); } catch (e) {}
  const box = document.querySelector('[data-shot-count="' + id + '"]');
  const section = document.getElementById('shots-' + id);
  if (box && section) {
    let n = 0;
    section.querySelectorAll('input[type="checkbox"]').forEach(el => { if (el.checked) n++; });
    box.textContent = n + ' of ' + section.querySelectorAll('input[type="checkbox"]').length;
  }
};

function advSection(key, title, body, open) {
  if (!body) return '';
  return `
    <button type="button" class="adv-btn" onclick="window.toggle('${key}', this)" aria-expanded="${open}" aria-controls="exp-${key}">
      <span>${title}</span><span id="chev-${key}">${open ? '▾' : '▸'}</span>
    </button>
    <div id="exp-${key}" class="adv-body ${open ? '' : 'hidden'}">${body}</div>`;
}

function renderReferenceBlock(s) {
  const primary = videoInfo(s.reference_clip);
  const extraUrl = extractVideoLink(s.clip_directions) || extractVideoLink(s.proof_stats);
  const same = extraUrl && s.reference_clip && String(s.reference_clip).indexOf(extraUrl) !== -1;
  const extra = extraUrl && !same ? videoInfo(extraUrl) : null;
  if (!primary && !extra) {
    return `<section class="area-ref"><div class="eyebrow block-label">Reference</div><p class="shot-intro">No reference video on this script.</p></section>`;
  }
  const blockFor = (info, idSuffix) => {
    if (!info) return '';
    if (info.kind === 'text') {
      return `<div class="ref-row"><div class="ref-poster" style="cursor:default"><span class="ref-play" aria-hidden="true">${brandMarkSvg(22)}</span><span><span class="ref-kicker">Reference</span><span class="ref-cta">${escHtml(info.label)}</span></span></div></div>`;
    }
    const open = expandedSections.has('embed:' + s.id + idSuffix);
    const thumb = info.thumb ? `<img alt="" src="${escHtml(info.thumb)}">` : `<span class="ref-play" aria-hidden="true">${brandMarkSvg(22)}</span>`;
    return `
      <div class="ref-row">
        <button type="button" class="ref-poster" onclick="window.loadEmbed('${s.id}','${idSuffix}')">
          ${thumb}
          <span><span class="ref-kicker">Reference · ${escHtml(info.label)}</span><span class="ref-cta">${open ? 'Playing' : 'Play'}</span></span>
        </button>
        ${info.watch ? `<a class="ref-open" href="${escHtml(info.watch)}" target="_blank" rel="noopener noreferrer">Open</a>` : ''}
      </div>
      <div id="embed-${s.id}${idSuffix}" class="embed-slot">${open ? embedHtml(info) : ''}</div>`;
  };
  return `<section class="area-ref"><div class="eyebrow block-label">Reference</div>${blockFor(primary, '')}${extra ? blockFor(extra, '-x') : ''}</section>`;
}
window.loadEmbed = (id, suffix) => {
  suffix = suffix || '';
  const key = 'embed:' + id + suffix;
  expandedSections.add(key);
  const s = scripts.find(x => x.id === id);
  if (!s) return;
  const info = suffix === '-x'
    ? videoInfo(extractVideoLink(s.clip_directions) || extractVideoLink(s.proof_stats))
    : videoInfo(s.reference_clip);
  const slot = document.getElementById('embed-' + id + suffix);
  if (slot && info) slot.innerHTML = embedHtml(info);
};

function renderHooks(s) {
  const pair = parseHookPair(s.hook);
  if (!pair.raw) return '';
  const yours = pair.adapted || pair.raw;
  const proven = pair.proven && pair.proven !== yours
    ? `<div><div class="eyebrow block-label">Proven hook</div><p class="hook-proven">${escHtml(pair.proven)}</p></div>` : '';
  return `<section class="area-hooks hook-pair">
    <div><div class="eyebrow block-label">${proven ? 'Your line' : 'Hook'}</div><p class="hook-you">${escHtml(yours)}</p></div>
    ${proven}
  </section>`;
}

function renderScriptBlock(s) {
  const model = scriptReadModel(s.full_script);
  if (model.mode === 'empty' && !s.hook) return '';
  let body = '';
  let count = '';
  if (model.mode === 'questions') {
    count = model.questions.length + ' question' + (model.questions.length === 1 ? '' : 's');
    const restOpen = expandedSections.has('rest-' + s.id);
    body = `
      ${model.intro ? `<p class="shot-intro">${escHtml(model.intro)}</p>` : ''}
      <ol class="q-sheet">${model.questions.map(q => `<li><span class="q-n">${escHtml(q.n)}</span><span class="q-t">${escHtml(q.q)}</span></li>`).join('')}</ol>
      ${model.rest ? advSection('rest-' + s.id, 'How to run it', `<pre class="shot-script">${escHtml(model.rest)}</pre>`, restOpen) : ''}`;
  } else if (model.prose) {
    count = readLabel(model.prose);
    body = `<pre class="shot-script">${escHtml(model.prose)}</pre>`;
  } else {
    body = `<pre class="shot-script">${escHtml(asText(s.hook))}</pre>`;
    count = readLabel(s.hook);
  }
  const delivery = renderDelivery(s);
  return `<section class="area-script">
    <div class="eyebrow block-label">${model.mode === 'questions' ? 'Question sheet' : 'Script'}${count ? ' · ' + escHtml(count) : ''}</div>
    ${body}
    <div class="script-tools">
      <button type="button" class="tool-btn primary" onclick="window.openPrompter('${s.id}')">Full screen</button>
      ${s.full_script ? `<button type="button" class="tool-btn" onclick="window.copyScript('${s.id}')">Copy</button>` : ''}
    </div>
    ${delivery}
  </section>`;
}

function fdObject(s) {
  const fd = s.filming_direction;
  if (!fd || typeof fd !== 'object' || Array.isArray(fd)) return null;
  return fd;
}
function renderDelivery(s) {
  const bits = [];
  if (s.tonality_delivery) bits.push(['Tonality', asText(s.tonality_delivery)]);
  const fd = fdObject(s);
  if (fd) {
    ['Tonality', 'Pacing', 'Text Hook'].forEach(k => { if (fd[k]) bits.push([k, asText(fd[k])]); });
  }
  const cam = asText(s.camera).trim();
  if (cam && !/fram|chest|head-on|vertical|eye|two-shot|close|medium/i.test(cam)) bits.push(['Camera note', cam]);
  if (!bits.length) return '';
  return `<div class="delivery" style="margin-top:16px"><div class="eyebrow">How to say it</div>${bits.map(([k, v]) => `<div><div class="eyebrow" style="color:var(--muted)">${escHtml(k)}</div><p>${escHtml(v)}</p></div>`).join('')}</div>`;
}

function renderSetupBlock(s) {
  const parsed = parseSetup(s.filming_setup, s.camera);
  let framing = parsed.framing;
  const fd = fdObject(s);
  if (!framing && fd && fd['Visual Hook']) framing = asText(fd['Visual Hook']);
  const tiles = [
    ['Location', parsed.location],
    ['Phone / tripod', parsed.rig],
    ['Framing', framing],
    ['Mic', parsed.mic],
  ];
  const grid = `<div class="setup-grid">${tiles.map(([label, val]) => `
    <div class="setup-tile ${val ? '' : 'is-empty'}"><div class="eyebrow">${label}</div><p>${escHtml(val ? clipText(val, 72) : 'Not specified')}</p></div>`).join('')}</div>`;
  const notes = parsed.raw ? `<div class="setup-notes">${truncatedField(parsed.raw, 'setup-' + s.id, 220)}</div>` : '';
  return `<section class="area-setup"><div class="eyebrow block-label">Setup</div>${grid}${notes}</section>`;
}

function renderShotList(s) {
  const parsed = parseSetup(s.filming_setup, s.camera);
  let items = parseShots(parsed.shots);
  let label = 'Shot list';
  if (!items.length && s.format === 'Reaction' && s.clip_directions) {
    items = ['Say the hook', 'Let the clip play', 'React on camera', 'Carry the full script to the ending'];
    label = 'Filming order';
  }
  if (!items.length) return '';
  let done = 0;
  const rows = items.map((item, i) => {
    const on = shotChecked(s.id, i);
    if (on) done++;
    return `<label class="shot-check"><input type="checkbox" ${on ? 'checked' : ''} onchange="window.toggleShot('${s.id}', ${i}, this.checked)"><span>${escHtml(item)}</span></label>`;
  }).join('');
  return `<section class="area-shots" id="shots-${s.id}"><div class="eyebrow block-label">${label} · <span data-shot-count="${s.id}">${done} of ${items.length}</span></div><div class="checks">${rows}</div></section>`;
}

function renderOnScreen(s) {
  const items = parseOnScreen(s.editor_notes, s.hook);
  if (!items.length) return '';
  return `<section class="area-screen"><div class="eyebrow block-label">On-screen text</div>${items.map(it => `
    <div class="screen-line">${it.t ? `<span class="screen-t">${escHtml(it.t)}</span>` : '<span class="screen-t"> </span>'}<span>${escHtml(it.text)}</span></div>`).join('')}</section>`;
}

function renderCtaBlock(cta) {
  const raw = asText(cta).trim();
  if (!raw) return '';
  if (/^(none|clean|no cta)\b/i.test(raw) && raw.length < 48) {
    return `<section class="area-cta"><div class="eyebrow block-label">Call to action</div><p class="shot-intro">No spoken CTA. End on the last line.</p></section>`;
  }
  const comment = raw.match(/^\s*comment\s+(\S+)/i);
  if (comment) {
    return `<section class="area-cta"><div class="eyebrow block-label">Call to action</div><p class="cta-kicker">Comment</p><p class="cta-word">${escHtml(comment[1])}</p><p class="cta-full">${escHtml(raw)}</p></section>`;
  }
  return `<section class="area-cta"><div class="eyebrow block-label">Call to action</div><p class="cta-line">${escHtml(raw)}</p></section>`;
}

function renderCoverage(s) {
  if (!s.clip_directions) return '';
  const open = expandedSections.has('cov-' + s.id);
  return advSection('cov-' + s.id, 'Coverage notes', `<div class="setup-notes">${escHtml(asText(s.clip_directions))}</div>`, open);
}

function renderAdvanced(s, group) {
  const sousSource = group.find(g => g.sous_chef_pass);
  const sous = sousSource && sousSource.sous_chef_pass && typeof sousSource.sous_chef_pass === 'object' ? sousSource.sous_chef_pass : null;
  let sousBody = '';
  if (sous) {
    const keys = SOUS_FIELDS.concat(Object.keys(sous).filter(k => SOUS_FIELDS.indexOf(k) === -1));
    sousBody = `<div class="adv-grid">${keys.map(k => `<div class="adv-card"><div class="eyebrow">${escHtml(k)}</div><p>${escHtml(sous[k] ? asText(sous[k]) : '—')}</p></div>`).join('')}</div>`;
  }
  const passes = parsePasses(s.editor_notes);
  const passBody = passes.length ? passes.map(p => `<div class="adv-card" style="margin-bottom:8px"><div class="eyebrow">${escHtml(p.n + ' · ' + p.name)}</div><p>${escHtml(p.text)}</p></div>`).join('') : '';
  const stats = extractProofStats(s.proof_stats);
  const proofBody = s.proof_stats ? `
    ${stats.length ? `<div class="stat-row">${stats.map(st => `<div><div class="stat-num">${escHtml(st.num)}</div><div class="stat-label">${escHtml(st.label)}</div></div>`).join('')}</div>` : ''}
    <div class="setup-notes">${escHtml(asText(s.proof_stats))}</div>` : '';
  const fd = fdObject(s);
  const fdBody = fd ? `<div class="adv-grid">${Object.entries(fd).map(([k, v]) => `<div class="adv-card"><div class="eyebrow">${escHtml(k)}</div><p>${escHtml(asText(v))}</p></div>`).join('')}</div>` : '';
  const editBody = s.editor_notes ? `<div class="setup-notes">${escHtml(asText(s.editor_notes))}</div>` : '';
  const allBody = SCRIPT_FIELDS.map(([k, label]) => {
    const v = s[k];
    const shown = (v == null || v === '') ? '—' : asText(v);
    return `<div class="field"><div class="eyebrow">${escHtml(label)}</div><pre>${escHtml(shown)}</pre></div>`;
  }).join('');
  return `<div class="adv">
    ${advSection('sc-' + s.id, 'Sous chef · 7 fields', sousBody, expandedSections.has('sc-' + s.id))}
    ${advSection('pass-' + s.id, '7-pass notes', passBody, expandedSections.has('pass-' + s.id))}
    ${advSection('proof-' + s.id, 'Proof stats', proofBody, expandedSections.has('proof-' + s.id))}
    ${advSection('fd-' + s.id, 'Filming direction', fdBody, expandedSections.has('fd-' + s.id))}
    ${advSection('edit-' + s.id, 'Editor notes', editBody, expandedSections.has('edit-' + s.id))}
    ${renderCoverage(s)}
    ${advSection('all-' + s.id, 'All fields', allBody, expandedSections.has('all-' + s.id))}

function renderStatusRail(status) {
  const st = status || 'Draft';
  const pre = st === 'Draft' || st === 'Needs Review' || st === 'Approved';
  const filmed = st === 'Filming';
  const posted = st === 'Posted';
  const step = (name, on, done, title) => `<div class="rail-step ${on ? 'is-on' : ''} ${done ? 'is-done' : ''}"${title ? ` title="${escHtml(title)}"` : ''}>${name}</div>`;
  return `<div class="status-exact">${escHtml(st)}</div>
    <div class="rail" role="group" aria-label="Status">
      ${step('Draft', pre, filmed || posted)}
      ${step('Filmed', filmed, posted, filmed ? 'Saved status: Filming' : '')}
      ${step('Posted', posted, false)}
    </div>`;
}

function renderShotActions(s) {
  const needsReview = s.status === 'Needs Review';
  const isPosted = s.status === 'Posted';
  const isPassed = s.status === 'Passed';
  const isArchived = s.status === 'Archived';
  const si = STATUS_ORDER.indexOf(s.status);
  const prev = STATUS_ORDER[si - 1];
  const next = STATUS_ORDER[si + 1];
  if (needsReview) {
    return `<div class="shot-actions">
      <button type="button" class="shot-go" onclick="moveStatus('${s.id}','Filming')">Film this</button>
      <div class="shot-alt">
        <button type="button" onclick="requestTweak('${s.id}')">Request a tweak</button>
        <button type="button" onclick="moveStatus('${s.id}','Passed')">Pass</button>
      </div>
    </div>`;
  }
  if (isPosted) return `<div class="shot-actions"><div class="posted-flag">Posted</div></div>`;
  if (isPassed) return `<div class="shot-actions nav-row"><div class="quiet-flag">Passed</div><button type="button" class="tool-btn" onclick="moveStatus('${s.id}','Needs Review')">Restore</button></div>`;
  if (isArchived) return `<div class="shot-actions nav-row"><div class="quiet-flag">Archived</div><button type="button" class="tool-btn" onclick="moveStatus('${s.id}','Draft')">Restore</button></div>`;
  return `<div class="shot-actions nav-row">
    ${prev && prev !== 'Passed' ? `<button type="button" class="tool-btn" onclick="moveStatus('${s.id}','${prev}')">${escHtml(prev)}</button>` : '<div></div>'}
    ${next && next !== 'Passed' ? `<button type="button" class="tool-btn primary" onclick="moveStatus('${s.id}','${next}')">${escHtml(next)}</button>` : '<div></div>'}
  </div>`;
}

function renderCardGroup(group) {
  const hasTakes = group.length > 1;
  const groupKey = takeGroupKey(group[0]);
  const idx = hasTakes ? (activeTake[groupKey] ?? 0) % group.length : 0;
  const s = group[idx];
  const isAdmin = role === 'admin';
  const isArchived = s.status === 'Archived';
  const groupPlannedDate = groupDate(group);
  const pastDue = isPastDue(group, localTodayStr());
  const dateChip = isAdmin ? `
    <label class="date-chip ${pastDue ? 'is-late' : ''}"${pastDue ? ' title="Past its planned posting date"' : ''}>
      ${pastDue ? 'Past due · ' : ''}${groupPlannedDate || 'Set date'}
      <input type="date" value="${groupPlannedDate || ''}" data-group-key="${escHtml(groupKey)}" aria-label="Planned posting date"
        onclick="this.showPicker && this.showPicker()"
        onchange="window.setGroupDate(this.dataset.groupKey, this.value || null)">
    </label>` : (groupPlannedDate ? `<span class="date-chip">${escHtml(groupPlannedDate)}</span>` : '');
  const takeTabs = hasTakes ? `
    <div class="take-tabs">${group.map((g, i) => `
      <button type="button" data-group-key="${escHtml(groupKey)}" data-idx="${i}"
        onclick="window.setTake(this.dataset.groupKey, Number(this.dataset.idx))"
        class="take-tab ${i === idx ? 'is-on' : ''}">${escHtml(g.take_label) || ('Take ' + String.fromCharCode(65 + i))}</button>`).join('')}</div>` : '';
  const kicker = [s.reel_number ? '#' + s.reel_number : '', s.format || ''].filter(Boolean).map(escHtml).join(' · ');

  return `<article class="shot ${isArchived ? 'is-quiet' : ''}">
    ${takeTabs}
    <div class="shot-meta">
      <div>
        <div class="shot-kicker">${kicker}</div>
        ${s.batch ? `<div class="shot-batch">${escHtml(s.batch)}</div>` : ''}
      </div>
      ${dateChip}
    </div>
    <h2 class="shot-title">${escHtml(s.title)}</h2>
    ${renderStatusRail(s.status)}
    ${s.client_feedback && s.status === 'Draft' ? `<div class="tweak" style="margin-top:14px"><div class="eyebrow">Tweak requested</div><p>${escHtml(s.client_feedback)}</p></div>` : ''}
    <div class="shot-body">
      <div class="col-side">
        ${renderReferenceBlock(s)}
        ${renderSetupBlock(s)}
        ${renderShotList(s)}
        ${renderOnScreen(s)}
      </div>
      <div class="col-main">
        ${renderHooks(s)}
        ${renderScriptBlock(s)}
        ${renderCtaBlock(s.cta)}
      </div>
    </div>
    ${renderShotActions(s)}
    ${renderAdvanced(s, group)}
  </article>`;
}

// ─────────────────────────────────────────────
// TELEPROMPTER — full-screen read. Lives outside #app so a dashboard redraw
// does not close it. Type size, speed, and mirror stick on this device.
// ─────────────────────────────────────────────
let prompterState = null;
let prompterRaf = 0;
function prompterHtml(s) {
  const model = scriptReadModel(s.full_script);
  const pair = parseHookPair(s.hook);
  const lead = pair.adapted ? `<p>${escHtml(pair.adapted)}</p>` : '';
  let body = lead;
  if (model.mode === 'questions') {
    body += model.questions.map(q => `<div class="pr-q"><span class="pr-qn">${escHtml(q.n)}</span><span>${escHtml(q.q)}</span></div>`).join('');
  } else {
    const prose = model.prose || asText(s.hook);
    body += prose.split(/\n{2,}/).map(p => `<p>${escHtml(p)}</p>`).join('');
  }
  return body;
}
function renderPrompter() {
  const s = scripts.find(x => x.id === prompterState.id);
  const root = document.getElementById('prompter-root');
  if (!s || !root) return;
  const st = prompterState;
  root.innerHTML = `<div id="prompter" class="${st.mirror ? 'is-mirror' : ''}" role="dialog" aria-modal="true" aria-label="Teleprompter">
    <div class="pr-top">
      <div class="pr-title">${escHtml(s.title)}</div>
      <button type="button" onclick="window.prompterTop()">Top</button>
      <button type="button" onclick="window.closePrompter()">Close</button>
    </div>
    <div class="pr-focus" aria-hidden="true"></div>
    <div id="prompter-scroll"><div id="prompter-text" style="font-size:${st.font}px">${prompterHtml(s)}</div></div>
    <div class="pr-controls">
      <button type="button" onclick="window.prompterFont(-4)" aria-label="Smaller type">A−</button>
      <button type="button" onclick="window.prompterFont(4)" aria-label="Larger type">A+</button>
      <button type="button" id="prompter-play" class="pr-play" onclick="window.prompterToggle()">${st.playing ? 'Pause' : 'Play'}</button>
      <input class="pr-speed" type="range" min="16" max="120" value="${st.speed}" aria-label="Scroll speed" oninput="window.prompterSpeed(this.value)">
      <button type="button" onclick="window.prompterMirror()" aria-pressed="${st.mirror}">Mirror</button>
    </div>
  </div>`;
  document.body.classList.add('prompter-open');
}
function prompterLoop(ts) {
  if (!prompterState || !prompterState.playing) return;
  const el = document.getElementById('prompter-scroll');
  if (!el) { prompterState.playing = false; return; }
  if (!prompterState.lastTs) prompterState.lastTs = ts;
  const dt = Math.min(64, ts - prompterState.lastTs);
  prompterState.lastTs = ts;
  el.scrollTop += (prompterState.speed * dt) / 1000;
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 4) {
    prompterState.playing = false;
    const btn = document.getElementById('prompter-play');
    if (btn) btn.textContent = 'Play';
    return;
  }
  prompterRaf = requestAnimationFrame(prompterLoop);
}
window.openPrompter = (id) => {
  const s = scripts.find(x => x.id === id);
  if (!s) return;
  prompterState = {
    id,
    font: Number(lsGetStr('hub_pr_font', '34')) || 34,
    speed: Number(lsGetStr('hub_pr_speed', '42')) || 42,
    mirror: lsGetBool('hub_pr_mirror', false),
    playing: false,
    lastTs: 0,
  };
  renderPrompter();
};
window.closePrompter = () => {
  prompterState = null;
  cancelAnimationFrame(prompterRaf);
  const root = document.getElementById('prompter-root');
  if (root) root.innerHTML = '';
  document.body.classList.remove('prompter-open');
};
window.prompterFont = (d) => {
  if (!prompterState) return;
  prompterState.font = Math.min(68, Math.max(20, prompterState.font + d));
  lsSetStr('hub_pr_font', String(prompterState.font));
  const el = document.getElementById('prompter-text');
  if (el) el.style.fontSize = prompterState.font + 'px';
};
window.prompterSpeed = (v) => {
  if (!prompterState) return;
  prompterState.speed = Number(v) || 42;
  lsSetStr('hub_pr_speed', String(prompterState.speed));
};
window.prompterMirror = () => {
  if (!prompterState) return;
  prompterState.mirror = !prompterState.mirror;
  lsSetBool('hub_pr_mirror', prompterState.mirror);
  const el = document.getElementById('prompter');
  if (el) el.classList.toggle('is-mirror', prompterState.mirror);
};
window.prompterTop = () => {
  const el = document.getElementById('prompter-scroll');
  if (el) el.scrollTop = 0;
};
window.prompterToggle = () => {
  if (!prompterState) return;
  prompterState.playing = !prompterState.playing;
  prompterState.lastTs = 0;
  const btn = document.getElementById('prompter-play');
  if (btn) btn.textContent = prompterState.playing ? 'Pause' : 'Play';
  if (prompterState.playing) prompterRaf = requestAnimationFrame(prompterLoop);
  else cancelAnimationFrame(prompterRaf);
};

function brandMarkSvg(size) {
