<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Content Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    pre { font-family: inherit; }
    @keyframes pulse-ring {
      0%, 100% { opacity: 1; box-shadow: 0 0 22px rgba(34,197,94,0.55), 0 0 44px rgba(34,197,94,0.25); }
      50%       { opacity: 0.85; box-shadow: 0 0 36px rgba(34,197,94,0.8), 0 0 72px rgba(34,197,94,0.4); }
    }
    .new-scripts-glow { animation: pulse-ring 2s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

<div id="app">
  <div class="flex items-center justify-center min-h-screen">
    <div class="text-slate-400 text-sm">Loading...</div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// CONFIG — paste your Supabase values here
// ─────────────────────────────────────────────
const SUPABASE_URL      = 'https://udkbnlpnfyjuwlstfxhr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_lwmiHRxf1Hdf2Z4b_aJkjg_ck7u1ms4';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ─────────────────────────────────────────────
// CLIENT CONFIG (add more clients here)
// ─────────────────────────────────────────────
const CLIENTS = {
  andrew: { name: 'Andrew George',  label: 'Andrew' },
  jan:    { name: 'Jan Zands',      label: 'Jan'    },
};

// ─────────────────────────────────────────────
// STATUS / FORMAT STYLES
// ─────────────────────────────────────────────
const STATUS_STYLE = {
  'Draft':        'bg-slate-100 text-slate-500',
  'Needs Review': 'bg-yellow-100 text-yellow-700',
  'Approved':     'bg-emerald-100 text-emerald-700',
  'Filming':      'bg-orange-100 text-orange-700',
  'Posted':       'bg-blue-100 text-blue-700',
  'Passed':       'bg-red-50 text-red-400',
};
const STATUS_ORDER = ['Draft','Needs Review','Approved','Filming','Posted','Passed'];

const FORMAT_STYLE = {
  'Reaction':             'bg-blue-100 text-blue-700',
  'F2 List':              'bg-teal-100 text-teal-700',
  'F3 Perspective-Flip':  'bg-purple-100 text-purple-700',
  'Format A':             'bg-blue-100 text-blue-700',
  'List Drop':            'bg-teal-100 text-teal-700',
  'Format C':             'bg-violet-100 text-violet-700',
};

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let user     = null;
let role     = null;   // 'admin' | 'client'
let mySlug   = null;   // 'andrew' | 'jan' (clients only)
let scripts  = [];
let viewSlug = 'andrew';
let viewStatus = 'all';
let viewMode = 'testing'; // 'testing' (only multi-take groups) | 'all' (full backlog) -- default
                           // to 'testing' so anyone logging in sees the active A/B/C tests
                           // first, not buried in the backlog. Falls back to 'all' automatically
                           // if a client has no multi-take groups yet.
let activeTake = {};   // groupKey -> index of the currently-shown take within a group

// Client-facing "how this works" guide. Persisted per-browser via localStorage so it doesn't
// nag on every visit once dismissed, but stays one tap away via the "?" button in the header.
// Admins (Cristian) never see this -- it's onboarding for CLIENTS, not for him.
function helpDismissed() { try { return localStorage.getItem('hub_help_dismissed') === '1'; } catch (e) { return false; } }
let showHelp = !helpDismissed();
window.toggleHelp = () => { showHelp = !showHelp; if (!showHelp) { try { localStorage.setItem('hub_help_dismissed', '1'); } catch (e) {} } renderDash(); };

// ─────────────────────────────────────────────
// ERROR STATE — a real, visible failure with a way out, instead of the page silently
// sticking on "Loading..." forever. This is the exact failure mode the Day 26 jsonb-field
// bug caused for every user, every session, at once -- this doesn't prevent a bad field from
// existing, it makes sure the NEXT unexpected error is recoverable instead of invisible.
// ─────────────────────────────────────────────
function renderError(e) {
  console.error(e);
  document.getElementById('app').innerHTML = `
    <div class="flex flex-col items-center justify-center min-h-screen px-5 text-center">
      <div class="text-3xl mb-3">⚠️</div>
      <div class="font-semibold text-slate-700 mb-1">Something went wrong loading this page.</div>
      <div class="text-xs text-slate-400 mb-4 max-w-xs break-words">${escHtml(e && e.message || String(e))}</div>
      <button onclick="location.reload()" class="bg-slate-800 text-white rounded-xl px-5 py-2.5 text-sm font-medium">Reload</button>
    </div>`;
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) await afterLogin(session.user);
    else renderLogin();

    sb.auth.onAuthStateChange(async (_e, session) => {
      try {
        if (session) await afterLogin(session.user);
        else { user = null; role = null; mySlug = null; unsubscribeLiveChanges(); renderLogin(); }
      } catch (e) { renderError(e); }
    });
  } catch (e) { renderError(e); }
}

async function afterLogin(u) {
  user   = u;
  role   = u.user_metadata?.role || 'client';
  mySlug = u.user_metadata?.client_slug || null;
  if (role === 'client' && mySlug) viewSlug = mySlug;
  if (role === 'client') viewMode = 'all'; // clients always land on full backlog, not testing-only view
  await fetchScripts();
  renderDash();
  subscribeLiveChanges();
}

// ─────────────────────────────────────────────
// LIVE SYNC — multiple people (Cristian + Andrew, multiple devices) can be logged in at
// once. Without this, each session only sees the data it fetched at login -- someone else's
// status change is invisible until a manual reload. Any change to the scripts table refetches
// and re-renders for everyone currently connected, so a status update on one device shows up
// on the others within ~1s, not "whenever they happen to refresh."
// ─────────────────────────────────────────────
let realtimeChannel = null;
function subscribeLiveChanges() {
  if (realtimeChannel) return; // already subscribed, don't double-subscribe on re-login
  try {
    realtimeChannel = sb.channel('scripts-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'scripts' }, async () => {
        try { await fetchScripts(); renderDash(); } catch (e) { renderError(e); }
      })
      .subscribe();
  } catch (e) { console.error('Realtime subscription failed (non-fatal):', e); }
}
function unsubscribeLiveChanges() {
  if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}

// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
async function fetchScripts() {
  let q = sb.from('scripts').select('*').order('reel_number');
  if (role === 'client' && mySlug) q = q.eq('client_slug', mySlug);
  const { data, error } = await q;
  if (error) console.error(error);
  scripts = data || [];
}

async function setStatus(id, status, extra) {
  const payload = extra ? { status, ...extra } : { status };
  const { error } = await sb.from('scripts').update(payload).eq('id', id);
  if (!error) {
    const s = scripts.find(s => s.id === id);
    if (s) Object.assign(s, payload);
    renderDash();
  } else {
    renderError(error);
  }
}

// Tweak now actually asks what needs to change, instead of silently moving the card to Draft
// with zero information -- this was the real bug behind "the tweaking process doesn't work":
// there was never a way to say WHAT to tweak, so the only option was texting Cristian directly.
async function requestTweak(id) {
  const note = window.prompt("What needs to change on this one?");
  if (note === null) return; // cancelled -- don't move status, don't lose anything
  await setStatus(id, 'Draft', { client_feedback: note || null });
}

// ─────────────────────────────────────────────
// HTML HELPERS
// ─────────────────────────────────────────────
function pill(text, style) {
  return `<span class="text-xs font-medium px-2 py-0.5 rounded-full ${style}">${text}</span>`;
}

function btn(label, onclick, style) {
  return `<button onclick="${onclick}" class="${style} text-xs py-2.5 px-3 rounded-xl font-medium active:scale-95 transition-all">${label}</button>`;
}

function linkOrText(val) {
  if (!val) return '';
  const isUrl = val.startsWith('http');
  if (isUrl) return `<a href="${val}" target="_blank" class="text-blue-500 text-xs underline break-all">${val}</a>`;
  return `<span class="text-xs text-slate-500">${val}</span>`;
}

// ─────────────────────────────────────────────
// RENDER LOGIN
// ─────────────────────────────────────────────
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="flex flex-col items-center justify-center min-h-screen px-5">
      <div class="w-full max-w-sm">
        <div class="text-center mb-8">
          <div class="text-2xl font-bold text-slate-800 tracking-tight">Content Hub</div>
          <div class="text-slate-400 text-sm mt-1">Sign in to view your scripts</div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-4">
          <div id="err" class="hidden text-xs text-red-600 bg-red-50 rounded-lg px-3 py-2"></div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1.5">Email</label>
            <input id="em" type="email" autocomplete="email" placeholder="you@example.com"
              class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600 block mb-1.5">Password</label>
            <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"
              onkeydown="if(event.key==='Enter')doLogin()"
              class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
          <button id="lb" onclick="doLogin()"
            class="w-full bg-slate-800 text-white rounded-xl py-3 text-sm font-medium hover:bg-slate-700 active:scale-95 transition-all">
            Sign in
          </button>
          <div class="text-center pt-1">
            <button onclick="doForgotPassword()" class="text-xs text-slate-400 hover:text-slate-600 underline underline-offset-2 transition-colors">
              Forgot password?
            </button>
          </div>
        </div>
      </div>
    </div>`;
}

async function doLogin() {
  const em = document.getElementById('em').value.trim();
  const pw = document.getElementById('pw').value;
  const lb = document.getElementById('lb');
  const err = document.getElementById('err');
  lb.textContent = 'Signing in…'; lb.disabled = true;
  err.classList.add('hidden');
  const { error } = await sb.auth.signInWithPassword({ email: em, password: pw });
  if (error) {
    err.textContent = error.message; err.classList.remove('hidden');
    lb.textContent = 'Sign in'; lb.disabled = false;
  }
}

async function doForgotPassword() {
  const em = document.getElementById('em').value.trim();
  if (!em) {
    const err = document.getElementById('err');
    err.textContent = 'Enter your email address first, then tap Forgot password.';
    err.classList.remove('hidden');
    return;
  }
  const { error } = await sb.auth.resetPasswordForEmail(em, {
    redirectTo: window.location.origin + window.location.pathname
  });
  const err = document.getElementById('err');
  if (error) {
    err.textContent = error.message; err.classList.remove('hidden');
  } else {
    err.textContent = ''; err.classList.add('hidden');
    document.getElementById('app').innerHTML = `
      <div class="flex flex-col items-center justify-center min-h-screen px-5 text-center">
        <div class="text-2xl mb-3">📬</div>
        <div class="font-semibold text-slate-800 mb-1">Check your email</div>
        <div class="text-sm text-slate-400 max-w-xs">We sent a password reset link to <strong>${em}</strong>. Click the link in that email to set a new password.</div>
      </div>`;
  }
}

// ─────────────────────────────────────────────
// TAKE GROUPING — rows sharing (client_slug, batch, reel_number) are "takes" of one
// script, shown as one card with a tab-switcher. A group of 1 renders exactly like a
// plain card always has — this is the backward-compatible default for every existing
// row (Jan's cards, any Andrew day without multiple takes).
// ─────────────────────────────────────────────
function takeGroupKey(s) {
  return `${s.client_slug}__${s.batch}__${s.reel_number}`;
}

function groupIntoTakes(list) {
  const groups = {};
  const order = [];
  list.forEach(s => {
    const key = takeGroupKey(s);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(s);
  });
  // Within a group, order by take_label so 'Take A' < 'Take B' < 'Take C' when present.
  order.forEach(key => groups[key].sort((a, b) => (a.take_label || '').localeCompare(b.take_label || '')));
  return order.map(key => groups[key]);
}

window.setTake = (groupKey, idx) => { activeTake[groupKey] = idx; renderDash(); };

// ─────────────────────────────────────────────
// RENDER DASHBOARD
// ─────────────────────────────────────────────
// Thin protective wrapper -- every caller (status buttons, tab switches, the realtime
// subscription) goes through renderDash(), so wrapping it here protects all of them at once
// instead of needing a try/catch at every call site.
function renderDash() {
  try { renderDashInner(); } catch (e) { renderError(e); }
}

function renderDashInner() {
  const isAdmin  = role === 'admin';

  // Client tabs (admin only)
  const clientTabs = isAdmin ? Object.entries(CLIENTS).map(([slug, c]) =>
    `<button onclick="setClient('${slug}')"
      class="px-4 py-2 rounded-full text-sm font-medium transition-all ${viewSlug === slug
        ? 'bg-slate-800 text-white'
        : 'bg-white text-slate-500 border border-slate-200 hover:border-slate-300'}">
      ${c.label}
    </button>`
  ).join('') : '';

  // Script cards — group all of this client's scripts into takes FIRST (so a group is
  // never split across the status filter), then apply the testing/all mode filter, then
  // the status filter. Status-tab counts below are scoped to the CURRENT mode, so a
  // "Needs Review 34" count doesn't show while looking at a 3-item testing view.
  const allGroups = groupIntoTakes(scripts.filter(s => s.client_slug === viewSlug));
  const testingGroups = allGroups.filter(g => g.length > 1);
  const effectiveMode = (viewMode === 'testing' && testingGroups.length === 0) ? 'all' : viewMode;
  const modeFilteredGroups = effectiveMode === 'testing' ? testingGroups : allGroups;
  const modeFilteredRows = modeFilteredGroups.flat();

  const countByStatus = {};
  modeFilteredRows.forEach(s => { countByStatus[s.status] = (countByStatus[s.status] || 0) + 1; });
  const totalForView = modeFilteredRows.length;

  // Status tabs
  const statusTabs = ['all', ...STATUS_ORDER].map(s => {
    const count = s === 'all' ? totalForView : (countByStatus[s] || 0);
    const label = s === 'all' ? 'All' : s;
    const active = viewStatus === s;
    return `<button onclick="setStatus2('${s}')"
      class="flex-shrink-0 whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium transition-all ${active
        ? 'bg-slate-800 text-white'
        : 'bg-white text-slate-400 border border-slate-200 hover:border-slate-300'}">
      ${label}${count ? ` <span class="opacity-60">${count}</span>` : ''}
    </button>`;
  }).join('');

  const visibleGroups = modeFilteredGroups.filter(g =>
    viewStatus === 'all' || g.some(s => s.status === viewStatus)
  );

  // Mode toggle — "In Testing" is the default landing view so the active A/B/C scripts
  // are the first thing anyone sees, with the full backlog one click away, not mixed in.
  const modeTabs = testingGroups.length ? `
    <div class="flex gap-2 mb-3">
      <button onclick="setMode('testing')"
        class="px-4 py-2 rounded-full text-sm font-medium transition-all ${effectiveMode === 'testing'
          ? 'bg-violet-600 text-white'
          : 'bg-white text-slate-500 border border-slate-200 hover:border-slate-300'}">
        🧪 In Testing <span class="opacity-70">${testingGroups.length}</span>
      </button>
      <button onclick="setMode('all')"
        class="px-4 py-2 rounded-full text-sm font-medium transition-all ${effectiveMode === 'all'
          ? 'bg-slate-800 text-white'
          : 'bg-white text-slate-500 border border-slate-200 hover:border-slate-300'}">
        📋 All Scripts <span class="opacity-70">${allGroups.length}</span>
      </button>
    </div>` : '';

  const cards = visibleGroups.length
    ? visibleGroups.map(renderCardGroup).join('')
    : `<div class="text-center py-20 text-slate-300 text-sm">No scripts here.</div>`;

  const clientName = CLIENTS[viewSlug]?.name || viewSlug;

  // Glowing "New Scripts" banner — client-only, shows when Needs Review count > 0
  const nrCount = !isAdmin ? (countByStatus['Needs Review'] || 0) : 0;
  const newScriptsBanner = nrCount > 0 ? `
    <div class="px-4 pt-4">
      <button onclick="viewMode='all'; setStatus2('Needs Review')"
        class="new-scripts-glow w-full rounded-2xl overflow-hidden text-left"
        style="background:linear-gradient(135deg,#16a34a 0%,#22c55e 100%);display:block;">
        <div class="px-5 py-4 flex items-center justify-between">
          <div>
            <div class="text-white font-bold text-base tracking-tight">🎬 ${nrCount} new script${nrCount === 1 ? '' : 's'} ready to film</div>
            <div class="text-green-100 text-xs mt-1">Tap to review →</div>
          </div>
          <div class="text-white font-black leading-none" style="font-size:3rem;opacity:0.9;">${nrCount}</div>
        </div>
      </button>
    </div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="max-w-xl mx-auto min-h-screen flex flex-col">

      <!-- Sticky header -->
      <div class="sticky top-0 z-20 bg-slate-50 border-b border-slate-100 px-4 pb-3 pt-4">
        <div class="flex items-center justify-between mb-3">
          <div class="font-semibold text-slate-800 text-sm tracking-tight">
            ${isAdmin ? 'Content Hub' : clientName}
          </div>
          <div class="flex items-center gap-1">
            ${!isAdmin ? `<button onclick="toggleHelp()" class="text-xs text-slate-400 hover:text-slate-600 w-6 h-6 rounded-full border border-slate-200 hover:border-slate-300 transition-colors">?</button>` : ''}
            <button onclick="doLogout()" class="text-xs text-slate-400 hover:text-slate-600 px-2 py-1 rounded-lg hover:bg-slate-100 transition-colors">
              Sign out
            </button>
          </div>
        </div>
        ${isAdmin ? `<div class="flex gap-2 mb-3">${clientTabs}</div>` : ''}
        ${modeTabs}
        <div class="flex gap-2 overflow-x-auto no-scrollbar">${statusTabs}</div>
      </div>

      <!-- New Scripts glowing banner — appears when Needs Review count > 0 -->
      ${newScriptsBanner}

      <!-- Client guide -- dismissible, never shown to admin -->
      ${(!isAdmin && showHelp) ? `
      <div class="px-4 pt-4">
        <div class="bg-violet-50 border border-violet-100 rounded-2xl p-4 relative">
          <button onclick="toggleHelp()" class="absolute top-3 right-3 text-violet-300 hover:text-violet-500 text-xs">✕</button>
          <div class="font-semibold text-violet-700 text-sm mb-2">How this works</div>
          <ul class="text-xs text-violet-800 space-y-1.5 leading-relaxed">
            <li>🧪 <b>In Testing</b> — scripts with a few different versions to compare. <b>All Scripts</b> is everything else.</li>
            <li><b>Take A / B / C</b> tabs on a card — same idea, different opening hooks. Tap each one to compare before you film.</li>
            <li>📹 <b>Ref</b> — the real video this format is based on. Tap the link to watch it.</li>
            <li>Tap <b>"Full script + filming notes"</b> to see everything you need to shoot it.</li>
            <li>✅ <b>Film</b> = ready to shoot as-is · ✏️ <b>Tweak</b> = send it back for changes · ✕ <b>Pass</b> = skip this one</li>
          </ul>
          <button onclick="toggleHelp()" class="mt-3 text-xs font-semibold text-violet-600 hover:text-violet-700">Got it →</button>
        </div>
      </div>` : ''}

      <!-- Cards -->
      <div class="flex-1 px-4 py-4 space-y-3 pb-10">
        ${cards}
      </div>
    </div>`;
}

function renderCardGroup(group) {
  const hasTakes = group.length > 1;
  const groupKey = takeGroupKey(group[0]);
  const idx = hasTakes ? (activeTake[groupKey] ?? 0) % group.length : 0;
  const s = group[idx];

  const statusStyle = STATUS_STYLE[s.status] || STATUS_STYLE['Draft'];
  const formatStyle = FORMAT_STYLE[s.format] || 'bg-slate-100 text-slate-500';
  const needsReview = s.status === 'Needs Review';
  const isPosted    = s.status === 'Posted';
  const isPassed    = s.status === 'Passed';
  const si   = STATUS_ORDER.indexOf(s.status);
  const prev = STATUS_ORDER[si - 1];
  const next = STATUS_ORDER[si + 1];

  const ctaClean = !s.cta || s.cta.toLowerCase().includes('none') || s.cta.toLowerCase().includes('clean');
  const ctaLabel = ctaClean ? null : s.cta.replace(/^comment\s*/i,'').split(/\s/)[0];

  // Sous Chef Pass — the 7-field reference-reel breakdown. Stored once per take-group (not
  // duplicated on every row), so look it up from whichever row actually has it.
  const sousChefSource = group.find(g => g.sous_chef_pass);
  const sousChef = sousChefSource ? sousChefSource.sous_chef_pass : null;
  const sousChefGroupKey = `sc-${groupKey}`;

  // Take tabs — only rendered when this group actually has more than one take. A group
  // of 1 (every existing row today) renders with zero visual change from before.
  const takeTabs = hasTakes ? `
    <div class="flex gap-1.5 px-4 pt-4 pb-1 flex-wrap">
      ${group.map((g, i) => `
        <button onclick="window.setTake('${groupKey}', ${i})"
          class="px-3 py-1 rounded-full text-xs font-semibold transition-all ${i === idx
            ? 'bg-slate-800 text-white'
            : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}">
          ${g.take_label || `Take ${String.fromCharCode(65 + i)}`}
        </button>`).join('')}
    </div>` : '';

  return `
  <div class="bg-white rounded-2xl border ${needsReview ? 'border-yellow-200' : 'border-slate-100'} shadow-sm overflow-hidden">
    ${takeTabs}

    <!-- Header -->
    <div class="px-4 pt-4 pb-3">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-1.5 flex-wrap">
          ${s.reel_number ? `<span class="text-xs font-bold text-slate-300">#${s.reel_number}</span>` : ''}
          ${pill(s.format || 'Script', formatStyle)}
          ${pill(s.status, statusStyle)}
          ${ctaLabel ? `<span class="text-xs bg-blue-50 text-blue-500 px-2 py-0.5 rounded-full font-medium">Comment ${ctaLabel}</span>` : ''}
        </div>
      </div>
      <div class="font-bold text-slate-800 text-base leading-snug mb-3">${s.title}</div>

      <!-- Tweak note — what got typed in when this was sent back to Draft. Shown up top,
           impossible to miss, so a tweak request never has to travel by text message again. -->
      ${s.client_feedback && s.status === 'Draft' ? `
      <div class="bg-orange-50 border border-orange-200 rounded-xl px-4 py-3 mb-3">
        <div class="text-[10px] font-semibold text-orange-500 uppercase tracking-widest mb-1">✏️ Tweak requested</div>
        <div class="text-sm text-orange-900 leading-relaxed">${escHtml(s.client_feedback)}</div>
      </div>` : ''}

      <!-- Hook — the hero -->
      ${s.hook ? `
      <div class="bg-slate-50 border border-slate-100 rounded-xl px-4 py-3">
        <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-1.5">THE HOOK</div>
        <div class="text-sm text-slate-800 font-medium leading-relaxed">"${escHtml(s.hook)}"</div>
      </div>` : ''}

      <!-- Filming Direction dashboard — always visible, never collapsed, since this is what
           actually matters most for filming (per direct client feedback: the hook is "so so so
           important," the generic filming-notes blob is not). Covers hook craft (Text Hook,
           Visual Hook, Tonality, Pacing — emerald) AND production (Editing Style, Editing Notes
           — sky) in one consumable panel, so Andrew never has to dig through the raw script to
           find what he needs to actually shoot it. -->
      ${s.filming_direction ? `
      <div class="mt-3">
        <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-1.5">🎬 Filming Direction</div>
        <div class="grid grid-cols-2 gap-2">
          ${Object.entries(s.filming_direction).map(([label, text]) => {
            const isEditing = label.startsWith('Editing');
            const wide = isEditing ? 'col-span-2' : '';
            const bg = isEditing ? 'bg-sky-50 border-sky-100' : 'bg-emerald-50 border-emerald-100';
            const labelColor = isEditing ? 'text-sky-600' : 'text-emerald-600';
            const textColor = isEditing ? 'text-sky-900' : 'text-emerald-900';
            return `
          <div class="${bg} border rounded-xl px-3 py-2 ${wide}">
            <div class="text-[9px] font-semibold ${labelColor} uppercase tracking-widest mb-1">${escHtml(label)}</div>
            <div class="text-[11px] ${textColor} leading-snug">${escHtml(text)}</div>
          </div>`;
          }).join('')}
        </div>
      </div>` : ''}
    </div>

    <!-- Ref + Camera -->
    <div class="px-4 pb-3 space-y-2 border-t border-slate-50 pt-3">
      ${s.reference_clip ? `
      <div class="flex items-start gap-2">
        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest flex-shrink-0 mt-0.5">📹 Ref</span>
        <div class="flex-1">${linkOrText(s.reference_clip)}</div>
      </div>` : ''}
      ${s.camera ? `
      <div class="flex items-center gap-2">
        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">🎥 Cam</span>
        <span class="text-xs text-slate-500">${s.camera}</span>
      </div>` : ''}
    </div>

    <!-- Expand toggle -->
    <button onclick="toggle('${s.id}')"
      class="w-full flex items-center justify-between px-4 py-3 border-t border-slate-100 text-xs text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-colors text-left">
      <span class="font-medium">Full script + filming notes</span>
      <span id="chev-${s.id}" class="text-slate-300">▸</span>
    </button>

    <!-- Expanded -->
    <div id="exp-${s.id}" class="hidden border-t border-slate-100">
      ${s.full_script ? `
      <div class="px-4 pt-4 pb-3">
        <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-2">Script</div>
        <pre class="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed">${escHtml(s.full_script)}</pre>
      </div>` : ''}
      ${s.editor_notes ? `
      <div class="px-4 pb-4 pt-1">
        <div class="bg-amber-50 border border-amber-100 rounded-xl p-3">
          <div class="text-[10px] font-semibold text-amber-600 uppercase tracking-widest mb-1.5">Filming Notes</div>
          <div class="text-xs text-amber-900 leading-relaxed">${escHtml(s.editor_notes)}</div>
        </div>
      </div>` : ''}
    </div>

    <!-- Sous Chef Pass — optional, collapsed by default. One per take-group, not per take,
         since it's a breakdown of the reference reel, which is the same across all takes. -->
    ${sousChef ? `
    <button onclick="toggle('${sousChefGroupKey}')"
      class="w-full flex items-center justify-between px-4 py-3 border-t border-slate-100 text-xs text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-colors text-left">
      <span class="font-medium">Sous Chef Pass — reference reel breakdown</span>
      <span id="chev-${sousChefGroupKey}" class="text-slate-300">▸</span>
    </button>
    <div id="exp-${sousChefGroupKey}" class="hidden border-t border-slate-100 px-4 py-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        ${Object.entries(sousChef).map(([label, text]) => `
        <div class="bg-violet-50 border border-violet-100 rounded-xl p-3">
          <div class="text-[10px] font-semibold text-violet-500 uppercase tracking-widest mb-1.5">${escHtml(label)}</div>
          <div class="text-xs text-violet-900 leading-relaxed">${escHtml(text)}</div>
        </div>`).join('')}
      </div>
    </div>` : ''}

    <!-- Action buttons -->
    <div class="px-4 pb-4 pt-3 border-t border-slate-100">
      ${needsReview ? `
        <div class="grid grid-cols-3 gap-2">
          ${btn('✅ Film', `moveStatus('${s.id}','Filming')`, 'bg-emerald-500 text-white hover:bg-emerald-600 font-semibold')}
          ${btn('✏️ Tweak', `requestTweak('${s.id}')`, 'border-2 border-orange-300 text-orange-500 hover:bg-orange-50')}
          ${btn('✕ Pass', `moveStatus('${s.id}','Passed')`, 'border border-slate-200 text-slate-400 hover:bg-slate-50')}
        </div>` :
      isPosted ? `<div class="text-center text-xs text-blue-400 font-medium py-1">✓ Posted</div>` :
      isPassed ? `<div class="flex gap-2">
        <div class="flex-1 text-center text-xs text-red-300 py-2">Passed</div>
        ${btn('← Restore', `moveStatus('${s.id}','Needs Review')`, 'border border-slate-200 text-slate-400 hover:bg-slate-50 text-xs')}
      </div>` : `
      <div class="flex gap-2">
        ${prev && prev !== 'Passed' ? btn(`← ${prev}`, `moveStatus('${s.id}','${prev}')`, 'flex-1 border border-slate-200 text-slate-500 hover:bg-slate-50') : '<div class="flex-1"></div>'}
        ${next && next !== 'Passed' ? btn(`${next} →`, `moveStatus('${s.id}','${next}')`, 'flex-1 bg-slate-800 text-white hover:bg-slate-700') : '<div class="flex-1"></div>'}
      </div>`}
    </div>
  </div>`;
}

// ─────────────────────────────────────────────
// ACTIONS (global so onclick= works)
// ─────────────────────────────────────────────
window.setClient   = slug => { viewSlug = slug; viewStatus = 'all'; renderDash(); };
window.setStatus2  = s    => { viewStatus = s; renderDash(); };
window.setMode     = m    => { viewMode = m; viewStatus = 'all'; renderDash(); };
window.moveStatus  = (id, status) => setStatus(id, status);
window.requestTweak = (id) => requestTweak(id);
window.doLogout    = () => { unsubscribeLiveChanges(); sb.auth.signOut(); };

window.toggle = id => {
  const el = document.getElementById(`exp-${id}`);
  const ch = document.getElementById(`chev-${id}`);
  el.classList.toggle('hidden');
  ch.textContent = el.classList.contains('hidden') ? '▸' : '▾';
};

function escHtml(str) {
  // Defensive: a field value that isn't a plain string (e.g. a list/object from a jsonb
  // column) must never crash the whole render. One bad field should degrade gracefully
  // (shown as its JSON form) instead of taking down every card on the page -- this exact
  // failure mode happened for real (Day 26's "overlays" field was a list, not a string).
  if (str == null) return '';
  if (typeof str !== 'string') { try { str = JSON.stringify(str); } catch (e) { str = String(str); } }
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────
// GO
// ─────────────────────────────────────────────
init();
</script>
</body>
</html>
