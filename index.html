      <!-- Settings popover (Item 2) -- backdrop first (so it's visually "behind"), panel
           second. Both are siblings of the sticky header (not nested inside it) so z-index
           comparisons aren't capped by the header's own stacking context. -->
      ${settingsBackdrop}
      ${settingsPanel}

      <!-- New Scripts glowing banner — appears when Needs Review count > 0 -->
      ${newScriptsBanner}

      <!-- Client guide -- dismissible, never shown to admin -->
      ${(!isAdmin && showHelp) ? `
      <div class="px-4 pt-4">
        <div class="bg-violet-50 border border-violet-100 rounded-2xl p-4 relative">
          <button onclick="toggleHelp()" class="absolute top-3 right-3 text-violet-300 hover:text-violet-500 text-xs">✕</button>
          <div class="font-semibold text-violet-700 text-sm mb-2">How this works</div>
          <ul class="text-xs text-violet-800 space-y-1.5 leading-relaxed">
            <li>🧪 <b>In Testing</b> — scripts with a few different versions to compare. <b>All Scripts</b> is everything else.</li>
            <li><b>Take A / B / C</b> tabs on a card — same idea, different opening hooks. Tap each one to compare before you film.</li>
            <li>📹 <b>Ref</b> — the real video this format is based on. Tap the link to watch it.</li>
            <li>On some cards, scroll down for the full breakdown in order: the reference reel → its real stats → clip directions → filming setup → then <b>what you're actually filming</b> — the hook, full script, and tonality, highlighted so it's the last thing you read before you hit record.</li>
            <li>Tap <b>"Full script + filming notes"</b> to see everything you need to shoot it.</li>
            <li>✅ <b>Film</b> = ready to shoot as-is · ✏️ <b>Tweak</b> = send it back for changes · ✕ <b>Pass</b> = skip this one</li>
            ${CLIENT_VIEW_TABS ? `
            <li>📅 <b>Calendar</b> — see what's scheduled to post on any given day, and what hasn't been dated yet.</li>
            <li>📊 <b>Pipeline</b> — see how many scripts are at each stage, from draft to posted.</li>` : ''}
          </ul>
          <button onclick="toggleHelp()" class="mt-3 text-xs font-semibold text-violet-600 hover:text-violet-700">Got it →</button>
        </div>
      </div>` : ''}

      <!-- Body: List cards, or the Calendar/Pipeline view -->
      <div class="flex-1 px-4 py-4 space-y-3 pb-10">
        ${body}
      </div>
    </div>`;

  // Day-panel scroll (Calendar view only) -- DOM is fully rebuilt above, so the panel can't
  // be scrolled to until after this innerHTML assignment. See renderCalendar() for details.
  // One-shot: only consume calScrollPending (set by an actual day-tap/jump-to-date action),
  // never re-derive from calSelectedDay existing -- that would re-fire the scroll on every
  // unrelated redraw while a day stays selected (realtime updates, take-tab taps, status
  // buttons inside the day panel, expanding unscheduled, month nav).
  if (calScrollPending) { calScrollPending = false; scrollToDayPanel(); }

  // Restore the Next-7-days strip's scroll position captured at the top of this function --
  // same requestAnimationFrame-after-rebuild technique as scrollToDayPanel(), just for
  // scrollLeft instead of scrollIntoView. A no-op when the strip isn't in the DOM (not on
  // Calendar) or was already at scrollLeft 0.
  requestAnimationFrame(() => {
    const el = document.getElementById('next7-strip');
    if (el) el.scrollLeft = next7ScrollLeft;
  });
}

// ─────────────────────────────────────────────
// SETTINGS POPOVER (Item 2) — admin only. Anchored top-right under the header row, closes on
// backdrop tap / Escape / its own ✕. Changing a setting does NOT close it (so you can see the
// "Currently: ..." line update live, or flip the color-key toggle and immediately see the
// calendar react, without the panel snapping shut).
// ─────────────────────────────────────────────
function renderSettingsPanel() {
  // "Currently: ..." reflects whatever is actually SAVED to localStorage (what would be
  // restored on the next sign-in), not just the live in-memory state -- the two normally match
  // (every admin nav action writes through immediately via saveLastView()), but this is the
  // one piece of UI that makes the otherwise-invisible "remember last view" rule inspectable.
  const saved = user ? loadLastView(user.id) : null;
  const curSlug = (saved && CLIENTS[saved.viewSlug]) ? saved.viewSlug : viewSlug;
  const curTab  = (saved && ['list', 'calendar', 'pipeline'].includes(saved.viewTab)) ? saved.viewTab : viewTab;
  const curTabLabel = curTab === 'list' ? 'List' : curTab === 'calendar' ? 'Calendar' : 'Pipeline';
  const curClientLabel = CLIENTS[curSlug]?.label || curSlug;
  const currentlyLine = `${curTabLabel} · ${curClientLabel}`;

  const openOptions = [
    { v: 'last',     label: 'Where I left off' },
    { v: 'list',     label: 'List' },
    { v: 'calendar', label: 'Calendar' },
    { v: 'pipeline', label: 'Pipeline' },
  ];

  const radioRows = openOptions.map(o => `
    <label class="flex items-start gap-2.5 py-2 cursor-pointer">
      <input type="radio" name="openOnSignIn" value="${o.v}" data-focus-id="signin-${o.v}" ${settingOpenOnSignIn === o.v ? 'checked' : ''}
        onchange="window.setOpenOnSignIn('${o.v}')" class="mt-0.5 accent-slate-800">
      <span class="flex-1">
        <span class="block text-sm text-slate-700">${o.label}</span>
        ${o.v === 'last' ? `<span class="block text-[11px] text-slate-400 mt-0.5">Currently: ${currentlyLine}</span>` : ''}
      </span>
    </label>`).join('');

  return `
  <!-- C2 -- this outer wrapper is "fixed inset-x-0 top-0", anchored to the VIEWPORT, not to the
       page's scrolling flow. The old markup put "absolute" directly on the panel, positioned
       relative to the outer page wrapper (which scrolls with the page) -- so scrolling down even
       slightly carried the panel off-screen while the gear icon (sticky header) stayed visible,
       and the still-fixed, still-full-viewport backdrop kept eating the next tap. The wrapper
       itself has no height (zero-height box, "pointer-events-none") so it can't block clicks
       outside the panel; the panel re-enables pointer-events on itself. Constraining the inner
       column to "max-w-xl mx-auto" keeps the panel lined up with the rest of the app's content
       column exactly like before. -->
  <div class="fixed inset-x-0 top-0 z-40 pointer-events-none">
    <div class="max-w-xl mx-auto relative">
      <div class="pointer-events-auto absolute right-4 top-16 w-72 max-w-[calc(100vw-2rem)] bg-white rounded-2xl border border-slate-200 shadow-lg p-4" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm font-bold text-slate-800">Settings</div>
          <button data-focus-id="settings-close" onclick="window.closeSettings()" class="text-slate-300 hover:text-slate-500 text-sm w-7 h-7 flex items-center justify-center flex-shrink-0">✕</button>
        </div>

        <div class="mb-1">
          <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-widest mb-1">Open on sign-in</div>
          <div class="divide-y divide-slate-100">${radioRows}</div>
        </div>

        <div class="border-t border-slate-100 mt-2 pt-3 flex items-center justify-between gap-3">
          <div id="always-show-key-label" class="text-sm text-slate-700">Always show color key</div>
          <button data-focus-id="always-show-key" onclick="window.toggleAlwaysShowKey()" role="switch" aria-checked="${settingAlwaysShowKey}" aria-labelledby="always-show-key-label"
            class="relative w-11 h-6 rounded-full flex-shrink-0 transition-colors ${settingAlwaysShowKey ? 'bg-slate-800' : 'bg-slate-200'}">
            <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform ${settingAlwaysShowKey ? 'translate-x-5' : ''}"></span>
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────
// DOSSIER-STYLE CARD BODY — mirrors full-production-dossier.html's eye-order exactly:
// 1. reference reel  2. its stats  3. clip directions  4. filming setup  5. the actual
// filming (hook + full script + tonality, emphasized). Only kicks in for rows that actually
// carry one of the 4 dossier columns -- every other row (Andrew's, Jan's old Batch-01 seed)
// keeps the original layout untouched, so this is additive, not a breaking change.
// ─────────────────────────────────────────────
function isDossierStyle(s) {
  return !!(s.filming_setup || s.clip_directions || s.tonality_delivery || s.proof_stats);
}

function renderDossierBody(s) {
  const hasClip = !!s.reference_clip;
  const stats = extractProofStats(s.proof_stats);
  // The actual source video (e.g. the Jim Rohn/Tony Robbins YouTube speech Jan films his
  // reaction to) was buried inside the proof-stats paragraph as plain text -- pull it out so
  // it shows as its own clickable link on the clip box, which is where it's actually needed.
  const sourceClip = extractVideoLink(s.clip_directions) || extractVideoLink(s.proof_stats);

  // 1 + 2 combined into one box, same as the dossier: the reel link and its real numbers belong
  // together as "proof," not two separate stacked boxes. The full verification narrative
  // collapses by default -- the stat tiles are the headline, the paragraph is backup detail.
  const provenBox = (hasClip || s.proof_stats) ? `
  <div class="bg-blue-50 border border-blue-100 rounded-xl px-3.5 py-3 mb-2.5">
    <div class="text-xs font-bold text-blue-600 uppercase tracking-widest mb-2">Proven format reference</div>
    ${hasClip ? `<div class="mb-1">${linkOrText(s.reference_clip)}</div>` : ''}
    ${stats.length ? `
    <div class="flex gap-5 flex-wrap mt-2 pt-2 border-t border-blue-100">
      ${stats.map(st => `
      <div>
        <div class="text-2xl font-bold text-blue-600 leading-none">${escHtml(st.num)}</div>
        <div class="text-[10px] uppercase tracking-wide text-slate-400 mt-0.5">${st.label}</div>
      </div>`).join('')}
    </div>` : ''}
    ${s.proof_stats ? `<div class="text-sm text-blue-900 leading-relaxed mt-2">${truncatedField(s.proof_stats, 'proof-' + s.id, 160)}</div>` : ''}
  </div>` : '';

  return `
    <div class="px-4 pb-4 pt-3 border-t border-slate-50 space-y-0.5">

      <!-- 1. Reference reel + 2. its real stats -->
      ${provenBox}

      <!-- 3. Clip to react to -- Reaction format ONLY. clip_directions is populated on every
           format (it doubles as general filming notes for Personal Story / Direct Address), so
           gating on the field being non-empty was wrong -- only an actual Reaction script has a
           clip to react to. -->
      ${(s.format === 'Reaction' && s.clip_directions) ? `
      <div class="bg-blue-50 border border-blue-100 rounded-xl px-3.5 py-3 mb-2.5">
        <div class="text-xs font-bold text-blue-600 uppercase tracking-widest mb-2">Clip to react to</div>
        ${sourceClip ? `<a href="${escHtml(sourceClip)}" target="_blank" class="inline-block text-base font-bold text-blue-700 underline mb-2">▶ Watch the source clip</a>` : ''}
        <div class="text-sm text-blue-900 leading-relaxed whitespace-pre-wrap">${escHtml(s.clip_directions)}</div>
      </div>` : ''}

      <!-- 4. Filming setup -->
      ${dossierBlock('', 'Filming setup', s.filming_setup, 'film')}

      <!-- 5. THE ACTUAL FILMING — the hero. Hook, full script, and tonality all live here,
           visually heavier than everything above (bigger text, shadow, thicker border), because
           this is what you say and how you say it, not prep -- and now that the boxes above
           collapse their long notes by default, this is what actually dominates the card. -->
      <div class="mt-3 pt-4 px-3.5 pb-3.5 border-2 border-slate-200 rounded-2xl bg-white shadow-md">
        <div class="text-sm font-extrabold text-slate-600 uppercase tracking-[0.1em] mb-3">🎬 What you're actually filming</div>

        <!-- Filming sequence -- only for reaction-format scripts (a clip plays mid-video). Shows
             the actual shot order at a glance: say the hook, the clip plays, you react, then the
             full script carries through to the ending -- the exact flow Cristian asked to make
             explicit instead of leaving it implied inside the clip-directions paragraph. -->
        ${(s.format === 'Reaction' && s.clip_directions) ? `
        <div class="flex items-center gap-1.5 flex-wrap mb-3.5">
          <span class="bg-violet-100 text-violet-700 text-xs font-bold px-2.5 py-1.5 rounded-full">① Say the hook</span>
          <span class="text-slate-300 text-xs">→</span>
          <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1.5 rounded-full">② Clip plays</span>
          <span class="text-slate-300 text-xs">→</span>
          <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1.5 rounded-full">③ React on camera</span>
          <span class="text-slate-300 text-xs">→</span>
          <span class="bg-slate-100 text-slate-600 text-xs font-bold px-2.5 py-1.5 rounded-full">④ Full script to the ending</span>
        </div>` : ''}

        ${s.hook ? `
        <div class="bg-violet-50 border-2 border-violet-200 rounded-xl px-4 py-3.5 mb-2.5">
          <div class="text-xs font-bold text-violet-600 uppercase tracking-widest mb-1.5">Hook</div>
          <div class="text-lg text-violet-900 font-semibold leading-snug">"${escHtml(s.hook)}"</div>
        </div>` : ''}

        ${s.full_script ? `
        <div class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 mb-2.5">
          <div class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Full script</div>
          <pre class="text-sm text-slate-800 whitespace-pre-wrap leading-relaxed">${escHtml(s.full_script)}</pre>
        </div>` : ''}

        ${dossierBlock('🎙', 'Tonality &amp; delivery — read this right before you hit record', s.tonality_delivery, 'tone', {
          emphasize: true
        })}
      </div>

      <!-- Editing directions — footer, for the editor after filming, deliberately de-emphasized
           relative to the filming hero above. -->
      ${dossierBlock('', 'Editing directions — for the editor, after filming', s.editor_notes, 'edit')}
    </div>`;
}

function renderCardGroup(group) {
  const hasTakes = group.length > 1;
  const groupKey = takeGroupKey(group[0]);
  const idx = hasTakes ? (activeTake[groupKey] ?? 0) % group.length : 0;
  const s = group[idx];
  const isAdmin = role === 'admin';

  const statusStyle = STATUS_STYLE[s.status] || STATUS_STYLE['Draft'];
  const formatStyle = FORMAT_STYLE[s.format] || 'bg-slate-100 text-slate-500';
  const needsReview = s.status === 'Needs Review';
  const isPosted    = s.status === 'Posted';
  const isPassed    = s.status === 'Passed';
  const isArchived  = s.status === 'Archived';
  const si   = STATUS_ORDER.indexOf(s.status);
  const prev = STATUS_ORDER[si - 1];
  const next = STATUS_ORDER[si + 1];

  const ctaClean = !s.cta || s.cta.toLowerCase().includes('none') || s.cta.toLowerCase().includes('clean');
  const ctaLabel = ctaClean ? null : s.cta.replace(/^comment\s*/i,'').split(/\s/)[0];

  // Admin-only planned-posting-date picker, same overlay-chip pattern as the Calendar view's
  // unscheduled rows (a bare empty <input type=date> is nearly invisible on iOS Safari). A
  // multi-take group shares ONE date -- setGroupDate() writes it to every take's row. Reuses
  // groupDate() (the same helper the Calendar buckets days with) so the date shown here is
  // always the exact one the group would file under on the calendar.
  const groupPlannedDate = groupDate(group);
  // groupKey is NOT interpolated into the onchange string -- a batch name containing an
  // apostrophe (e.g. "Jan's Batch 02") would otherwise break the generated JS (or the
  // attribute boundary) silently, with no visible error. It's carried via a data-attribute
  // (escHtml-safe) and read back out through dataset instead. onclick wires up showPicker()
  // so desktop Chrome reliably opens the native picker on click (it already works on iOS).
  const dateChip = isAdmin ? `
    <label class="relative h-7 px-2.5 inline-flex items-center gap-1 rounded-full bg-blue-50 border border-blue-100 text-[11px] font-medium text-blue-600 flex-shrink-0">
      📅 ${groupPlannedDate || 'Set date'}
      <input type="date" value="${groupPlannedDate || ''}" data-group-key="${escHtml(groupKey)}"
        class="absolute inset-0 w-full h-full opacity-0 text-base"
        onclick="this.showPicker && this.showPicker()"
        onchange="window.setGroupDate(this.dataset.groupKey, this.value || null)">
    </label>` : '';

  // Sous Chef Pass — the 7-field reference-reel breakdown. Stored once per take-group (not
  // duplicated on every row), so look it up from whichever row actually has it.
  const sousChefSource = group.find(g => g.sous_chef_pass);
  const sousChef = sousChefSource ? sousChefSource.sous_chef_pass : null;
  const sousChefGroupKey = `sc-${groupKey}`;

  // Take tabs — only rendered when this group actually has more than one take. A group
  // of 1 (every existing row today) renders with zero visual change from before.
  // Same apostrophe-in-groupKey hazard as the date chips above (C2) -- groupKey is carried
  // via data-attributes instead of being interpolated straight into the onclick string.
  const takeTabs = hasTakes ? `
    <div class="flex gap-1.5 px-4 pt-4 pb-1 flex-wrap">
      ${group.map((g, i) => `
        <button data-group-key="${escHtml(groupKey)}" data-idx="${i}"
          onclick="window.setTake(this.dataset.groupKey, Number(this.dataset.idx))"
          class="px-3 py-1 rounded-full text-xs font-semibold transition-all ${i === idx
            ? 'bg-slate-800 text-white'
            : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}">
          ${g.take_label || `Take ${String.fromCharCode(65 + i)}`}
        </button>`).join('')}
    </div>` : '';

  return `
  <div class="bg-white rounded-2xl border ${needsReview ? 'border-yellow-200' : 'border-slate-100'} shadow-sm overflow-hidden ${isArchived ? 'opacity-60' : ''}">
    ${takeTabs}

    <!-- Header -->
    <div class="px-4 pt-4 pb-3">
      <div class="flex items-center justify-between mb-2 gap-2">
        <div class="flex items-center gap-1.5 flex-wrap">
          ${s.reel_number ? `<span class="text-xs font-bold text-slate-300">#${s.reel_number}</span>` : ''}
          ${pill(s.format || 'Script', formatStyle)}
          ${pill(s.status, statusStyle)}
          ${ctaLabel ? `<span class="text-xs bg-blue-50 text-blue-500 px-2 py-0.5 rounded-full font-medium">Comment ${ctaLabel}</span>` : ''}
        </div>
        ${dateChip}
      </div>
      <div class="font-bold text-slate-800 text-base leading-snug">${s.title}</div>
      ${s.batch ? `<div class="text-[10px] text-slate-300 mt-0.5 mb-2.5 tracking-wide">${escHtml(s.batch)}</div>` : '<div class="mb-3"></div>'}

      <!-- Tweak note — what got typed in when this was sent back to Draft. Shown up top,
           impossible to miss, so a tweak request never has to travel by text message again. -->
      ${s.client_feedback && s.status === 'Draft' ? `
      <div class="bg-orange-50 border border-orange-200 rounded-xl px-4 py-3 mb-3">
        <div class="text-[10px] font-semibold text-orange-500 uppercase tracking-widest mb-1">✏️ Tweak requested</div>
        <div class="text-sm text-orange-900 leading-relaxed">${escHtml(s.client_feedback)}</div>
      </div>` : ''}

      ${isDossierStyle(s) ? '' : `
      <!-- Hook — the hero (legacy layout, no dossier fields on this row) -->
      ${s.hook ? `
      <div class="bg-slate-50 border border-slate-100 rounded-xl px-4 py-3">
        <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-1.5">THE HOOK</div>
        <div class="text-sm text-slate-800 font-medium leading-relaxed">"${escHtml(s.hook)}"</div>
      </div>` : ''}

      <!-- Filming Direction dashboard — always visible, never collapsed, since this is what
           actually matters most for filming (per direct client feedback: the hook is "so so so
           important," the generic filming-notes blob is not). Covers hook craft (Text Hook,
           Visual Hook, Tonality, Pacing — emerald) AND production (Editing Style, Editing Notes
           — sky) in one consumable panel, so Andrew never has to dig through the raw script to
           find what he needs to actually shoot it. -->
      ${s.filming_direction ? `
      <div class="mt-3">
        <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-1.5">🎬 Filming Direction</div>
        <div class="grid grid-cols-2 gap-2">
          ${Object.entries(s.filming_direction).map(([label, text]) => {
            const isEditing = label.startsWith('Editing');
            const wide = isEditing ? 'col-span-2' : '';
            const bg = isEditing ? 'bg-sky-50 border-sky-100' : 'bg-emerald-50 border-emerald-100';
            const labelColor = isEditing ? 'text-sky-600' : 'text-emerald-600';
            const textColor = isEditing ? 'text-sky-900' : 'text-emerald-900';
            return `
          <div class="${bg} border rounded-xl px-3 py-2 ${wide}">
            <div class="text-[9px] font-semibold ${labelColor} uppercase tracking-widest mb-1">${escHtml(label)}</div>
            <div class="text-[11px] ${textColor} leading-snug">${escHtml(text)}</div>
          </div>`;
          }).join('')}
        </div>
      </div>` : ''}
      `}
    </div>

    ${isDossierStyle(s) ? renderDossierBody(s) : `
    <!-- Ref + Camera (legacy layout) -->
    <div class="px-4 pb-3 space-y-2 border-t border-slate-50 pt-3">
      ${s.reference_clip ? `
      <div class="flex items-start gap-2">
        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest flex-shrink-0 mt-0.5">📹 Ref</span>
        <div class="flex-1">${linkOrText(s.reference_clip)}</div>
      </div>` : ''}
      ${s.camera ? `
      <div class="flex items-center gap-2">
        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">🎥 Cam</span>
        <span class="text-xs text-slate-500">${s.camera}</span>
      </div>` : ''}
    </div>

    <!-- Expand toggle -->
    <button onclick="toggle('${s.id}')"
      class="w-full flex items-center justify-between px-4 py-3 border-t border-slate-100 text-xs text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-colors text-left">
      <span class="font-medium">Full script + filming notes</span>
      <span id="chev-${s.id}" class="text-slate-300">▸</span>
    </button>

    <!-- Expanded -->
    <div id="exp-${s.id}" class="hidden border-t border-slate-100">
      ${s.full_script ? `
      <div class="px-4 pt-4 pb-3">
        <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-2">Script</div>
        <pre class="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed">${escHtml(s.full_script)}</pre>
      </div>` : ''}
      ${s.editor_notes ? `
      <div class="px-4 pb-4 pt-1">
        <div class="bg-amber-50 border border-amber-100 rounded-xl p-3">
          <div class="text-[10px] font-semibold text-amber-600 uppercase tracking-widest mb-1.5">Filming Notes</div>
          <div class="text-xs text-amber-900 leading-relaxed">${escHtml(s.editor_notes)}</div>
        </div>
      </div>` : ''}
    </div>`}

    <!-- Sous Chef Pass — optional, collapsed by default. One per take-group, not per take,
         since it's a breakdown of the reference reel, which is the same across all takes. -->
    ${sousChef ? `
    <button data-sc-key="${escHtml(sousChefGroupKey)}" onclick="toggle(this.dataset.scKey)"
      class="w-full flex items-center justify-between px-4 py-3 border-t border-slate-100 text-xs text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-colors text-left">
      <span class="font-medium">Sous Chef Pass — reference reel breakdown</span>
      <span id="chev-${sousChefGroupKey}" class="text-slate-300">▸</span>
    </button>
    <div id="exp-${sousChefGroupKey}" class="hidden border-t border-slate-100 px-4 py-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        ${Object.entries(sousChef).map(([label, text]) => `
        <div class="bg-violet-50 border border-violet-100 rounded-xl p-3">
          <div class="text-[10px] font-semibold text-violet-500 uppercase tracking-widest mb-1.5">${escHtml(label)}</div>
          <div class="text-xs text-violet-900 leading-relaxed">${escHtml(text)}</div>
        </div>`).join('')}
      </div>
    </div>` : ''}

    <!-- Action buttons -->
    <div class="px-4 pb-4 pt-3 border-t border-slate-100">
      ${needsReview ? `
        <div class="grid grid-cols-3 gap-2">
          ${btn('✅ Film', `moveStatus('${s.id}','Filming')`, 'bg-emerald-500 text-white hover:bg-emerald-600 font-semibold')}
          ${btn('✏️ Tweak', `requestTweak('${s.id}')`, 'border-2 border-orange-300 text-orange-500 hover:bg-orange-50')}
          ${btn('✕ Pass', `moveStatus('${s.id}','Passed')`, 'border border-slate-200 text-slate-400 hover:bg-slate-50')}
        </div>` :
      isPosted ? `<div class="text-center text-xs text-blue-400 font-medium py-1">✓ Posted</div>` :
      isPassed ? `<div class="flex gap-2">
        <div class="flex-1 text-center text-xs text-red-300 py-2">Passed</div>
        ${btn('← Restore', `moveStatus('${s.id}','Needs Review')`, 'border border-slate-200 text-slate-400 hover:bg-slate-50 text-xs')}
      </div>` :
      isArchived ? `<div class="flex gap-2">
        <div class="flex-1 text-center text-xs text-slate-400 py-2">📦 Archived</div>
        ${btn('← Restore', `moveStatus('${s.id}','Draft')`, 'border border-slate-200 text-slate-400 hover:bg-slate-50 text-xs')}
      </div>` : `
      <div class="flex gap-2">
        ${prev && prev !== 'Passed' ? btn(`← ${prev}`, `moveStatus('${s.id}','${prev}')`, 'flex-1 border border-slate-200 text-slate-500 hover:bg-slate-50') : '<div class="flex-1"></div>'}
        ${next && next !== 'Passed' ? btn(`${next} →`, `moveStatus('${s.id}','${next}')`, 'flex-1 bg-slate-800 text-white hover:bg-slate-700') : '<div class="flex-1"></div>'}
      </div>`}
    </div>
  </div>`;
}

// ─────────────────────────────────────────────
// PIPELINE VIEW — a stacked stage list with a progress bar, not kanban (six status columns
// don't fit a phone screen). One row per STATUS_ORDER stage Draft..Posted, a quieter Passed
// row below a divider, and an admin-only Archived footer line.
// ─────────────────────────────────────────────
const PIPELINE_STAGES = STATUS_ORDER.filter(s => s !== 'Passed'); // Draft..Posted

// Item 6 -- Pipeline's "pick your stat" chip (admin only; clients always see the fixed
// "posted" headline below). `status` is the STATUS_ORDER/bucket key for the 5 status-based
// options; `verb` fills the existing "N of Total {verb}" headline pattern. "Scheduled this
// week" is the one non-status option -- no bucket, no verb, its own sentence instead.
const PIPELINE_STAT_OPTIONS = [
  { v: 'posted',        label: 'Posted',              status: 'Posted',       verb: 'posted',      color: 'text-blue-600' },
  { v: 'needsReview',   label: 'Needs Review',        status: 'Needs Review', verb: 'need review',  color: 'text-yellow-700' }, // not yellow-600 -- fails contrast at this weight/size
  { v: 'approved',      label: 'Approved',            status: 'Approved',     verb: 'approved',     color: 'text-emerald-600' },
  { v: 'filming',       label: 'Filming',             status: 'Filming',      verb: 'filming',      color: 'text-orange-600' },
  { v: 'draft',         label: 'Draft',               status: 'Draft',        verb: 'in draft',     color: 'text-slate-600' },
  { v: 'scheduledWeek', label: 'Scheduled this week', status: null,           verb: null,            color: 'text-slate-800' },
];

function renderPipeline() {
  const isAdmin = role === 'admin';
  const clientName = CLIENTS[viewSlug]?.name || viewSlug;
  const groups = activeGroupsFor(viewSlug);

  if (!groups.length) {
    return `
    <div class="text-center py-16 px-6">
      <div class="text-3xl mb-3">📊</div>
      <div class="text-sm font-semibold text-slate-600 mb-1">No scripts yet for ${escHtml(clientName)}.</div>
    </div>`;
  }

  const bucket = {};
  PIPELINE_STAGES.forEach(s => bucket[s] = []);
  const passedBucket = [];
  groups.forEach(g => {
    const st = groupStatus(g);
    if (st === 'Passed') passedBucket.push(g);
    else (bucket[st] || (bucket[st] = [])).push(g);
  });

  const totalNonPassed = PIPELINE_STAGES.reduce((n, s) => n + bucket[s].length, 0);

  // Item 6 -- which stat is driving the headline. Clients always see the fixed "posted"
  // headline (no picker rendered for them below), regardless of whatever an admin session on
  // the same browser last picked.
  const effectiveStat = isAdmin ? pipelineStat : 'posted';
  const statOpt = PIPELINE_STAT_OPTIONS.find(o => o.v === effectiveStat) || PIPELINE_STAT_OPTIONS[0];

  let headlineNumber, headlineSuffix, highlightStatus = null;
  if (statOpt.status) {
    const count = bucket[statOpt.status] ? bucket[statOpt.status].length : 0;
    headlineNumber = count;
    headlineSuffix = `of ${totalNonPassed} ${statOpt.verb}`;
    highlightStatus = statOpt.status;
  } else {
    // "Scheduled this week" -- a count, not a status bucket, so it gets its own sentence.
    const { start, end } = rollingWeekRange();
    const scheduledThisWeek = groupsInRange(groups.filter(g => groupStatus(g) !== 'Passed'), start, end);
    headlineNumber = scheduledThisWeek.length;
    headlineSuffix = `script${headlineNumber === 1 ? '' : 's'} scheduled this week`;
  }
  // Dimming reads as "the eye goes from the number to its matching slice" ONLY when there's a
  // real status to point at AND it actually has a nonzero slice to point to -- dimming
  // everything when the count is 0, or when a non-status stat ("Scheduled this week") is
  // selected, would read as broken/disabled rather than as a filter.
  const dimOtherSegments = highlightStatus !== null && headlineNumber > 0;

  // Summary card + segmented progress bar -- flex-grow by raw COUNT (not percentage) so
  // rounding never leaves a visible gap, min-width 6px so a count of 1 doesn't disappear.
  // Rounded ends come from the track's own overflow-hidden rounded-full; inner edges stay
  // square, the gap-[2px] shows the white card background through as a thin divider.
  const nonZeroStages = PIPELINE_STAGES.filter(s => bucket[s].length > 0);
  const barSegments = nonZeroStages
    .map(s => {
      const dim = dimOtherSegments && s !== highlightStatus;
      return `<div style="flex: ${bucket[s].length} 1 0%; min-width: 6px" class="${STATUS_DOT[s]} transition-opacity ${dim ? 'opacity-25' : ''}"></div>`;
    })
    .join('');

  // Native <select> overlaid transparently on a visible chip -- same iOS-safe overlay-input
  // trick the date chips elsewhere in this file already use. text-base (16px) on the real
  // control prevents iOS Safari's zoom-on-focus.
  const statPicker = isAdmin ? `
    <div class="relative inline-flex items-center ml-2">
      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[10px] font-semibold uppercase tracking-widest whitespace-nowrap">
        ${statOpt.label} <span class="text-slate-400">▾</span>
      </span>
      <select onchange="window.setPipelineStat(this.value)" aria-label="Pipeline stat"
        class="absolute inset-0 w-full h-full opacity-0 text-base" style="font-size:16px">
        ${PIPELINE_STAT_OPTIONS.map(o => `<option value="${o.v}" ${o.v === effectiveStat ? 'selected' : ''}>${o.label}</option>`).join('')}
      </select>
    </div>` : '';

  const summaryCard = `
  <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
    <div class="flex items-center mb-1">
      <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">Progress</div>
      ${statPicker}
    </div>
    <div class="flex items-baseline gap-2 mb-3">
      <div class="text-2xl font-bold ${statOpt.color}">${headlineNumber}</div>
      <div class="text-base font-semibold text-slate-400">${headlineSuffix}</div>
    </div>
    <div class="h-3 flex gap-[2px] rounded-full overflow-hidden ${nonZeroStages.length ? '' : 'bg-slate-100'}">
      ${barSegments}
    </div>
    <div class="flex justify-between text-[10px] uppercase tracking-wide text-slate-400 mt-1.5">
      <span>Draft</span><span>Posted</span>
    </div>
  </div>`;

  // Stage rows — zero-count stage renders as a <div>, not a <button>, so there's no dead-end
  // tap target to an empty list.
  const stageRows = PIPELINE_STAGES.map(stage => {
    const stageGroups = bucket[stage];
    const count = stageGroups.length;
    const dot = STATUS_DOT[stage];

    if (count === 0) {
      return `
      <div class="w-full flex gap-3 pl-3 pr-4 py-3.5 opacity-50">
        <div class="w-1 self-stretch rounded-full ${dot}"></div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">${pill(stage, STATUS_STYLE[stage])}<span class="text-base font-bold text-slate-300 tabular-nums">0</span></div>
          </div>
          <div class="text-[13px] text-slate-400 mt-1">None right now</div>
        </div>
      </div>`;
    }

    const onCalendar = stageGroups.filter(g => groupDate(g)).length;
    const calHint = onCalendar === 0 ? `<span class="text-slate-300">None on calendar yet</span>`
      : onCalendar === count ? `All ${count} on calendar`
      : `${onCalendar} of ${count} on calendar`;

    const titles = stageGroups.slice(0, 3)
      .map(g => `<div class="text-[13px] leading-5 text-slate-500 truncate">${escHtml(g[0].title)}</div>`)
      .join('');
    const more = count > 3 ? `<span>+${count - 3} more</span>` : '<span></span>';

    // jumpToList forces viewMode='all' first so the count tapped here matches what's then
    // shown in List -- otherwise a client/admin looking at the 'testing' mode could tap
    // "12 Draft" and land on a filtered List that only shows 3 of them. `stage` is always one
    // of the fixed STATUS_ORDER strings, never free text, so this interpolation is safe.
    return `
    <button onclick="window.jumpToList('${stage}')" class="w-full text-left flex gap-3 pl-3 pr-4 py-3.5 active:bg-slate-50">
      <div class="w-1 self-stretch rounded-full ${dot}"></div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">${pill(stage, STATUS_STYLE[stage])}<span class="text-base font-bold text-slate-800 tabular-nums">${count}</span></div>
          <span class="text-slate-300">›</span>
        </div>
        <div class="mt-1 space-y-0.5">${titles}</div>
        <div class="flex items-center justify-between mt-1 text-[11px] text-slate-400">
          <span>${more}</span>
          <span>${calHint}</span>
        </div>
      </div>
    </button>`;
  }).join('');

  const stagesCard = `<div class="bg-white rounded-2xl border border-slate-100 overflow-hidden divide-y divide-slate-100">${stageRows}</div>`;

  // Passed row -- dashed border ("set aside"), still tappable, no title previews.
  const passedRow = passedBucket.length ? `
  <button onclick="window.jumpToList('Passed')"
    class="w-full text-left flex items-center justify-between rounded-2xl border border-dashed border-slate-200 px-4 py-3.5">
    <span class="text-sm text-slate-500">✕ ${passedBucket.length} passed</span>
    <span class="text-slate-300">›</span>
  </button>` : '';

  // Archived footer -- admin only, only rendered if something is actually archived.
  const archivedTotal = groupIntoTakes(scripts.filter(s => s.client_slug === viewSlug))
    .filter(g => groupStatus(g) === 'Archived').length;
  const archivedFooter = (isAdmin && archivedTotal > 0)
    ? `<div class="text-center text-[11px] text-slate-300">📦 ${archivedTotal} archived (not shown)</div>`
    : '';

  return [summaryCard, stagesCard, passedRow, archivedFooter].filter(Boolean).join('');
}

// ─────────────────────────────────────────────
// CALENDAR VIEW — month grid keyed off date_planned (the planned POSTING date, not filming
// -- see Q2). Posted items stay visible on the calendar; Passed items are excluded entirely
// (not being made, so nothing to schedule). The unscheduled list sits ABOVE the day panel
// on purpose: the day panel reuses the real dossier card (renderCardGroup), which can run
// 1500px+ tall, so burying unscheduled work below it would make it effectively invisible.
// ─────────────────────────────────────────────
const WEEKDAY_LETTERS = ['S','M','T','W','T','F','S'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function calFormatShort(dateStr) {
  const [yy, mm, dd] = dateStr.split('-').map(Number);
  return `${MONTH_NAMES[mm - 1].slice(0, 3)} ${dd}`;
}
function calFormatDayLabel(dateStr) {
  // Built from decomposed numeric parts via local new Date(y,m,d) -- NOT new Date(dateStr).
  // See the CRITICAL CORRECTNESS note on ymd() above for why that distinction matters.
  const [yy, mm, dd] = dateStr.split('-').map(Number);
  const d = new Date(yy, mm - 1, dd);
  const weekday = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return `${weekday}, ${MONTH_NAMES[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
}

// ─────────────────────────────────────────────
// NEXT-7-DAYS STRIP (Item 4) — the actual answer to "these are the scripts for THIS week."
// Rolling window (today + next 6), not a Sun-Sat calendar week -- see rollingWeekRange(). Each
// day card is a single <button> (no nested buttons/inputs) that calls the same
// window.selectCalDay() the month grid already uses, so tapping a strip card opens the day
// panel below exactly like tapping a grid day does.
// ─────────────────────────────────────────────
function renderNext7Strip() {
  const isAdmin = role === 'admin';
  const { start, end } = rollingWeekRange();
  const activeNonPassed = activeGroupsFor(viewSlug).filter(g => groupStatus(g) !== 'Passed');
  const inRange = groupsInRange(activeNonPassed, start, end);

  const now = new Date();
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    const dateStr = ymd(d.getFullYear(), d.getMonth(), d.getDate());
    const dayGroups = inRange.filter(g => groupDate(g) === dateStr);
    days.push({ dateStr, dayNum: d.getDate(), weekday: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()], dayGroups, isToday: i === 0 });
  }

  const totalCount = inRange.length;

  if (totalCount === 0) {
    return `
    <div class="rounded-2xl border border-dashed border-slate-200 px-5 py-6 text-center">
      <div class="text-sm text-slate-500">Nothing planned in the next 7 days.</div>
      ${isAdmin ? `<div class="text-xs text-slate-400 mt-1">Set a date on a script below to fill this in.</div>` : ''}
    </div>`;
  }

  // "Oct 21–27" when both ends fall in the same month, "Oct 28–Nov 3" across a boundary.
  const [sMon, sDay] = calFormatShort(start).split(' ');
  const [eMon, eDay] = calFormatShort(end).split(' ');
  const rangeStr = sMon === eMon ? `${sMon} ${sDay}–${eDay}` : `${calFormatShort(start)}–${calFormatShort(end)}`;

  const dayCards = days.map(day => {
    const dayLabel = day.isToday ? 'Today' : `${day.weekday} ${day.dayNum}`;

    if (!day.dayGroups.length) {
      return `
      <button onclick="window.selectCalDay('${day.dateStr}')"
        class="flex-none snap-start w-[42%] rounded-xl border border-dashed border-slate-200 px-3 py-3 text-left">
        <div class="text-xs font-semibold ${day.isToday ? 'text-blue-600' : 'text-slate-500'} mb-2">${dayLabel}</div>
        <div class="text-xs text-slate-300 text-center py-4">Nothing planned</div>
      </button>`;
    }

    const shown = day.dayGroups.slice(0, 2);
    const more = day.dayGroups.length - shown.length;
    const rows = shown.map(g => {
      const st = groupStatus(g);
      return `
      <div class="flex items-center gap-1.5 mb-1 min-w-0">
        <span class="text-[9px] font-semibold px-1.5 py-0.5 rounded-full flex-shrink-0 ${STATUS_STYLE[st]}">${st}</span>
        <span class="text-[11px] text-slate-600 truncate">${escHtml(g[0].title)}</span>
      </div>`;
    }).join('');

    return `
    <button onclick="window.selectCalDay('${day.dateStr}')"
      class="flex-none snap-start w-[42%] rounded-xl border ${day.isToday ? 'border-blue-200 bg-blue-50/40' : 'border-slate-100 bg-white'} px-3 py-3 text-left shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <div class="text-xs font-semibold ${day.isToday ? 'text-blue-600' : 'text-slate-500'}">${dayLabel}</div>
        <div class="text-[10px] text-slate-400">${day.dayGroups.length}</div>
      </div>
      ${rows}
      ${more > 0 ? `<div class="text-[10px] text-slate-400 mt-0.5">+${more} more</div>` : ''}
    </button>`;
  }).join('');

  return `
  <div>
    <div class="flex items-center justify-between px-0.5 mb-2">
      <div class="text-sm font-bold text-slate-800">Next 7 days</div>
      <div class="text-xs text-slate-400">${totalCount} script${totalCount === 1 ? '' : 's'} · ${rangeStr}</div>
    </div>
    <div class="relative">
      <div id="next7-strip" class="flex gap-2 overflow-x-auto snap-x snap-mandatory no-scrollbar pb-1">
        ${dayCards}
      </div>
      <div class="pointer-events-none absolute right-0 top-0 bottom-1 w-10 bg-gradient-to-l from-slate-50 to-transparent"></div>
    </div>
  </div>`;
}

function renderCalendar() {
  const isAdmin = role === 'admin';

  if (!calMonth) {
    const now = new Date();
    calMonth = { y: now.getFullYear(), m: now.getMonth() };
  }

  const allActiveGroups = activeGroupsFor(viewSlug);
  if (!allActiveGroups.length) {
    return `<div class="text-center py-16 px-6"><div class="text-3xl mb-3">🗓️</div><div class="text-sm font-semibold text-slate-600 mb-1">No scripts here.</div></div>`;
  }

  // Shared with the Next-7-days strip above -- same rolling window, so the grid's "this week"
  // tint always agrees with what the strip is showing.
  const { start: rw7Start, end: rw7End } = rollingWeekRange();

  // Passed = not being made -- excluded from the schedule, not just dimmed.
  const calendarGroups = allActiveGroups.filter(g => groupStatus(g) !== 'Passed');

  const byDay = {};
  const unscheduled = [];
  calendarGroups.forEach(g => {
    const d = groupDate(g);
    if (d) (byDay[d] || (byDay[d] = [])).push(g);
    else unscheduled.push(g);
  });

  const now = new Date();
  const todayStr = ymd(now.getFullYear(), now.getMonth(), now.getDate());
  const { y, m } = calMonth;
  const isCurrentMonth = y === now.getFullYear() && m === now.getMonth();

  // Measure the real sticky header height so the day panel's scroll-margin-top accounts for
  // it -- a plain scrollIntoView would otherwise hide the panel's own title behind the header.
  const stickyEl = document.querySelector('.sticky');
  const scrollMarginStyle = `scroll-margin-top:${(stickyEl ? stickyEl.offsetHeight : 120) + 12}px`;

  // Grid cells -- ALWAYS 42 (6 weeks) for stable height across months. new Date(y, m, dayNum)
  // with dayNum < 1 or > daysInMonth rolls over correctly in JS and is built from local parts
  // (never a parsed string), so this is safe under the CRITICAL CORRECTNESS rule above.
  const startWeekday = new Date(y, m, 1).getDay();
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const cellDate = new Date(y, m, i - startWeekday + 1);
    const dateStr = ymd(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
    const inMonth = cellDate.getMonth() === m && cellDate.getFullYear() === y;
    cells.push({ dateStr, dayNum: cellDate.getDate(), inMonth });
  }

  const cellsHtml = cells.map(c => {
    const dayGroups = byDay[c.dateStr] || [];
    const dots = dayGroups.map(g => groupStatus(g)).sort((a, b) => STATUS_ORDER.indexOf(a) - STATUS_ORDER.indexOf(b));
    const shown = dots.slice(0, 3);
    const overflow = dots.length - shown.length;
    const isSelected = calSelectedDay === c.dateStr;
    const isToday = c.dateStr === todayStr;

    const numClasses = isSelected ? 'bg-slate-800 text-white font-semibold'
      : isToday ? 'ring-1 ring-inset ring-slate-300 text-slate-800 font-bold'
      : !c.inMonth ? 'text-slate-300'
      : dayGroups.length ? 'text-slate-800 font-semibold'
      : 'text-slate-500 font-normal';

    // Item 4 -- tie the grid visually to the Next-7-days strip above: cells that fall inside
    // the same rolling window get a subtle tint. Today/selected already have their own
    // stronger treatment on the number circle, so they take priority (no tint underneath).
    const inRollingWindow = c.dateStr >= rw7Start && c.dateStr <= rw7End;
    const cellBg = (!isSelected && !isToday && inRollingWindow) ? 'bg-slate-50' : '';

    return `
    <button onclick="window.selectCalDay('${c.dateStr}')" class="h-12 flex flex-col items-center pt-1 gap-1 rounded-xl active:bg-slate-100 ${cellBg}">
      <span class="w-7 h-7 rounded-full flex items-center justify-center text-[13px] tabular-nums ${numClasses}">${c.dayNum}</span>
      <div class="flex items-center gap-0.5 ${c.inMonth ? '' : 'opacity-40'}">
        ${shown.map(st => `<span class="w-1.5 h-1.5 rounded-full ${STATUS_DOT[st]}"></span>`).join('')}
        ${overflow > 0 ? `<span class="text-[10px] font-semibold text-slate-400">+${overflow}</span>` : ''}
      </div>
    </button>`;
  }).join('');

  // Item 5 -- "?" legend trigger joins the ‹ › month-nav arrows in the same button group, so
  // the arrows shrink to match (w-9 h-9, down from w-10 h-10) to keep "September 2026 · Today"
  // fitting on a narrow screen. Only shown when the persisted "Always show color key" setting
  // is OFF -- when it's ON, the legend just renders at the bottom of the card as it always has
  // (see legendBottom below) and this trigger is skipped entirely.
  const legendTrigger = !settingAlwaysShowKey ? `
    <button onclick="window.toggleCalShowKey()" aria-label="Show color key" aria-expanded="${calShowKey}"
      class="w-9 h-9 rounded-full flex items-center justify-center text-slate-400 active:bg-slate-100">
      <span class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-[11px] font-semibold">?</span>
    </button>` : '';

  const monthBar = `
  <div class="flex items-center justify-between px-4 pt-4 pb-2">
    <div class="flex items-center gap-2">
      <div class="text-sm font-bold text-slate-800">${MONTH_NAMES[m]} ${y}</div>
      ${!isCurrentMonth ? `<button onclick="window.calGoToday()" class="text-xs font-semibold text-blue-600">Today</button>` : ''}
    </div>
    <div class="flex items-center gap-1">
      ${legendTrigger}
      <button onclick="window.calShiftMonth(-1)" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-400 active:bg-slate-100">‹</button>
      <button onclick="window.calShiftMonth(1)" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-400 active:bg-slate-100">›</button>
    </div>
  </div>`;

  const weekdayHeader = `
  <div class="grid grid-cols-7 px-2">
    ${WEEKDAY_LETTERS.map(l => `<div class="h-7 flex items-center justify-center text-[11px] font-semibold text-slate-400 uppercase">${l}</div>`).join('')}
  </div>`;

  // Item 5 -- the legend body itself is unchanged markup either way; what changes is WHERE it
  // renders. Inline (under the month bar, only while calShowKey is toggled on) adds one extra
  // line tying the dot order back to STATUS_ORDER. Bottom-of-card (the original placement,
  // used when "Always show color key" is on) stays exactly as it rendered before this round.
  const legendBody = `
  <div class="flex flex-wrap gap-x-3 gap-y-1.5 px-4 py-2.5 border-t border-slate-50">
    ${PIPELINE_STAGES.map(st => `<div class="flex items-center gap-1.5 text-[11px] text-slate-500"><span class="w-2 h-2 rounded-full ${STATUS_DOT[st]}"></span>${st}</div>`).join('')}
  </div>`;
  const legendExtraLine = `<div class="px-4 pb-2.5 -mt-1 text-[10px] text-slate-400 italic">Dots are always ordered Draft → Posted.</div>`;
  const legendInline = (!settingAlwaysShowKey && calShowKey) ? `${legendBody}${legendExtraLine}` : '';
  const legendBottom = settingAlwaysShowKey ? legendBody : '';

  const calendarCard = `
  <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
    ${monthBar}
    ${legendInline}
    ${weekdayHeader}
    <div class="grid grid-cols-7 gap-y-0.5 px-2 pb-2">${cellsHtml}</div>
    ${legendBottom}
  </div>`;

  // Unscheduled -- collapsed bar, expands to compact rows. Admin rows get a native date
  // input overlaid as a visible chip (a bare empty <input type=date> is nearly invisible on
  // iOS Safari); it's a SEPARATE sibling from the row's own <button>, never nested inside it
  // (nesting an input in a button is invalid HTML and causes double-tap bugs). Non-admin, or
  // an admin tapping outside the chip, jumps straight to the filtered List.
  const unscheduledSection = unscheduled.length ? `
  <div class="mt-3 bg-white rounded-2xl border border-slate-100 overflow-hidden">
    <button onclick="window.toggleUnscheduled()" class="w-full flex items-center justify-between px-4 py-3 text-left active:bg-slate-50">
      <span class="text-sm text-slate-600">📌 <b>${unscheduled.length}</b> not scheduled yet</span>
      <span class="text-slate-300">${calShowUnscheduled ? '▾' : '▸'}</span>
    </button>
    ${calShowUnscheduled ? `
    <ul class="divide-y divide-slate-100 border-t border-slate-100">
      ${unscheduled.map(g => {
        const s = g[0];
        const st = groupStatus(g);
        const groupKey = takeGroupKey(s);
        const takeChip = g.length > 1 ? `<span class="text-[10px] font-semibold bg-violet-100 text-violet-600 px-2 py-0.5 rounded-full flex-shrink-0">${g.length} takes</span>` : '';
        // jumpToList forces viewMode='all', same reasoning as the Pipeline jump above --
        // Calendar/Pipeline both operate over ALL groups regardless of testing/all mode, so
        // landing on a 'testing'-filtered List could hide the very item that was just tapped.
        // `st` is always a groupStatus() return value (a fixed STATUS_ORDER/'Archived' string,
        // never free text), so this interpolation is safe.
        return `
        <li class="flex items-center gap-2 px-4 py-3">
          <button onclick="window.jumpToList('${st}')" class="flex-1 min-w-0 text-left flex items-center gap-2">
            <span class="flex-1 min-w-0 truncate text-sm text-slate-700">${escHtml(s.title)}</span>
            ${s.reel_number ? `<span class="text-xs text-slate-300 flex-shrink-0">#${s.reel_number}</span>` : ''}
            ${pill(st, STATUS_STYLE[st])}
            ${takeChip}
          </button>
          ${isAdmin
            ? `<label class="relative h-9 px-3 inline-flex items-center rounded-full bg-blue-50 border border-blue-100 text-xs font-medium text-blue-600 flex-shrink-0">
                 📅 Set date
                 <input type="date" data-group-key="${escHtml(groupKey)}" class="absolute inset-0 w-full h-full opacity-0 text-base"
                   onclick="this.showPicker && this.showPicker()"
                   onchange="window.setGroupDate(this.dataset.groupKey, this.value || null)">
               </label>`
            : `<span class="text-slate-300 flex-shrink-0">›</span>`}
        </li>`;
      }).join('')}
    </ul>` : ''}
  </div>` : '';

  // Selected-day panel OR the empty-month state -- the two are mutually exclusive, the
  // empty state replaces (doesn't stack under) the day-panel slot.
  const monthHasAnyDated = Object.keys(byDay).some(d => {
    const [dy, dm] = d.split('-').map(Number);
    return dy === y && (dm - 1) === m;
  });

  let dayPanelSlot = '';
  if (calSelectedDay) {
    const dayGroups = byDay[calSelectedDay] || [];
    dayPanelSlot = `
    <section id="day-panel" class="mt-5" style="${scrollMarginStyle}">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-bold text-slate-800">${calFormatDayLabel(calSelectedDay)}</div>
        <div class="text-xs text-slate-400">${dayGroups.length} script${dayGroups.length === 1 ? '' : 's'}</div>
      </div>
      <div class="space-y-3">
        ${dayGroups.length
          ? dayGroups.map(renderCardGroup).join('')
          : `<div class="rounded-2xl border border-dashed border-slate-200 px-5 py-8 text-center"><div class="text-sm text-slate-500">Nothing planned for this day.</div></div>`}
      </div>
    </section>`;
  } else if (!monthHasAnyDated) {
    const allDated = Object.keys(byDay).sort();
    const future = allDated.filter(d => d >= todayStr);
    const nextPlanned = future.length ? future[0] : (allDated.length ? allDated[allDated.length - 1] : null);
    const copy = isAdmin
      ? { l1: 'Nothing on the calendar yet', l2: 'Set a date on any script above to place it here.' }
      : { l1: 'Nothing on the calendar yet', l2: "Filming dates will show up here once they're set." };
    dayPanelSlot = `
    <section id="day-panel" class="mt-5" style="${scrollMarginStyle}">
      <div class="rounded-2xl border border-dashed border-slate-200 px-5 py-8 text-center">
        <div class="text-sm text-slate-500">${copy.l1}<br>${copy.l2}</div>
        ${nextPlanned ? `<button onclick="window.calJumpToDate('${nextPlanned}')" class="mt-3 text-sm font-semibold text-blue-600">Next planned: ${calFormatShort(nextPlanned)} →</button>` : ''}
      </div>
    </section>`;
  }

  // Item 7 -- final order: Next-7-days strip, a divider, then the existing month bar / legend /
  // grid / unscheduled / day-panel stack, untouched below this point.
  const next7Section = `<div class="mb-3">${renderNext7Strip()}</div><div class="border-t border-slate-200 mb-3"></div>`;

  return `${next7Section}${calendarCard}${unscheduledSection}${dayPanelSlot}`;
}

function scrollToDayPanel() {
  // DOM is fully rebuilt on every renderDash(), so the panel can't be scrolled to until
  // after that rebuild lands -- requestAnimationFrame waits for the next paint instead of
  // racing the innerHTML assignment.
  requestAnimationFrame(() => {
    const el = document.getElementById('day-panel');
    if (!el) return;
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  });
}

// ─────────────────────────────────────────────
// ACTIONS (global so onclick= works)
// ─────────────────────────────────────────────
// Native List browsing (status tabs, mode toggle, client switch) always resets
// viewStatusExact to false -- it's only ever set true by a jump FROM Pipeline/Calendar
// (see window.jumpToList below), and should never stick around after that.
window.setClient   = slug => { viewSlug = slug; viewStatus = 'all'; viewStatusExact = false; calSelectedDay = null; saveLastView(); renderDash(); };
window.setStatus2  = s    => { viewStatus = s; viewStatusExact = false; renderDash(); };
window.setMode     = m    => { viewMode = m; viewStatus = 'all'; viewStatusExact = false; renderDash(); };
// Keep viewTab/calMonth across a client switch (so admin can compare clients month-to-month)
// but a selected day from client A's calendar shouldn't carry over to client B's.
window.setViewTab  = t    => { viewTab = t; calSelectedDay = null; saveLastView(); window.scrollTo(0, 0); renderDash(); };
window.moveStatus  = (id, status) => setStatus(id, status);
window.requestTweak = (id) => requestTweak(id);
window.doLogout    = () => { unsubscribeLiveChanges(); sb.auth.signOut(); };

// Item 1 -- Filters pill (List, admin only). Persisted.
window.toggleFiltersOpen = () => { filtersOpen = !filtersOpen; lsSetBool('hub_filters_open', filtersOpen); renderDash(); };

// Item 2 -- settings popover. Open/close are transient; the two settings inside it persist
// individually (see their setters below). Neither setter closes the panel -- the owner should
// be able to see the effect of a change (e.g. the "Currently: ..." line, or the calendar
// reacting to the color-key toggle) without it snapping shut.
//
// K3 -- dialog focus management: opening moves focus to the first focusable element inside the
// panel (the ✕ close button, which is first in DOM order); closing (by ANY method -- the gear
// button toggling it shut, the backdrop, Escape, or the ✕ itself) returns focus to the gear
// button. Both are one requestAnimationFrame after renderDash() rebuilds the DOM, same timing
// scrollToDayPanel()/restoreFocusAfterRedraw() already rely on.
window.toggleSettings     = () => {
  const opening = !settingsOpen;
  settingsOpen = opening;
  renderDash();
  requestAnimationFrame(() => {
    const el = document.querySelector(`[data-focus-id="${opening ? 'settings-close' : 'settings-gear'}"]`);
    if (el) el.focus();
  });
};
window.closeSettings      = () => {
  settingsOpen = false;
  renderDash();
  requestAnimationFrame(() => {
    const el = document.querySelector('[data-focus-id="settings-gear"]');
    if (el) el.focus();
  });
};
// K1 -- capture whichever control currently has focus BEFORE the value change + redraw below,
// so restoreFocusAfterRedraw() (called at the end of every renderDashInner()) can put focus
// back where it was.
window.setOpenOnSignIn    = v  => { captureFocusForRedraw(); settingOpenOnSignIn = v; lsSetStr('hub_setting_open_on_signin', v); renderDash(); };
window.toggleAlwaysShowKey = () => { captureFocusForRedraw(); settingAlwaysShowKey = !settingAlwaysShowKey; lsSetBool('hub_setting_show_key', settingAlwaysShowKey); renderDash(); };

// Item 5 -- inline "?" legend expand/collapse (Calendar). Transient, not persisted -- separate
// from the persisted "Always show color key" SETTING above.
window.toggleCalShowKey = () => { calShowKey = !calShowKey; renderDash(); };

// Item 6 -- Pipeline's stat picker. Persisted.
window.setPipelineStat = v => { pipelineStat = v; lsSetStr('hub_pipeline_stat', v); renderDash(); };

// Single jump-in helper for every "tap a count in Pipeline/Calendar -> land in List" path
// (Pipeline stage rows, the Passed row, unscheduled Calendar rows) -- replaces copy-pasted
// inline onclick strings. viewStatusExact=true makes List's own filter match groupStatus()
// exactly (same bucketing Pipeline/Calendar just used), instead of List's native per-take
// `.some()` filter, so the count just tapped matches what List then shows (F1/F2). Also
// resets scroll to the top of the page (F3) since landing mid-page was disorienting.
window.jumpToList = (status) => {
  viewMode = 'all';
  viewTab = 'list';
  viewStatus = status;
  viewStatusExact = true;
  calSelectedDay = null;
  renderDash();
  window.scrollTo(0, 0);
};

// Calendar navigation / selection -- all plain state writes + renderDash(), see the
// calMonth/calSelectedDay/calShowUnscheduled comment at their declaration for why these
// live as module-level `let`s instead of DOM state.
window.calGoToday      = () => {
  const now = new Date();
  calMonth = { y: now.getFullYear(), m: now.getMonth() };
  calSelectedDay = null; // clear -- a day selected in the month just left shouldn't linger
  renderDash();
};
window.calShiftMonth   = delta => {
  let { y, m } = calMonth;
  m += delta;
  if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
  calMonth = { y, m };
  // Clear the selected day on month nav -- otherwise the day panel keeps showing a date from
  // the month you just left, AND incorrectly suppresses the "nothing planned this month" empty
  // state (which only renders when no day is selected).
  calSelectedDay = null;
  renderDash();
};
window.selectCalDay    = d => {
  const selecting = calSelectedDay !== d; // toggle: re-tapping the same day deselects it
  calSelectedDay = selecting ? d : null;
  if (selecting) calScrollPending = true; // only scroll when a day is actually being opened
  renderDash();
};
window.toggleUnscheduled = () => { calShowUnscheduled = !calShowUnscheduled; renderDash(); };
window.calJumpToDate   = dateStr => {
  const [yy, mm] = dateStr.split('-').map(Number);
  calMonth = { y: yy, m: mm - 1 };
  calSelectedDay = dateStr;
  calScrollPending = true; // jumping straight to a specific date should scroll to its panel
  renderDash();
};

// Admin-only: writes date_planned to every take in a group at once (Q3 -- a multi-take
// group shares one posting date). ymdOrNull is either a 'YYYY-MM-DD' string straight from a
// native <input type=date>'s .value, or null to clear the date. Gated behind role==='admin'
// at the UI layer only (the date-input chips are only rendered for admins) -- same caveat as
// every other write in this app: Supabase RLS on `scripts` doesn't itself separate clients,
// so this is a UI convenience, not a hard security boundary (pre-existing, out of scope here).
window.setGroupDate = async (groupKey, ymdOrNull) => {
  try {
    const rows = scripts.filter(s => takeGroupKey(s) === groupKey);
    if (!rows.length) return;
    // Reject a malformed/partial value (desktop date-input footgun) instead of writing it --
    // null is still a legitimate "clear the date" request and always allowed through.
    if (ymdOrNull && !isValidPlannedDate(ymdOrNull)) {
      console.warn('setGroupDate: ignoring invalid date value', ymdOrNull);
      return;
    }
    const payload = { date_planned: ymdOrNull || null };
    const ids = rows.map(s => s.id);
    // .select('id') asks Supabase to hand back the rows it actually matched -- a token refresh
    // failure (session expired while the PWA was left open) can make .update().in() match ZERO
    // rows and still resolve with no error, which would otherwise look identical to a real
    // success and optimistically patch local state with a date that was never saved.
    const { data, error } = await sb.from('scripts').update(payload).in('id', ids).select('id');
    if (error) { renderError(error); return; }
    if (!data || data.length !== ids.length) {
      renderError(new Error("The date didn't save -- your session may have expired. Please sign in again and retry."));
      return;
    }
    rows.forEach(s => Object.assign(s, payload));
    renderDash();
  } catch (e) {
    renderError(e);
  }
};

window.toggle = id => {
  const el = document.getElementById(`exp-${id}`);
  const ch = document.getElementById(`chev-${id}`);
  el.classList.toggle('hidden');
  ch.textContent = el.classList.contains('hidden') ? '▸' : '▾';
};

function escHtml(str) {
  // Defensive: a field value that isn't a plain string (e.g. a list/object from a jsonb
  // column) must never crash the whole render. One bad field should degrade gracefully
  // (shown as its JSON form) instead of taking down every card on the page -- this exact
  // failure mode happened for real (Day 26's "overlays" field was a list, not a string).
  if (str == null) return '';
  if (typeof str !== 'string') { try { str = JSON.stringify(str); } catch (e) { str = String(str); } }
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────
// GO
// ─────────────────────────────────────────────
init();
</script>
</body>
</html>
