      <div class="hub-top-actions">
        ${helpButton}
        ${requestsButton}
        ${moreButton}
        ${gearButton}
        <button type="button" onclick="doLogout()" class="signout-btn">Sign out</button>
      </div>
    </div>`;

  // ───────────────────────────────────────────
  // ITEM 1 (row 3) — collapsed "Filters" pill + always-visible mode/status chips. Admin + List
  // only. The chips must always reflect the REAL active filter even while collapsed -- admin
  // defaults to 'testing' mode, which hides most of the backlog, so silently hiding that from
  // view would be a "where did my scripts go" trap.
  // ───────────────────────────────────────────
  const modeChipLabel = effectiveMode === 'testing' ? '🧪 In Testing' : '📋 All';
  const modeChipCount = effectiveMode === 'testing' ? testingGroups.length : allGroups.length;
  const modeChip = `<span class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">${modeChipLabel} <span class="opacity-60">· ${modeChipCount}</span></span>`;

  // F4 -- count GROUPS (visibleGroups, already filtered to this exact status above), not raw
  // takes (countByStatus) -- the cards actually on screen are grouped, so a chip built from
  // per-take counts can show a different number than what's visible, the same mismatch a prior
  // QA round already fixed for the Pipeline->List jump path.
  const statusChip = viewStatus !== 'all' ? `
    <button onclick="window.setStatus2('all')" class="flex-shrink-0 min-h-11 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-white">
      ${viewStatus} <span class="opacity-70">· ${visibleGroups.length}</span> <span class="opacity-80">✕</span>
    </button>` : '';

  const moreDrawer = (isAdmin && !previewSlug && moreOpen && hubPage === 'main') ? `
    <div class="more-back" id="more-drawer" onclick="window.toggleMore(false)">
      <div class="more-sheet" role="dialog" aria-modal="true" aria-label="More" onclick="event.stopPropagation()">
        <div class="more-head">
          <div class="eyebrow">More</div>
          <button type="button" class="tool-btn" onclick="window.toggleMore(false)">Done</button>
        </div>
        <button type="button" class="shot-edit" onclick="window.openFormatVault()">Format Vault</button>
        <button type="button" class="shot-edit" onclick="window.openEdits()">Script edits</button>
        ${clientTabs ? `<div class="eyebrow">Clients</div>${clientTabs}` : ''}
        ${viewToggle ? `<div class="eyebrow">View</div>${viewToggle}` : ''}
        ${modeTabs ? `<div class="eyebrow">Scripts</div>${modeTabs}` : ''}
        <div class="eyebrow">Status</div>
        <div class="filter-row">${statusTabs}</div>
        ${typeBar ? `<div class="eyebrow">Type</div>${typeBar}` : ''}
        ${searchBox}
        ${viewStatus !== 'all' || viewMode !== 'all' || viewType !== 'all' || listSearch ? modeChip + statusChip : ''}
      </div>
    </div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="hub-shell min-h-screen flex flex-col relative">

      <div class="hub-header">
        ${headerRow1}
        ${isAdmin && viewingAsClient() ? renderClientJumpBar() : ''}
      </div>

      <!-- Settings popover (Item 2) -- backdrop first (so it's visually "behind"), panel
           second. Both are siblings of the sticky header (not nested inside it) so z-index
           comparisons aren't capped by the header's own stacking context. -->
      ${settingsBackdrop}
      ${settingsPanel}

      <div class="hub-main">
        ${renderContextBar()}
        ${renderAdminSoftBanner()}
        ${body}
      </div>
    </div>
    ${moreDrawer}
    ${renderHubModal()}`;

  // Day-panel scroll (Calendar view only) -- DOM is fully rebuilt above, so the panel can't
  // be scrolled to until after this innerHTML assignment. See renderCalendar() for details.
  // One-shot: only consume calScrollPending (set by an actual day-tap/jump-to-date action),
  // never re-derive from calSelectedDay existing -- that would re-fire the scroll on every
  // unrelated redraw while a day stays selected (realtime updates, take-tab taps, status
  // buttons inside the day panel, expanding unscheduled, month nav).
  if (calScrollPending) { calScrollPending = false; scrollToDayPanel(); }

  // Restore the Next-7-days strip's scroll position captured at the top of this function --
  // same requestAnimationFrame-after-rebuild technique as scrollToDayPanel(), just for
  // scrollLeft instead of scrollIntoView. A no-op when the strip isn't in the DOM (not on
  // Calendar) or was already at scrollLeft 0.
  requestAnimationFrame(() => {
    const el = document.getElementById('next7-strip');
    if (el) el.scrollLeft = next7ScrollLeft;
  });

  // F2 -- single source of truth for "remember last view" persistence (admin only), instead of
  // requiring every individual navigation action to remember to call saveLastView() itself.
  // jumpToList() (Pipeline/Calendar -> List) was exactly this gap: it changes viewSlug/viewTab
  // just like setClient()/setViewTab() do, but never saved, so "Where I left off" silently
  // stopped reflecting reality after a jump-in. Runs once per render and compares against what's
  // already saved so it's a no-op write when nothing actually changed.
  if (isAdmin && user && !previewSlug) {
    const saved = loadLastView(user.id);
    if (!saved || saved.viewTab !== viewTab) saveLastView();
  }

  // K1 -- restore keyboard focus into the just-rebuilt DOM, if a settings change captured it
  // above. No-op when nothing was captured (every other redraw path).
  restoreFocusAfterRedraw();
  syncHubHeaderOffset();
  requestAnimationFrame(() => {
    syncHubHeaderOffset();
    requestAnimationFrame(syncHubHeaderOffset);
  });
  if (navScrollScope) {
    const scope = navScrollScope;
    navScrollScope = '';
    requestAnimationFrame(() => {
      const header = document.querySelector('.hub-header');
      const detail = document.getElementById('detail-' + scope);
      if (!detail) return;
      const headerH = header ? header.offsetHeight : 0;
      const top = detail.getBoundingClientRect().top;
      if (top < headerH + 4 || top > window.innerHeight * 0.4) {
        window.scrollTo({ top: Math.max(0, top + window.scrollY - (headerH + 8)), behavior: 'auto' });
      }
      const stage = detail.closest('.script-stage');
      const onBtn = stage && stage.querySelector('.script-nav-btn.is-on');
      if (onBtn) {
        const nav = onBtn.closest('.script-nav');
        if (nav && nav.scrollHeight > nav.clientHeight + 8) onBtn.scrollIntoView({ block: 'nearest' });
      }
    });
  }
  if (modalFocusPending) {
    modalFocusPending = false;
    requestAnimationFrame(() => {
      const el = document.getElementById('modal-primary');
      if (el) el.focus();
    });
  }
  kickThumbResolves();
}

// ─────────────────────────────────────────────
// SETTINGS POPOVER (Item 2) — admin only. Anchored top-right under the header row, closes on
// backdrop tap / Escape / its own ✕. Changing a setting does NOT close it (so you can see the
// "Currently: ..." line update live, or flip the color-key toggle and immediately see the
// calendar react, without the panel snapping shut).
// ─────────────────────────────────────────────
function renderSettingsPanel() {
  // "Currently: ..." reflects whatever is actually SAVED to localStorage (what would be
  // restored on the next sign-in), not just the live in-memory state -- the two normally match
  // (renderDashInner() centrally calls saveLastView() once per render whenever viewSlug/viewTab
  // changed, see F2 there), but this is the one piece of UI that makes the otherwise-invisible
  // "remember last view" rule inspectable.
  const saved = user ? loadLastView(user.id) : null;
  const curTab  = (saved && VIEW_TABS.includes(saved.viewTab)) ? saved.viewTab : viewTab;
  const curTabLabel = VIEW_TAB_LABEL[curTab];
  const currentlyLine = curTabLabel;

  const openOptions = [
    { v: 'last',     label: 'Where I left off' },
    { v: 'list',     label: 'List' },
    { v: 'calendar', label: 'Calendar' },
    { v: 'pipeline', label: 'Pipeline' },
  ];

  const radioRows = openOptions.map(o => `
    <label class="flex items-start gap-2.5 py-2 cursor-pointer">
      <input type="radio" name="openOnSignIn" value="${o.v}" data-focus-id="signin-${o.v}" ${settingOpenOnSignIn === o.v ? 'checked' : ''}
        onchange="window.setOpenOnSignIn('${o.v}')" class="mt-0.5 accent-slate-800">
      <span class="flex-1">
        <span class="block text-sm text-slate-700">${o.label}</span>
        ${o.v === 'last' ? `<span class="block text-[11px] text-slate-400 mt-0.5">Currently: ${currentlyLine}</span>` : ''}
      </span>
    </label>`).join('');

  return `
  <!-- C2 -- this outer wrapper is "fixed inset-x-0 top-0", anchored to the VIEWPORT, not to the
       page's scrolling flow. The old markup put "absolute" directly on the panel, positioned
       relative to the outer page wrapper (which scrolls with the page) -- so scrolling down even
       slightly carried the panel off-screen while the gear icon (sticky header) stayed visible,
       and the still-fixed, still-full-viewport backdrop kept eating the next tap. The wrapper
       itself has no height (zero-height box, "pointer-events-none") so it can't block clicks
       outside the panel; the panel re-enables pointer-events on itself. Constraining the inner
       column to "max-w-xl mx-auto" keeps the panel lined up with the rest of the app's content
       column exactly like before.

       K2 -- id="settings-panel" is how the document-level Tab-trap keydown listener (see its
       declaration above) finds this panel's focusable controls without needing its own
       per-render listener. max-h-[calc(100vh-5rem)]/overflow-y-auto keeps the whole panel
       reachable (scrollable) on a short/landscape screen instead of letting its bottom content
       get cut off with no way to scroll down to it. -->
  <div class="fixed inset-x-0 top-0 z-40 pointer-events-none">
    <div class="hub-shell relative">
      <div id="settings-panel" class="settings-panel pointer-events-auto absolute top-16 overflow-y-auto bg-white rounded-2xl border border-slate-200 shadow-lg p-4" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm font-bold text-slate-800">Settings</div>
          <button data-focus-id="settings-close" onclick="window.closeSettings()" aria-label="Close settings" class="text-slate-300 hover:text-slate-500 text-sm w-11 h-11 flex items-center justify-center flex-shrink-0">✕</button>
        </div>

        <div class="mb-1">
          <div id="open-on-signin-label" class="text-[11px] font-semibold text-slate-400 uppercase tracking-widest mb-1">Open on sign-in</div>
          <div class="divide-y divide-slate-100" role="radiogroup" aria-labelledby="open-on-signin-label">${radioRows}</div>
        </div>

        <div class="border-t border-slate-100 mt-2 pt-3 flex items-center justify-between gap-3">
          <div id="always-show-key-label" class="text-sm text-slate-700">Always show color key</div>
          <button data-focus-id="always-show-key" onclick="window.toggleAlwaysShowKey()" role="switch" aria-checked="${settingAlwaysShowKey}" aria-labelledby="always-show-key-label"
            class="relative w-11 h-6 rounded-full flex-shrink-0 transition-colors ${settingAlwaysShowKey ? 'bg-slate-800' : 'bg-slate-200'}">
            <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform ${settingAlwaysShowKey ? 'translate-x-5' : ''}"></span>
          </button>
        </div>

        <div class="border-t border-slate-100 mt-3 pt-3">
          <button type="button" class="shot-edit" data-focus-id="replay-onboarding" onclick="window.replayClientOnboarding()">Replay client onboarding</button>
          <p class="text-[11px] text-slate-400 mt-1.5">Shows What’s new the way a client sees it. It also appears once when you open View a client.</p>
        </div>
      </div>
    </div>
  </div>`;
}

// Shared by the dossier "Full script" box and the legacy expanded "Script" block. `s.id` is a

function copyScriptButton(s) {

function isDossierStyle(s) {

}

    ${stats.length ? `

      ${stats.map(st => `
      <div>
        <div class="text-2xl font-bold text-blue-600 leading-none">${escHtml(st.num)}</div>
        <div class="text-[10px] uppercase tracking-wide text-slate-400 mt-0.5">${st.label}</div>
      </div>`).join('')}
    </div>` : ''}
    ${s.proof_stats ? `<div class="text-sm text-blue-900 leading-relaxed mt-2">${truncatedField(s.proof_stats, 'proof-' + s.id, 160)}</div>` : ''}
  </div>` : '';

      <div class="mt-3 pt-4 px-3.5 pb-3.5 border-2 border-slate-200 rounded-2xl bg-white shadow-md">

// ─────────────────────────────────────────────
// SHOT CARD — phone-first filming view. Parsers only reorganize text that
// already lives on the row. Every column is also printed, raw, under All fields.
// ─────────────────────────────────────────────
function asText(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); }
}
function clipText(str, n) {
  str = (str || '').trim();
  if (str.length <= n) return str;
  const cut = str.slice(0, n - 1);
  const sp = cut.lastIndexOf(' ');
  return ((sp > 40 ? cut.slice(0, sp) : cut).trim()) + '…';
}
function wordCount(text) {
  const m = String(text || '').trim().match(/\S+/g);
  return m ? m.length : 0;
}
function readLabel(text) {
  const w = wordCount(text);
  if (!w) return '';
  const sec = Math.max(1, Math.round((w / 150) * 60));
  const time = sec < 60 ? sec + ' sec' : Math.round(sec / 60) + ' min';
  return w + ' words · about ' + time;
}

function parseHookPair(hook) {
  const raw = asText(hook).trim();
  if (!raw) return { proven: '', adapted: '', raw: '' };
  const parts = raw.split(/\n(?=ADAPTED\b)/i);
  let proven = '', adapted = '';
  parts.forEach(part => {
    const p = part.trim();
    if (/^ADAPTED\b/i.test(p)) adapted = p.replace(/^ADAPTED\b[^:\n]*:\s*/i, '').trim();
    else if (/PROVEN HOOK/i.test(p)) proven = p.replace(/^[\s\S]*?PROVEN HOOK\b[^:\n]*:\s*/i, '').trim();
  });
  adapted = adapted.replace(/\n?On-screen bold caps:[\s\S]*$/i, '').trim();
  if (!proven && !adapted) return { proven: '', adapted: raw, raw };
  return { proven, adapted, raw };
}

function parseSetup(setup, camera) {
  const text = asText(setup).trim();
  const labeled = (name) => {
    // Labels are often inline ("…pass. LOCATION: Fairmont…"), not only at the start of a line.
    const m = text.match(new RegExp('(?:^|[\\n.]\\s*)' + name + '\\s*:\\s*([^\\n]+)', 'i'));
    return m ? m[1].trim() : '';
  };
  let location = labeled('LOCATION');
  let mic = labeled('MIC TIP') || labeled('MIC');
  let shots = '';
  const sm = text.match(/(?:^|\n)\s*SHOT LIST\s*:\s*([\s\S]*?)(?=\n\s*(?:TIME|MIC|LOCATION|HANDHELD OPTION|FRAMING|PHONE)\b|$)/i);
  if (sm) shots = sm[1].trim();
  let rig = '';
  const rigSentence = text.split(/(?<=\.)\s+|\n/).map(s => s.trim()).find(s => /handheld|tripod|gimbal|\bphone\b/i.test(s));
  if (rigSentence) rig = rigSentence.replace(/\s+/g, ' ').trim();
  if (!mic) {
    const mm = text.match(/[^.!\n]*\b(lav|shotgun|wireless mic|dji mic|clip\/wireless mic|mic)[^.!\n]*[.!]?/i);
    // "desk/mic" inside a FRAMING sentence is the shot, not the microphone.
    if (mm && !/\bframing\s*:/i.test(mm[0])) mic = mm[0].trim();
  }
  const cam = asText(camera).trim();
  let framing = '';
  if (cam && /fram|chest|head-on|vertical|eye|two-shot|close|medium/i.test(cam)) framing = cam;
  if (!framing) {
    const fm = text.match(/[^.!\n]*\b(framing|head-on|chest-up|mid-chest|eye height)[^.!\n]*[.!]?/i);
    if (fm) framing = fm[0].trim();
  }
  return { location, rig, framing, mic, shots, raw: text, camera: cam };
}

function parseShots(raw) {
  raw = (raw || '').trim();
  if (!raw) return [];
  const out = [];
  const re = /(\d+)\)\s*([\s\S]*?)(?=\s*\d+\)|$)/g;
  let m;
  while ((m = re.exec(raw))) {
    const t = m[2].trim().replace(/[.\s]+$/, '');
    if (t) out.push(t);
  }
  if (out.length) return out;
  if (raw.includes('→')) return raw.split(/\s*→\s*/).map(s => s.trim()).filter(Boolean);
  return [raw];
}

function parseOnScreen(notes, hook) {
  const items = [];
  const text = [asText(notes), asText(hook)].filter(Boolean).join('\n');
  const block = text.match(/ON-SCREEN TEXT\s*:\s*([^\n]+)/i);
  if (block) {
    block[1].split(/\s+\/\s+/).forEach(part => {
      const p = part.trim();
      if (!p) return;
      const tm = p.match(/^(\d{1,2}:\d{2})\s+([\s\S]+)$/);
      if (tm) items.push({ t: tm[1], text: tm[2].trim() });
      else items.push({ t: '', text: p });
    });
  }
  const re = /on-screen(?:\s+text)?(?:\s+at)?\s*(\d{1,2}:\d{2})\s*:\s*["“']?([^"\n”']+)/gi;
  let m;
  while ((m = re.exec(text))) {
    const tx = m[2].trim();
    if (!items.some(i => i.t === m[1] && i.text.slice(0, 16) === tx.slice(0, 16))) items.push({ t: m[1], text: tx });
  }
  const lt = text.match(/lower third at\s*(\d{1,2}:\d{2})\s*:\s*([^\n]+)/i);
  if (lt) items.push({ t: lt[1], text: lt[2].trim() });
  const caps = asText(hook).match(/On-screen bold caps:\s*([^\n]+)/i);
  if (caps) items.unshift({ t: '0:00', text: caps[1].trim() });
  const ov = asText(notes).match(/OVERLAYS:\s*([^\n]+)/i);
  if (ov) items.push({ t: '', text: ov[1].trim() });
  return items;
}

function parsePasses(notes) {
  const raw = asText(notes);
  if (!/7-PASS/i.test(raw)) return [];
  const body = raw.split(/7-PASS REVIEW\s*:?/i)[1] || '';
  const out = [];
  const re = /(?:^|\n)\s*(\d+)\s+([^:\n]+):\s*([\s\S]*?)(?=\n\s*\d+\s+[^:\n]+:|$)/g;
  let m;
  while ((m = re.exec(body))) out.push({ n: m[1], name: m[2].trim(), text: m[3].trim() });
  return out;
}

function scriptReadModel(script) {
  const text = asText(script).trim();
  if (!text) return { mode: 'empty', intro: '', questions: [], prose: '' };
  const introM = text.match(/INTRO[^\n]*:\s*([^\n]+)/i);
  let questions = [];
  const qBlock = text.split(/QUESTION SHEET[^\n]*\n/i)[1];
  if (qBlock) {
    const re = /^\s*(\d+)\.\s+(.+)$/gm;
    let m;
    while ((m = re.exec(qBlock))) questions.push({ n: m[1], q: m[2].trim() });
  }
  let rest = '';
  if (questions.length) {
    const lines = text.split('\n');
    let lastQ = -1;
    lines.forEach((line, i) => { if (/^\s*\d+\.\s+/.test(line)) lastQ = i; });
    rest = lastQ >= 0 ? lines.slice(lastQ + 1).join('\n').trim() : '';
    return { mode: 'questions', intro: introM ? introM[1].trim() : '', questions, prose: text, rest };
  }
  return { mode: 'prose', intro: '', questions: [], prose: text, rest: '' };
}

function videoInfo(url) {
  const raw = asText(url).trim();
  if (!raw) return null;
  const found = raw.match(/https?:\/\/[^\s]+/i);
  const s = found ? found[0].replace(/[),.;]+$/, '') : raw;
  let m = s.match(/instagram\.com\/(?:[\w.]+\/)?(reel|p|tv)\/([\w-]+)/i);
  if (m) {
    const kind = m[1].toLowerCase();
    const watch = 'https://www.instagram.com/' + kind + '/' + m[2] + '/';
    return { kind: 'ig', src: watch + 'embed/', watch: watch, label: 'Instagram' };
  }
  m = s.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]+)/i);
  if (m) {
    const watch = /shorts\//i.test(s)
      ? 'https://www.youtube.com/shorts/' + m[1]
      : 'https://www.youtube.com/watch?v=' + m[1];
    return { kind: 'yt', src: 'https://www.youtube.com/embed/' + m[1], thumb: 'https://i.ytimg.com/vi/' + m[1] + '/hqdefault.jpg', watch: watch, label: 'YouTube' };
  }
  m = s.match(/tiktok\.com\/@([\w.]+)\/video\/(\d+)/i);
  if (m) {
    const watch = 'https://www.tiktok.com/@' + m[1] + '/video/' + m[2];
    return { kind: 'tt', src: 'https://www.tiktok.com/embed/v2/' + m[2], watch: watch, label: 'TikTok · @' + m[1] };
  }
  if (/^https?:\/\//i.test(s)) return { kind: 'link', watch: s, label: 'Link' };
  return { kind: 'text', label: raw, watch: '' };
}
// Resolved covers for reference URLs that have no stored thumbnail_url yet.
// Keyed by the canonical watch URL. Empty string means we already tried.
const thumbCache = new Map();
function displayThumb(s, info) {
  if (!info || !info.watch || info.kind === 'text') return '';
  const stored = asText(s && s.thumbnail_url).trim();
  const primary = videoInfo(s && s.reference_clip);
  if (stored && primary && primary.watch === info.watch) return stored;
  if (info.thumb) return info.thumb;
  return thumbCache.get(info.watch) || '';
}
async function resolveRemoteThumb(info) {
  if (!info || !info.watch || info.kind === 'text') return '';
  const oembed = info.kind === 'yt'
    ? 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(info.watch)
    : info.kind === 'tt'
      ? 'https://www.tiktok.com/oembed?url=' + encodeURIComponent(info.watch)
      : info.kind === 'ig'
        ? 'https://www.instagram.com/oembed/?url=' + encodeURIComponent(info.watch)
        : '';
  if (oembed) {
    try {
      const r = await fetch(oembed);
      if (r.ok) {
        const j = await r.json();
        if (j && j.thumbnail_url) return j.thumbnail_url;
      }
    } catch (e) {}
  }
  if (info.kind === 'yt' && info.thumb) return info.thumb;
  try {
    const r = await fetch(info.watch);
    if (r.ok) {
      const html = await r.text();
      const m = html.match(/property=["']og:image["'][^>]*content=["']([^"']+)["']/i)
        || html.match(/content=["']([^"']+)["'][^>]*property=["']og:image["']/i);
      if (m) return m[1].replace(/&amp;/g, '&').replace(/&#38;/g, '&');
    }
  } catch (e) {}
  return '';
}
function applyThumb(watch, url) {
  if (!watch || !url) return;
  document.querySelectorAll('[data-ref]').forEach(el => {
    if (el.getAttribute('data-ref') !== watch) return;
    if (el.tagName === 'IMG') {
      if (!el.getAttribute('src')) el.src = url;
      el.hidden = false;
      const poster = el.closest('.ref-poster');
      if (poster) poster.classList.add('has-frame');
      return;
    }
    const poster = el.closest('.ref-poster');
    if (!poster || poster.querySelector('img.thumb-lg')) return;
    const img = document.createElement('img');
    img.className = 'thumb-lg';
    img.alt = '';
    img.referrerPolicy = 'no-referrer';
    img.setAttribute('data-ref', watch);
    img.setAttribute('data-kind', el.getAttribute('data-kind') || '');
    img.onerror = function () { window.thumbNext(img); };
    img.src = url;
    poster.classList.add('has-frame');
    poster.insertBefore(img, poster.firstChild);
  });
}
function kickThumbResolves() {
  const pending = new Map();
  document.querySelectorAll('[data-ref]').forEach(el => {
    const watch = el.getAttribute('data-ref');
    if (!watch) return;
    if (el.tagName === 'IMG' && el.getAttribute('src')) {
      pending.set(watch, '');
      return;
    }
    if (pending.has(watch)) return;
    pending.set(watch, el.getAttribute('data-kind') || 'link');
  });
  pending.forEach((kind, watch) => {
    if (!kind) return;
    if (thumbCache.has(watch)) {
      const hit = thumbCache.get(watch);
      if (hit) applyThumb(watch, hit);
      return;
    }
    thumbCache.set(watch, '');
    const parsed = videoInfo(watch);
    const info = { kind: kind, watch: watch, thumb: (parsed && parsed.thumb) || '' };
    resolveRemoteThumb(info).then(url => {
      thumbCache.set(watch, url || '');
      if (url) applyThumb(watch, url);
    });
  });
}
window.thumbNext = (img) => {
  if (!img || img.dataset.tried === '1') {
    if (img) {
      img.hidden = true;
      const poster = img.closest('.ref-poster');
      if (poster) poster.classList.remove('has-frame');
    }
    return;
  }
  img.dataset.tried = '1';
  const info = videoInfo(img.getAttribute('data-ref')) || { kind: img.getAttribute('data-kind'), watch: img.getAttribute('data-ref') };
  resolveRemoteThumb(info).then(url => {
    if (url && url !== img.src) {
      thumbCache.set(info.watch, url);
      img.hidden = false;
      img.src = url;
      return;
    }

function shotChecked(id, idx) {
  try { return !!JSON.parse(localStorage.getItem('hub_shots_' + id) || '{}')[idx]; }
  catch (e) { return false; }
}
window.toggleShot = (id, idx, on) => {
  const key = 'hub_shots_' + id;
  let map = {};
  try { map = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { map = {}; }
  map[String(idx)] = !!on;
  try { localStorage.setItem(key, JSON.stringify(map)); } catch (e) {}
  const box = document.querySelector('[data-shot-count="' + id + '"]');
  const section = document.getElementById('shots-' + id);
  if (box && section) {
    let n = 0;
    section.querySelectorAll('input[type="checkbox"]').forEach(el => { if (el.checked) n++; });
    box.textContent = n + ' of ' + section.querySelectorAll('input[type="checkbox"]').length;
  }
};

    return `<section class="area-ref"><div class="eyebrow block-label">Reference</div><p class="shot-intro">No reference video on this script.</p></section>`;

    }

function renderShotActions(s) {
  const needsReview = s.status === 'Needs Review';
  const isPosted = s.status === 'Posted';
  const isPassed = s.status === 'Passed';
  const isArchived = s.status === 'Archived';
  const si = STATUS_ORDER.indexOf(s.status);
  const prev = STATUS_ORDER[si - 1];
  const next = STATUS_ORDER[si + 1];
  const admin = typeof role !== 'undefined' && role === 'admin';
  const statusBtn = (status, label, cls) => {
    if (!status || status === 'Passed') return '<div></div>';
    const brain = admin && humanQaBlocksStatus(s, status);
    const vault = admin && vaultEmptyBlocksStatus(s, status);
    if (brain || vault) {
      const title = brain ? 'Finish the Cristian brain check first' : vaultEmptyTitle();
      const vaultBtn = vault
        ? '<button type="button" class="tool-btn" onclick="window.openFormatVault()">Format Vault</button>'
        : '';
      return `<button type="button" class="${cls} is-blocked" disabled aria-disabled="true" title="${escHtml(title)}">${escHtml(label)}</button>${vaultBtn}`;
    }
    return `<button type="button" class="${cls}" onclick="moveStatus('${s.id}','${status}')">${escHtml(label)}</button>`;
  };
  if (needsReview) {
    const ready = admin
      ? statusBtn('Approved', 'Mark client-ready', 'tool-btn primary')
      : '';
    return `<div class="shot-actions">
      <button type="button" class="shot-go" onclick="moveStatus('${s.id}','Filming')">Film this</button>
      <div class="shot-alt">
        <button type="button" onclick="requestTweak('${s.id}')">Request a tweak</button>
        <button type="button" onclick="moveStatus('${s.id}','Passed')">Pass</button>
        ${ready}

  }
  if (isPosted) return `<div class="shot-actions"><div class="posted-flag">Posted</div></div>`;
  if (isPassed) return `<div class="shot-actions nav-row"><div class="quiet-flag">Passed</div>${statusBtn('Needs Review', 'Restore', 'tool-btn')}</div>`;
  if (isArchived) return `<div class="shot-actions nav-row"><div class="quiet-flag">Archived</div><button type="button" class="tool-btn" onclick="moveStatus('${s.id}','Draft')">Restore</button></div>`;
  return `<div class="shot-actions nav-row">
    ${prev && prev !== 'Passed' ? statusBtn(prev, prev, 'tool-btn') : '<div></div>'}
    ${next && next !== 'Passed' ? statusBtn(next, next, 'tool-btn primary') : '<div></div>'}

}

// ─────────────────────────────────────────────
// TELEPROMPTER — full-screen read of the whole script, in order.
// Hook, each body beat, then the CTA. This is the final script screen a client
// films from. Edit on this screen writes the changed lines back onto the same
// script row (hook, full_script, cta). Lives outside #app so a dashboard
// redraw does not close it. Type size, speed, and mirror stick on this device.
// ─────────────────────────────────────────────
function normSpoken(value) {
  return asText(value).toLowerCase().replace(/[“”"']/g, '').replace(/\s+/g, ' ').trim();
}
function spokenHook(s) {
  const pair = parseHookPair(s && s.hook);
  let text = (pair.adapted || pair.raw || '').trim();
  text = text.replace(/\n?On-screen bold caps:[\s\S]*$/i, '').trim();
  text = text.replace(/^[\s\S]*?PROVEN HOOK\b[^:\n]*:\s*/i, '').trim();
  return text;
}
function parseBeats(script) {
  const text = asText(script).trim();
  if (!text) return [];
  const re = /(?:^|\n)\s*\[([^\]]+)\]\s*([\s\S]*?)(?=\n\s*\[|$)/g;
  const beats = [];
  let m;
  while ((m = re.exec(text))) {
    const tag = m[1].trim();
    const body = m[2].trim();
    if (!body) continue;
    const timeMatch = tag.match(/\d{1,2}:\d{2}/);
    beats.push({ clip: /^clip\b/i.test(tag), time: timeMatch ? timeMatch[0] : '', text: body });
  }
  if (beats.length) return beats;

      </span>
      <select onchange="window.setPipelineStat(this.value)" aria-label="Pipeline stat"
        class="absolute inset-0 w-full h-full opacity-0 text-base" style="font-size:16px">
        ${PIPELINE_STAT_OPTIONS.map(o => `<option value="${o.v}" ${o.v === effectiveStat ? 'selected' : ''}>${o.label}</option>`).join('')}
      </select>
    </div>` : '';

  const summaryCard = `
  <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
    <div class="flex items-center mb-1">
      <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">Progress</div>
      ${statPicker}
    </div>
    <div class="flex items-baseline gap-2 mb-3">
      <div class="text-2xl font-bold ${statOpt.color}">${headlineNumber}</div>
      <div class="text-base font-semibold text-slate-400">${headlineSuffix}</div>
    </div>
    <div class="h-3 flex gap-[2px] rounded-full overflow-hidden ${nonZeroStages.length ? '' : 'bg-slate-100'}">
      ${barSegments}
    </div>
    <div class="flex justify-between text-[10px] uppercase tracking-wide text-slate-400 mt-1.5">
      <span>Draft</span><span>Posted</span>
    </div>
  </div>`;

  // Stage rows — zero-count stage renders as a <div>, not a <button>, so there's no dead-end
  // tap target to an empty list.
  const stageRows = PIPELINE_STAGES.map(stage => {
    const stageGroups = bucket[stage];
    const count = stageGroups.length;
    const dot = STATUS_DOT[stage];

    if (count === 0) {
      return `
      <div class="w-full flex gap-3 pl-3 pr-4 py-3.5 opacity-50">
        <div class="w-1 self-stretch rounded-full ${dot}"></div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">${pill(stage, STATUS_STYLE[stage])}<span class="text-base font-bold text-slate-300 tabular-nums">0</span></div>
          </div>
          <div class="text-[13px] text-slate-400 mt-1">None right now</div>
        </div>
      </div>`;
    }

    const onCalendar = stageGroups.filter(g => groupDate(g)).length;
    const calHint = onCalendar === 0 ? `<span class="text-slate-300">None on calendar yet</span>`
      : onCalendar === count ? `All ${count} on calendar`
      : `${onCalendar} of ${count} on calendar`;

    const titles = stageGroups.slice(0, 3)
      .map(g => `<div class="text-[13px] leading-5 text-slate-500 truncate">${escHtml(g[0].title)}</div>`)
      .join('');
    const more = count > 3 ? `<span>+${count - 3} more</span>` : '<span></span>';

    // jumpToList forces viewMode='all' first so the count tapped here matches what's then
    // shown in List -- otherwise a client/admin looking at the 'testing' mode could tap
    // "12 Draft" and land on a filtered List that only shows 3 of them. `stage` is always one
    // of the fixed STATUS_ORDER strings, never free text, so this interpolation is safe.
    return `
    <button onclick="window.jumpToList('${stage}')" class="w-full text-left flex gap-3 pl-3 pr-4 py-3.5 active:bg-slate-50">
      <div class="w-1 self-stretch rounded-full ${dot}"></div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">${pill(stage, STATUS_STYLE[stage])}<span class="text-base font-bold text-slate-800 tabular-nums">${count}</span></div>
          <span class="text-slate-300">›</span>
        </div>
        <div class="mt-1 space-y-0.5">${titles}</div>
        <div class="flex items-center justify-between mt-1 text-[11px] text-slate-400">
          <span>${more}</span>
          <span>${calHint}</span>
        </div>
      </div>
    </button>`;
  }).join('');

  const stagesCard = `<div class="bg-white rounded-2xl border border-slate-100 overflow-hidden divide-y divide-slate-100">${stageRows}</div>`;

  // Passed row -- dashed border ("set aside"), still tappable, no title previews.
  const passedRow = passedBucket.length ? `
  <button onclick="window.jumpToList('Passed')"
    class="w-full text-left flex items-center justify-between rounded-2xl border border-dashed border-slate-200 px-4 py-3.5">
    <span class="text-sm text-slate-500">✕ ${passedBucket.length} passed</span>
    <span class="text-slate-300">›</span>
  </button>` : '';

  // Archived footer -- admin only, only rendered if something is actually archived.
  const archivedTotal = groupIntoTakes(scripts.filter(s => s.client_slug === viewSlug))
    .filter(g => groupStatus(g) === 'Archived').length;
  const archivedFooter = (isAdmin && archivedTotal > 0)
    ? `<div class="text-center text-[11px] text-slate-300">📦 ${archivedTotal} archived (not shown)</div>`
    : '';

  return [summaryCard, stagesCard, passedRow, archivedFooter].filter(Boolean).join('');
}

// ─────────────────────────────────────────────
// CALENDAR VIEW — month grid keyed off date_planned (the planned POSTING date, not filming
// -- see Q2). Posted items stay visible on the calendar; Passed items are excluded entirely
// (not being made, so nothing to schedule). The unscheduled list sits ABOVE the day panel
// on purpose: the day panel reuses the real dossier card (renderCardGroup), which can run
// 1500px+ tall, so burying unscheduled work below it would make it effectively invisible.
// ─────────────────────────────────────────────
const WEEKDAY_LETTERS = ['S','M','T','W','T','F','S'];
// Full 3-letter weekday names -- shared by calFormatDayLabel() and renderNext7Strip(), which
// each used to define their own identical ['Sun','Mon',...] array inline. WEEKDAY_LETTERS above
// is a genuinely different thing (single-letter column headers for the month grid), not a dup.
const WEEKDAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function calFormatShort(dateStr) {
  const [yy, mm, dd] = dateStr.split('-').map(Number);
  return `${MONTH_NAMES[mm - 1].slice(0, 3)} ${dd}`;
}
function calFormatDayLabel(dateStr) {
  // Built from decomposed numeric parts via local new Date(y,m,d) -- NOT new Date(dateStr).
  // See the CRITICAL CORRECTNESS note on ymd() above for why that distinction matters.
  const [yy, mm, dd] = dateStr.split('-').map(Number);
  const d = new Date(yy, mm - 1, dd);
  return `${WEEKDAY_NAMES[d.getDay()]}, ${MONTH_NAMES[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
}

// ─────────────────────────────────────────────
// NEXT-7-DAYS STRIP (Item 4) — the actual answer to "these are the scripts for THIS week."
// Rolling window (today + next 6), not a Sun-Sat calendar week -- see rollingWeekRange(). Each
// day card is a single <button> (no nested buttons/inputs) that calls
// window.selectCalDayFromStrip(), which moves the month grid to the tapped day's month (it can
// differ from whatever month the grid currently has open) and then delegates to the same
// window.selectCalDay() the month grid already uses, so tapping a strip card opens the day
// panel below exactly like tapping a grid day does.
//
// activeNonPassedGroups/todayStr/weekRange are computed ONCE by the caller (renderCalendar())
// and passed in, rather than this function re-deriving the same groups/"today"/date-range work
// a second time within the same render.
// ─────────────────────────────────────────────
function renderNext7Strip(activeNonPassedGroups, todayStr, weekRange) {
  const isAdmin = role === 'admin';
  const { start, end } = weekRange;
  const inRange = groupsInRange(activeNonPassedGroups, start, end);

  const [ty, tm, td] = todayStr.split('-').map(Number);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(ty, tm - 1, td + i);
    const dateStr = ymd(d.getFullYear(), d.getMonth(), d.getDate());
    const dayGroups = inRange.filter(g => groupDate(g) === dateStr);
    days.push({ dateStr, dayNum: d.getDate(), weekday: WEEKDAY_NAMES[d.getDay()], dayGroups, isToday: i === 0 });
  }

  const totalCount = inRange.length;

  if (totalCount === 0) {
    return `
    <div class="rounded-2xl border border-dashed border-slate-200 px-5 py-6 text-center">
      <div class="text-sm text-slate-500">Nothing planned in the next 7 days.</div>
      ${isAdmin ? `<div class="text-xs text-slate-400 mt-1">Set a date on a script below to fill this in.</div>` : ''}
    </div>`;
  }

  // "Oct 21–27" when both ends fall in the same month, "Oct 28–Nov 3" across a boundary.
  const [sMon, sDay] = calFormatShort(start).split(' ');
  const [eMon, eDay] = calFormatShort(end).split(' ');
  const rangeStr = sMon === eMon ? `${sMon} ${sDay}–${eDay}` : `${calFormatShort(start)}–${calFormatShort(end)}`;

  const dayCards = days.map(day => {
    const dayLabel = day.isToday ? 'Today' : `${day.weekday} ${day.dayNum}`;

    if (!day.dayGroups.length) {
      return `
      <button onclick="window.selectCalDayFromStrip('${day.dateStr}')"
        class="flex-none snap-start w-[42%] rounded-xl border border-dashed border-slate-200 px-3 py-3 text-left">
        <div class="text-xs font-semibold ${day.isToday ? 'text-blue-600' : 'text-slate-500'} mb-2">${dayLabel}</div>
        <div class="text-xs text-slate-300 text-center py-4">Nothing planned</div>
      </button>`;
    }

    const shown = day.dayGroups.slice(0, 2);
    const more = day.dayGroups.length - shown.length;
    const rows = shown.map(g => {
      const st = groupStatus(g);
      return `
      <div class="flex items-center gap-1.5 mb-1 min-w-0">
        <span class="text-[9px] font-semibold px-1.5 py-0.5 rounded-full flex-shrink-0 ${STATUS_STYLE[st]}">${st}</span>
        <span class="text-[11px] text-slate-600 truncate">${escHtml(g[0].title)}</span>
      </div>`;
    }).join('');

    return `
    <button onclick="window.selectCalDayFromStrip('${day.dateStr}')"
      class="flex-none snap-start w-[42%] rounded-xl border ${day.isToday ? 'border-blue-200 bg-blue-50/40' : 'border-slate-100 bg-white'} px-3 py-3 text-left shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <div class="text-xs font-semibold ${day.isToday ? 'text-blue-600' : 'text-slate-500'}">${dayLabel}</div>
        <div class="text-[10px] text-slate-400">${day.dayGroups.length}</div>
      </div>
      ${rows}
      ${more > 0 ? `<div class="text-[10px] text-slate-400 mt-0.5">+${more} more</div>` : ''}
    </button>`;
  }).join('');

  return `
  <div>
    <div class="flex items-center justify-between px-0.5 mb-2">
      <div class="text-sm font-bold text-slate-800">Next 7 days</div>
      <div class="text-xs text-slate-400">${totalCount} script${totalCount === 1 ? '' : 's'} · ${rangeStr}</div>
    </div>
    <div class="relative">
      <div id="next7-strip" class="flex gap-2 overflow-x-auto snap-x snap-mandatory no-scrollbar pb-1">
        ${dayCards}
      </div>
      <div class="pointer-events-none absolute right-0 top-0 bottom-1 w-10 bg-gradient-to-l from-slate-50 to-transparent"></div>
    </div>
  </div>`;
}

function renderCalendar() {
  const isAdmin = role === 'admin';

  if (!calMonth) {
    const now = new Date();
    calMonth = { y: now.getFullYear(), m: now.getMonth() };
  }

  const allActiveGroups = activeGroupsFor(viewSlug);
  if (!allActiveGroups.length) {
    return `<div class="text-center py-16 px-6"><div class="text-3xl mb-3">🗓️</div><div class="text-sm font-semibold text-slate-600 mb-1">No scripts here.</div></div>`;
  }

  // Computed ONCE here and reused below for both the grid's "this week" tint AND passed down
  // into renderNext7Strip() (instead of each independently calling rollingWeekRange()) --
  // guarantees the two agree on the exact same window, and does the date-range work once
  // instead of twice in the same render pass.
  const weekRange = rollingWeekRange();

  // Passed = not being made -- excluded from the schedule, not just dimmed.
  const calendarGroups = allActiveGroups.filter(g => groupStatus(g) !== 'Passed');

  const byDay = {};
  const unscheduled = [];
  calendarGroups.forEach(g => {
    const d = groupDate(g);
    if (d) (byDay[d] || (byDay[d] = [])).push(g);
    else unscheduled.push(g);
  });

  const now = new Date();
  const todayStr = ymd(now.getFullYear(), now.getMonth(), now.getDate());
  const { y, m } = calMonth;
  const isCurrentMonth = y === now.getFullYear() && m === now.getMonth();

  // Measure the real sticky header height so the day panel's scroll-margin-top accounts for
  // it -- a plain scrollIntoView would otherwise hide the panel's own title behind the header.
  const stickyEl = document.querySelector('.sticky');
  const scrollMarginStyle = `scroll-margin-top:${(stickyEl ? stickyEl.offsetHeight : 120) + 12}px`;

  // Grid cells -- ALWAYS 42 (6 weeks) for stable height across months. new Date(y, m, dayNum)
  // with dayNum < 1 or > daysInMonth rolls over correctly in JS and is built from local parts
  // (never a parsed string), so this is safe under the CRITICAL CORRECTNESS rule above.
  const startWeekday = new Date(y, m, 1).getDay();
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const cellDate = new Date(y, m, i - startWeekday + 1);
    const dateStr = ymd(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
    const inMonth = cellDate.getMonth() === m && cellDate.getFullYear() === y;
    cells.push({ dateStr, dayNum: cellDate.getDate(), inMonth });
  }

  const cellsHtml = cells.map(c => {
    const dayGroups = byDay[c.dateStr] || [];
    const dots = dayGroups.map(g => groupStatus(g)).sort((a, b) => STATUS_ORDER.indexOf(a) - STATUS_ORDER.indexOf(b));
    const shown = dots.slice(0, 3);
    const overflow = dots.length - shown.length;
    const isSelected = calSelectedDay === c.dateStr;
    const isToday = c.dateStr === todayStr;

    const numClasses = isSelected ? 'bg-slate-800 text-white font-semibold'
      : isToday ? 'ring-1 ring-inset ring-slate-300 text-slate-800 font-bold'
      : !c.inMonth ? 'text-slate-300'
      : dayGroups.length ? 'text-slate-800 font-semibold'
      : 'text-slate-500 font-normal';

    // Item 4 -- tie the grid visually to the Next-7-days strip above: cells that fall inside
    // the same rolling window get a subtle tint. Today/selected already have their own
    // stronger treatment on the number circle, so they take priority (no tint underneath).
    // Polish -- bg-slate-50 was nearly invisible against the card's white background; bumped
    // one step darker to bg-slate-100, still subtle but actually perceptible.
    const inRollingWindow = c.dateStr >= weekRange.start && c.dateStr <= weekRange.end;
    const cellBg = (!isSelected && !isToday && inRollingWindow) ? 'bg-slate-100' : '';

    return `
    <button onclick="window.selectCalDay('${c.dateStr}')" aria-pressed="${isSelected}"
      aria-label="${calFormatDayLabel(c.dateStr)}${isToday ? ' (today)' : ''}, ${dayGroups.length ? `${dayGroups.length} script${dayGroups.length === 1 ? '' : 's'}` : 'nothing planned'}"
      class="h-12 flex flex-col items-center pt-1 gap-1 rounded-xl active:bg-slate-100 ${cellBg}">
      <span class="w-7 h-7 rounded-full flex items-center justify-center text-[13px] tabular-nums ${numClasses}">${c.dayNum}</span>
      <div class="flex items-center gap-0.5 ${c.inMonth ? '' : 'opacity-40'}">
        ${shown.map(st => `<span class="w-1.5 h-1.5 rounded-full ${STATUS_DOT[st]}"></span>`).join('')}
        ${overflow > 0 ? `<span class="text-[10px] font-semibold text-slate-400">+${overflow}</span>` : ''}
      </div>
    </button>`;
  }).join('');

  // Item 5 -- "?" legend trigger sits with the month arrows. All three are 44px.
  // The trigger only renders when "Always show color key" is off; when that setting
  // is on, the legend stays at the bottom of the card (legendBottom) and this trigger is skipped.
  const legendTrigger = !settingAlwaysShowKey ? `
    <button onclick="window.toggleCalShowKey()" aria-label="Show color key" aria-expanded="${calShowKey}"
      class="w-11 h-11 rounded-full flex items-center justify-center text-slate-400 active:bg-slate-100">
      <span class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-[11px] font-semibold">?</span>
    </button>` : '';

  // Polish -- at ~320px-wide screens (iPhone SE), the month title + "Today" button + nav arrows
  // can get tight. whitespace-nowrap stops the title from wrapping onto two lines; .month-short
  // (defined in <style> above, only active below 360px) swaps in a 3-letter month abbreviation
  // for just that narrowest band so there's room to breathe without affecting any wider phone.
  const monthBar = `
  <div class="flex items-center justify-between px-4 pt-4 pb-2">
    <div class="flex items-center gap-2 min-w-0">
      <div class="text-sm font-bold text-slate-800 whitespace-nowrap">
        <span class="month-full">${MONTH_NAMES[m]} ${y}</span>
        <span class="month-short">${MONTH_NAMES[m].slice(0, 3)} ${y}</span>
      </div>
      ${!isCurrentMonth ? `<button onclick="window.calGoToday()" class="text-xs font-semibold text-blue-600 whitespace-nowrap">Today</button>` : ''}
    </div>
    <div class="flex items-center gap-1 flex-shrink-0">
      ${legendTrigger}
      <button onclick="window.calShiftMonth(-1)" aria-label="Previous month" class="w-11 h-11 rounded-full flex items-center justify-center text-slate-400 active:bg-slate-100">‹</button>
      <button onclick="window.calShiftMonth(1)" aria-label="Next month" class="w-11 h-11 rounded-full flex items-center justify-center text-slate-400 active:bg-slate-100">›</button>
    </div>
  </div>`;

  const weekdayHeader = `
  <div class="grid grid-cols-7 px-2">
    ${WEEKDAY_LETTERS.map(l => `<div class="h-7 flex items-center justify-center text-[11px] font-semibold text-slate-400 uppercase">${l}</div>`).join('')}
  </div>`;

  // Item 5 -- the legend body itself is unchanged markup either way; what changes is WHERE it
  // renders. Inline (under the month bar, only while calShowKey is toggled on) adds one extra
  // line tying the dot order back to STATUS_ORDER. Bottom-of-card (the original placement,
  // used when "Always show color key" is on) stays exactly as it rendered before this round.
  const legendBody = `
  <div class="flex flex-wrap gap-x-3 gap-y-1.5 px-4 py-2.5 border-t border-slate-50">
    ${PIPELINE_STAGES.map(st => `<div class="flex items-center gap-1.5 text-[11px] text-slate-500"><span class="w-2 h-2 rounded-full ${STATUS_DOT[st]}"></span>${st}</div>`).join('')}
  </div>`;
  const legendExtraLine = `<div class="px-4 pb-2.5 -mt-1 text-[10px] text-slate-400 italic">Dots are always ordered Draft → Posted.</div>`;
  const legendInline = (!settingAlwaysShowKey && calShowKey) ? `${legendBody}${legendExtraLine}` : '';
  const legendBottom = settingAlwaysShowKey ? legendBody : '';

  const calendarCard = `
  <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
    ${monthBar}
    ${legendInline}
    ${weekdayHeader}
    <div class="grid grid-cols-7 gap-y-0.5 px-2 pb-2">${cellsHtml}</div>
    ${legendBottom}
  </div>`;

  // Unscheduled -- collapsed bar, expands to compact rows. Admin rows get a native date
  // input overlaid as a visible chip (a bare empty <input type=date> is nearly invisible on
  // iOS Safari); it's a SEPARATE sibling from the row's own <button>, never nested inside it
  // (nesting an input in a button is invalid HTML and causes double-tap bugs). Non-admin, or
  // an admin tapping outside the chip, jumps straight to the filtered List.
  const unscheduledSection = unscheduled.length ? `
  <div class="mt-3 bg-white rounded-2xl border border-slate-100 overflow-hidden">
    <button onclick="window.toggleUnscheduled()" aria-expanded="${calShowUnscheduled}" class="w-full flex items-center justify-between px-4 py-3 text-left active:bg-slate-50">
      <span class="text-sm text-slate-600">📌 <b>${unscheduled.length}</b> not scheduled yet</span>
      <span class="text-slate-300">${calShowUnscheduled ? '▾' : '▸'}</span>
    </button>
    ${calShowUnscheduled ? `
    <ul class="divide-y divide-slate-100 border-t border-slate-100">
      ${unscheduled.map(g => {
        const s = g[0];
        const st = groupStatus(g);
        const groupKey = takeGroupKey(s);
        const takeChip = g.length > 1 ? `<span class="text-[10px] font-semibold bg-violet-100 text-violet-600 px-2 py-0.5 rounded-full flex-shrink-0">${g.length} takes</span>` : '';
        // jumpToList forces viewMode='all', same reasoning as the Pipeline jump above --
        // Calendar/Pipeline both operate over ALL groups regardless of testing/all mode, so
        // landing on a 'testing'-filtered List could hide the very item that was just tapped.
        // `st` is always a groupStatus() return value (a fixed STATUS_ORDER/'Archived' string,
        // never free text), so this interpolation is safe.
        return `
        <li class="flex items-center gap-2 px-4 py-3">
          <button onclick="window.jumpToList('${st}')" class="flex-1 min-w-0 text-left flex items-center gap-2">
            <span class="flex-1 min-w-0 truncate text-sm text-slate-700">${escHtml(s.title)}</span>
            ${s.reel_number ? `<span class="text-xs text-slate-300 flex-shrink-0">#${s.reel_number}</span>` : ''}
            ${pill(st, STATUS_STYLE[st])}
            ${takeChip}
          </button>
          ${isAdmin
            ? `<label class="relative min-h-11 px-3 inline-flex items-center rounded-full bg-blue-50 border border-blue-100 text-xs font-medium text-blue-600 flex-shrink-0">
                 📅 Set date
                 <input type="date" data-group-key="${escHtml(groupKey)}" class="absolute inset-0 w-full h-full opacity-0 text-base"
                   onclick="this.showPicker && this.showPicker()"
                   onchange="window.setGroupDate(this.dataset.groupKey, this.value || null)">
               </label>`
            : `<span class="text-slate-300 flex-shrink-0">›</span>`}
        </li>`;
      }).join('')}
    </ul>` : ''}
  </div>` : '';

  // Selected-day panel OR the empty-month state -- the two are mutually exclusive, the
  // empty state replaces (doesn't stack under) the day-panel slot.
  const monthHasAnyDated = Object.keys(byDay).some(d => {
    const [dy, dm] = d.split('-').map(Number);
    return dy === y && (dm - 1) === m;
  });

  let dayPanelSlot = '';
  if (calSelectedDay) {
    const dayGroups = byDay[calSelectedDay] || [];
    dayPanelSlot = `
    <section id="day-panel" class="mt-5" style="${scrollMarginStyle}">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-bold text-slate-800">${calFormatDayLabel(calSelectedDay)}</div>
        <div class="text-xs text-slate-400">${dayGroups.length} script${dayGroups.length === 1 ? '' : 's'}</div>
      </div>
      <div class="space-y-3">
        ${dayGroups.length
          ? dayGroups.map(renderCardGroup).join('')
          : `<div class="rounded-2xl border border-dashed border-slate-200 px-5 py-8 text-center"><div class="text-sm text-slate-500">Nothing planned for this day.</div></div>`}
      </div>
    </section>`;
  } else if (!monthHasAnyDated) {
    const allDated = Object.keys(byDay).sort();
    const future = allDated.filter(d => d >= todayStr);
    const nextPlanned = future.length ? future[0] : (allDated.length ? allDated[allDated.length - 1] : null);
    // F5 -- name the shown MONTH specifically, rather than a bare "nothing on the calendar yet"
    // -- the Next-7-days strip above can legitimately have items while the currently-shown grid
    // month has none (e.g. strip spans a month boundary), and a generic "nothing on the
    // calendar" reads as a direct contradiction of a strip sitting right above it with items in
    // it. Naming the month makes clear this is about THIS month, not the whole calendar.
    const copy = isAdmin
      ? { l1: `Nothing planned in ${MONTH_NAMES[m]}`, l2: 'Set a date on any script above to place it here.' }
      : { l1: `Nothing planned in ${MONTH_NAMES[m]}`, l2: "Filming dates will show up here once they're set." };
    dayPanelSlot = `
    <section id="day-panel" class="mt-5" style="${scrollMarginStyle}">

        <div class="text-sm text-slate-500">${copy.l1}<br>${copy.l2}</div>

      </div>

  }

  // grid / unscheduled / day-panel stack, untouched below this point. (Later addition: the
  // past-due banner below goes ABOVE the strip, and only renders when something has actually
  // slipped -- overdue work is more urgent than upcoming work, and when nothing is overdue the
  // Item 7 order is exactly as before.) calendarGroups/todayStr/
  // weekRange are the same values already computed above for the grid itself -- passed down
  // instead of letting renderNext7Strip() recompute them.
  const next7Section = `<div class="mb-3">${renderNext7Strip(calendarGroups, todayStr, weekRange)}</div><div class="border-t border-slate-200 mb-3"></div>`;

  // Past-due banner -- scripts whose planned posting date already went by without being posted.
  // Neither the Next-7-days strip (starts at today) nor the month grid (just a dot on an old
  // day) surfaces these, yet "what slipped?" is the first question on a content calendar.
  // Tapping jumps to the OLDEST one's day (same calJumpToDate() path as "Next planned"), so
  // re-dating or posting each one and tapping again walks through them oldest-first.
  const pastDueDates = calendarGroups.filter(g => isPastDue(g, todayStr)).map(groupDate).sort();

async function submitRequest() {
  if (requestSending) return;
  const bodyEl = document.getElementById('request-body');
  const handlesEl = document.getElementById('request-handles');
  if (bodyEl) requestDraft.body = bodyEl.value;
  if (handlesEl) requestDraft.handles = handlesEl.value;
  const kind = requestDraft.kind;
  const body = (requestDraft.body || '').trim();
  const handles = (requestDraft.handles || '').trim();
  if (kind === 'competitor') {
    if (!handles && !body) {
      showToast('Add an Instagram handle or a short note.', { tone: 'error' });
      return;
    }
  } else if (!body) {
    showToast('Add a few words so we know what you need.', { tone: 'error' });
    return;
  }
  const slug = role === 'client' ? mySlug : (mySlug || viewSlug);
  if (role === 'client' && !slug) {
    showToast('This account is not linked to a client yet.', { tone: 'error' });
    return;
  }
  const payload = {
    user_id: user && user.id,
    client_slug: slug || null,
    kind,
    body: body || handles,
    handles: handles || null,
    status: 'new',
  };
  if (previewMode || (user && user.id === 'preview-user')) {
    requests.unshift(Object.assign({ id: 'local-' + Date.now(), created_at: new Date().toISOString() }, payload));
    requestDraft = { kind: 'feature', body: '', handles: '' };
    requestsLoaded = true;
    requestsError = '';
    renderDash();
    showToast('Request saved.');
    return;
  }
  requestSending = true;
  renderDash();
  let data = null, error = null;
  try {
    ({ data, error } = await sb.from('client_requests').insert(payload).select('*'));
  } catch (e) { error = e; }
  requestSending = false;
  if (error || !data || !data.length) {
    if (error) {
      requestsError = error.message || String(error);
      console.error(error);
    }
    showToast(error ? 'Could not send that. Open Requests to see why.' : SESSION_EXPIRED_MSG, { tone: 'error' });
    renderDash();
    return;
  }
  requestsError = '';
  requests.unshift(data[0]);
  requestDraft = { kind: 'feature', body: '', handles: '' };
  requestsLoaded = true;
  renderDash();
  showToast('Request sent.');
}

  if (!s || !humanQaDeliveryReady(s)) return;
  const qa = humanQaFrom(s) || {};
  let stamp = buildHumanQaStamp(qa.checks, qa.notes, qa.by || editorLabel(user), qa.at || new Date().toISOString(), qa.formats);
  stamp.complete = true;
  stamp = attachHumanQaFilm(stamp, phase === 'end' ? 'end' : 'start', humanQaScriptHash(s));
  const toast = phase === 'end'
    ? 'End check saved. This film read is finished.'
    : 'Start check saved. Read the script, then sign again when you finish.';
  await persistHumanQaStamp(s, stamp, toast);
};
// (No `window.requestTweak = (id) => requestTweak(id)` alias here -- there used to be one, and it
// broke the Tweak button outright: a top-level `function requestTweak` in a classic script
// already IS window.requestTweak, so that assignment replaced the real function with an arrow
// whose `requestTweak(id)` call resolved back to... itself. Infinite recursion -> RangeError on
// every Tweak tap, prompt never shown. Top-level function declarations need no window alias.)
window.doLogout    = () => { unsubscribeLiveChanges(); sb.auth.signOut(); };

// Item 1 -- Filters pill (List, admin only). Persisted.
window.toggleFiltersOpen = () => { filtersOpen = !filtersOpen; lsSetBool('hub_filters_open', filtersOpen); renderDash(); };

// Item 2 -- settings popover. Open/close are transient; the two settings inside it persist
// individually (see their setters below). Neither setter closes the panel -- the owner should
// be able to see the effect of a change (e.g. the "Currently: ..." line, or the calendar
// reacting to the color-key toggle) without it snapping shut.
//
// K3 -- dialog focus management: opening moves focus to the first focusable element inside the
// panel (the ✕ close button, which is first in DOM order); closing (by ANY method -- the gear
// button toggling it shut, the backdrop, Escape, or the ✕ itself) returns focus to the gear
// button. Both are one requestAnimationFrame after renderDash() rebuilds the DOM, same timing
// scrollToDayPanel()/restoreFocusAfterRedraw() already rely on.
window.toggleSettings     = () => {
  const opening = !settingsOpen;
  settingsOpen = opening;
  if (opening) moreOpen = false;
  renderDash();
  requestAnimationFrame(() => {
    const el = document.querySelector(`[data-focus-id="${opening ? 'settings-close' : 'settings-gear'}"]`);
    if (el) el.focus();
  });
};
window.closeSettings      = () => {
  settingsOpen = false;
  renderDash();
  requestAnimationFrame(() => {
    const el = document.querySelector('[data-focus-id="settings-gear"]');
    if (el) el.focus();
  });
};
// K1 -- focus capture now happens generically at the top of renderDashInner() itself (see the
// comment there), so these two setters just change the setting and redraw like any other action.
window.setOpenOnSignIn    = v  => { settingOpenOnSignIn = v; lsSetStr('hub_setting_open_on_signin', v); renderDash(); };
window.toggleAlwaysShowKey = () => { settingAlwaysShowKey = !settingAlwaysShowKey; lsSetBool('hub_setting_show_key', settingAlwaysShowKey); renderDash(); };

// Item 5 -- inline "?" legend expand/collapse (Calendar). Transient, not persisted -- separate
// from the persisted "Always show color key" SETTING above.
window.toggleCalShowKey = () => { calShowKey = !calShowKey; renderDash(); };

// Item 6 -- Pipeline's stat picker. Persisted.
window.setPipelineStat = v => { pipelineStat = v; lsSetStr('hub_pipeline_stat', v); renderDash(); };

// Single jump-in helper for every "tap a count in Pipeline/Calendar -> land in List" path
// (Pipeline stage rows, the Passed row, unscheduled Calendar rows) -- replaces copy-pasted
// inline onclick strings. viewStatusExact=true makes List's own filter match groupStatus()
// exactly (same bucketing Pipeline/Calendar just used), instead of List's native per-take
// `.some()` filter, so the count just tapped matches what List then shows (F1/F2). Also
// resets scroll to the top of the page (F3) since landing mid-page was disorienting.
window.jumpToList = (status) => {
  viewMode = 'all';
  viewTab = 'list';
  viewStatus = status;
  viewStatusExact = true;
  calSelectedDay = null;
  listSearch = ''; // a leftover search would make List show fewer than the count just tapped
  moreOpen = false;
  resetScriptNav();
  renderDash();
  window.scrollTo(0, 0);
};

// Calendar navigation / selection -- all plain state writes + renderDash(), see the
// calMonth/calSelectedDay/calShowUnscheduled comment at their declaration for why these
// live as module-level `let`s instead of DOM state.
window.calGoToday      = () => {
  const now = new Date();
  calMonth = { y: now.getFullYear(), m: now.getMonth() };
  calSelectedDay = null; // clear -- a day selected in the month just left shouldn't linger
  renderDash();
};
window.calShiftMonth   = delta => {
  let { y, m } = calMonth;
  m += delta;
  if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
  calMonth = { y, m };
  // Clear the selected day on month nav -- otherwise the day panel keeps showing a date from
  // the month you just left, AND incorrectly suppresses the "nothing planned this month" empty
  // state (which only renders when no day is selected).
  calSelectedDay = null;
  renderDash();
};
window.selectCalDay    = d => {
  const selecting = calSelectedDay !== d; // toggle: re-tapping the same day deselects it
  calSelectedDay = selecting ? d : null;
  if (selecting) calScrollPending = true; // only scroll when a day is actually being opened
  renderDash();
};
// F1 -- the Next-7-days strip can show a day belonging to a DIFFERENT month than whatever the
// grid currently has open (e.g. grid showing December, but today is Oct 28 so the strip has a
// card for Nov 1) -- tapping it must move the grid to that month too (same thing
// calJumpToDate() already does), or the day panel opens while the grid still shows the wrong
// month with nothing marked selected. Delegates to selectCalDay() for the actual
// select/toggle/scroll behavior so re-tapping the same strip card still deselects it.
window.selectCalDayFromStrip = d => {
  const [yy, mm] = d.split('-').map(Number);
  calMonth = { y: yy, m: mm - 1 };
  window.selectCalDay(d);
};
window.toggleUnscheduled = () => { calShowUnscheduled = !calShowUnscheduled; renderDash(); };
window.calJumpToDate   = dateStr => {
  const [yy, mm] = dateStr.split('-').map(Number);
  calMonth = { y: yy, m: mm - 1 };
  calSelectedDay = dateStr;
  calScrollPending = true; // jumping straight to a specific date should scroll to its panel
  renderDash();
};

// Admin-only: writes date_planned to every take in a group at once (Q3 -- a multi-take
// group shares one posting date). ymdOrNull is either a 'YYYY-MM-DD' string straight from a
// native <input type=date>'s .value, or null to clear the date. Gated behind role==='admin'
// at the UI layer only (the date-input chips are only rendered for admins) -- same caveat as
// every other write in this app: Supabase RLS on `scripts` doesn't itself separate clients,
// so this is a UI convenience, not a hard security boundary (pre-existing, out of scope here).
window.setGroupDate = async (groupKey, ymdOrNull) => {
  try {
    const rows = scripts.filter(s => takeGroupKey(s) === groupKey);
    if (!rows.length) return;
    // Reject a malformed/partial value (desktop date-input footgun) instead of writing it --
    // null is still a legitimate "clear the date" request and always allowed through.
    if (ymdOrNull && !isValidPlannedDate(ymdOrNull)) {
      console.warn('setGroupDate: ignoring invalid date value', ymdOrNull);
      return;
    }
    const payload = { date_planned: ymdOrNull || null };
    const ids = rows.map(s => s.id);
    // .select('id') asks Supabase to hand back the rows it actually matched -- a token refresh
    // failure (session expired while the PWA was left open) can make .update().in() match ZERO
    // rows and still resolve with no error, which would otherwise look identical to a real
    // success and optimistically patch local state with a date that was never saved.
    const { data, error } = await sb.from('scripts').update(payload).in('id', ids).select('id');
    // Failures toast instead of renderError() (see showToast()) -- and still redraw, because
    // the native date input has already visibly changed to the picked value; redrawing from
    // the unchanged `scripts` snaps the chip back to what's actually saved.
    if (error || !data || data.length !== ids.length) {
      if (error) console.error(error);
      showToast(error ? `Couldn't save the date: ${error.message}` : SESSION_EXPIRED_MSG, { tone: 'error' });
      renderDash();
      return;
    }
    rows.forEach(s => Object.assign(s, payload));
    renderDash();
  } catch (e) {
    console.error(e);
    showToast(`Couldn't save the date: ${e && e.message || e}`, { tone: 'error' });
    renderDash();
  }
};

// Flips the DOM in place (no full redraw -- no scroll jump for a purely local change) and records
// the result in expandedSections so the next full redraw keeps it. `btn` (the toggle button
// itself, passed as `this`) gets its aria-expanded kept in sync for screen readers.
window.toggle = (id, btn) => {
  const el = document.getElementById(`exp-${id}`);
  const ch = document.getElementById(`chev-${id}`);
  if (!el) return;
  el.classList.toggle('hidden');
  const open = !el.classList.contains('hidden');
  if (open) expandedSections.add(id); else expandedSections.delete(id);
  if (ch) ch.textContent = open ? '▾' : '▸';
  if (btn) btn.setAttribute('aria-expanded', String(open));
};

function escHtml(str) {
  // Defensive: a field value that isn't a plain string (e.g. a list/object from a jsonb
  // column) must never crash the whole render. One bad field should degrade gracefully
  // (shown as its JSON form) instead of taking down every card on the page -- this exact
  // failure mode happened for real (Day 26's "overlays" field was a list, not a string).
  if (str == null) return '';
  if (typeof str !== 'string') { try { str = JSON.stringify(str); } catch (e) { str = String(str); } }
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    // Every attribute in this file is double-quoted today, so this is defense-in-depth: it makes
    // escHtml() safe for a single-quoted attribute too, so a future edit can't quietly reopen
    // the XSS-PRE hole by changing quote style. (Note: it does NOT make a value safe inside a
    // JS string in an inline handler -- the browser decodes entities before running it; keep
    // using data-* attributes for that, as the date/take/sous-chef buttons already do.)
    .replace(/'/g,'&#39;');
}

// Local screenshot/dev hook only. Never active on GitHub Pages.
// Renders an in-memory script list without touching auth, RLS, or the network.
if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
  window.__preview = (rows, opts) => {
    opts = opts || {};
    window.__previewLock = true;
    previewMode = true;
    scripts = rows || [];
    user = opts.user || { id: 'preview-user', email: 'preview@localhost' };
    role = opts.role || 'admin';
    if (role !== 'admin') {
      scripts.forEach(row => {
        if (!row) return;
        delete row.pipeline_audit;
        delete row.admin_audit;
      });
    }
    mySlug = opts.mySlug || null;
    previewSlug = opts.previewing ? (opts.viewSlug || null) : null;
    viewAsOpen = !!opts.viewAsOpen;
    if (opts.viewSlug && !opts.previewing) viewSlug = opts.viewSlug;
    else if (previewSlug) viewSlug = previewSlug;
    else viewSlug = homeSlug(mySlug);
    viewStatus = opts.viewStatus || 'all';
    viewType = opts.viewType || 'all';
    viewMode = opts.viewMode || 'all';
    viewTab = opts.viewTab || 'list';
    viewSegment = opts.viewSegment || defaultSegmentForClient(viewSlug);
    adminLane = opts.adminLane || (role === 'admin' ? 'review' : 'batches');
    filtersOpen = opts.filtersOpen !== false && role === 'admin';
    settingsOpen = false;
    listSearch = '';
    hubPage = opts.hubPage || 'main';
    formatVaultFilter = opts.formatVaultFilter || ((opts.previewing && (opts.viewSlug === 'jan' || opts.viewSlug === 'devin')) ? opts.viewSlug : 'all');
    previousOpen = !!opts.previousOpen;
    requests = opts.requests || [];
    requestsLoaded = true;
    requestsError = opts.requestsError || '';
    requestSending = false;
    requestFilter = opts.requestFilter || 'all';
    requestDraft = { kind: opts.kind || 'feature', body: '', handles: '' };
    moreOpen = !!opts.moreOpen;
    scriptEdits = opts.edits || [];
    editsLoaded = true;
    editsError = opts.editsError || '';
    editFilter = opts.editFilter || 'all';
    clearEdit();
    clearPrep();
    hideToast();
    resetScriptNav();
    openedIds = new Set(opts.openedIds || []);
    modalPinned = opts.autoModal === false || !!opts.modal;
    modal = opts.modal || null;
    modalFocusPending = false;
    renderDash();
  };
  const previewClient = new URLSearchParams(location.search).get('preview');
  if (previewClient) {
    fetch('preview-fixtures.json').then(r => r.ok ? r.json() : null).then(rows => {
      if (rows) window.__preview(rows, { role: 'admin', viewSlug: previewClient === '1' ? 'cristian' : previewClient, viewStatus: 'all', filtersOpen: false });
    }).catch(() => {});
  }
}

// ─────────────────────────────────────────────
// GO
// ─────────────────────────────────────────────
init();
</script>
