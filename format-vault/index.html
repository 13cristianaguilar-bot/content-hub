<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Format Vault">
<title>Format Vault · Talk to Ops</title>
<style>
  :root {
    --bg: #0a0b0d;
    --bg2: #12141a;
    --bg3: #1a1d26;
    --line: #2a2f3d;
    --text: #e8eaef;
    --muted: #8b93a7;
    --dim: #5c6478;
    --accent: #c8a96e;
    --accent2: #e4c48a;
    --danger: #e85d5d;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --tap: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    min-height: 100%; min-height: 100dvh;
  }
  body {
    display: flex; flex-direction: column;
    padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto;
  }
  button, textarea { touch-action: manipulation; font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  a { color: var(--accent2); text-decoration: none; }

  header { text-align: center; margin-bottom: 8px; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px;
  }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: .01em; }
  .hint { margin-top: 8px; font-size: 14px; color: var(--muted); line-height: 1.45; }

  .stage {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 12px 0 8px; min-height: 280px;
  }

  .mic-wrap { position: relative; width: 168px; height: 168px; }
  .mic-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(200,169,110,.25);
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .mic-btn {
    position: absolute; inset: 18px; border-radius: 50%;
    background: linear-gradient(160deg, #2a2418 0%, #14120e 55%, #0e0d0a 100%);
    border: 2px solid #4a3d24;
    box-shadow: 0 12px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(228,196,138,.15);
    display: grid; place-items: center;
    font-size: 56px; line-height: 1;
    user-select: none; -webkit-user-select: none;
    transition: transform .12s, border-color .12s, background .12s;
  }
  .mic-btn:active { transform: scale(.96); }
  .mic-wrap.live .mic-ring {
    border-color: rgba(232,93,93,.65);
    box-shadow: 0 0 0 10px rgba(232,93,93,.08);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .mic-wrap.live .mic-btn {
    background: linear-gradient(160deg, #3a1a1a, #1a0e0e);
    border-color: rgba(232,93,93,.7);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: .85; }
  }

  .status {
    font-size: 14px; font-weight: 700; color: var(--accent2); min-height: 22px; text-align: center;
  }
  .status.warn { color: #f0b0b0; }
  .status.ok { color: #a8e6c8; }

  .audio-pill {
    display: none; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; color: var(--muted);
    background: var(--bg2); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px;
  }
  .audio-pill.show { display: inline-flex; }
  .audio-pill .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }

  .result {
    display: none; flex-direction: column; gap: 10px; width: 100%;
  }
  .result.show { display: flex; }
  .result label {
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
  }
  textarea {
    width: 100%; min-height: 140px; resize: vertical;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 16px;
    color: var(--text); padding: 14px 16px; font-size: 16px; line-height: 1.45;
  }
  textarea:focus { outline: none; border-color: #4a3d24; }
  textarea::placeholder { color: var(--dim); }

  .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 4px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--tap); padding: 14px 18px; border-radius: 16px;
    font-size: 16px; font-weight: 800; width: 100%;
  }
  .btn-primary {
    background: linear-gradient(135deg, #c8a96e, #a8884a); color: #1a1408;
    box-shadow: 0 8px 24px rgba(200,169,110,.22);
  }
  .btn-primary:active { filter: brightness(.96); }
  .btn-primary:disabled { opacity: .45; filter: none; }
  .btn-ghost {
    background: var(--bg3); border: 1px solid var(--line); color: var(--text); font-weight: 700;
  }

  footer {
    margin-top: auto; padding-top: 20px; text-align: center;
  }
  footer details { color: var(--dim); font-size: 12px; }
  footer summary {
    cursor: pointer; list-style: none; min-height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--dim); font-weight: 600;
  }
  footer summary::-webkit-details-marker { display: none; }
  footer a { display: inline-block; margin-top: 6px; font-size: 13px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(16px); opacity: 0;
    background: #232733; border: 1px solid var(--line); color: var(--text);
    padding: 12px 18px; border-radius: 999px; font-size: 13px; font-weight: 700;
    z-index: 40; pointer-events: none; transition: .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Signal Marketing</div>
  <h1>Format Vault · Talk to Ops</h1>
  <p class="hint">Tap the mic, say the change, then Send to Ops. That’s the whole app.</p>
</header>

<section class="stage" aria-label="Voice capture">
  <div class="mic-wrap" id="micWrap">
    <div class="mic-ring" aria-hidden="true"></div>
    <button type="button" class="mic-btn" id="micBtn" aria-label="Hold or tap to talk" aria-pressed="false">🎙</button>
  </div>
  <div class="status" id="status">Tap mic to talk</div>
  <div class="audio-pill" id="audioPill"><span class="dot"></span><span id="audioLabel">Audio note ready</span></div>
</section>

<section class="result" id="result" aria-live="polite">
  <label for="transcript">Transcript (edit if needed)</label>
  <textarea id="transcript" placeholder="Your words land here…" autocomplete="off"></textarea>
  <div class="actions">
    <button type="button" class="btn btn-primary" id="sendBtn" disabled>Send to Ops</button>
    <button type="button" class="btn btn-ghost" id="copyBtn" disabled>Copy for Ops</button>
    <button type="button" class="btn btn-ghost" id="resetBtn">Record again</button>
  </div>
</section>

<footer>
  <details>
    <summary>More</summary>
    <a href="./old.html">Open old vault</a>
  </details>
</footer>

<div class="toast" id="toast">Copied</div>

<script>
(function () {
  const micBtn = document.getElementById("micBtn");
  const micWrap = document.getElementById("micWrap");
  const statusEl = document.getElementById("status");
  const result = document.getElementById("result");
  const transcript = document.getElementById("transcript");
  const sendBtn = document.getElementById("sendBtn");
  const copyBtn = document.getElementById("copyBtn");
  const resetBtn = document.getElementById("resetBtn");
  const audioPill = document.getElementById("audioPill");
  const audioLabel = document.getElementById("audioLabel");
  const toastEl = document.getElementById("toast");

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canSpeech = !!SR;
  const canMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

  let recog = null;
  let mediaStream = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let audioBlob = null;
  let audioFile = null;
  let listening = false;
  let holdMode = false;
  let holdTimer = null;
  let speechBase = "";

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function syncActions() {
    const has = !!transcript.value.trim() || !!audioBlob;
    sendBtn.disabled = !has;
    copyBtn.disabled = !transcript.value.trim();
    if (has) result.classList.add("show");
  }

  function buildOpsText() {
    const t = transcript.value.trim() || "(voice note — no transcript)";
    return "Format Vault voice\n" + t;
  }

  async function copyText(msg) {
    try {
      await navigator.clipboard.writeText(msg);
      toast("Copied for Ops");
      return true;
    } catch {
      const ta = document.createElement("textarea");
      ta.value = msg;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        toast("Copied for Ops");
        return true;
      } catch {
        toast("Copy failed — select text");
        return false;
      } finally {
        ta.remove();
      }
    }
  }

  function pickMime() {
    const types = [
      "audio/mp4",
      "audio/aac",
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/ogg;codecs=opus"
    ];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
    for (const t of types) {
      if (MediaRecorder.isTypeSupported(t)) return t;
    }
    return "";
  }

  function stopTracks() {
    if (mediaStream) {
      mediaStream.getTracks().forEach((tr) => tr.stop());
      mediaStream = null;
    }
  }

  function stopSpeech() {
    try { recog && recog.stop(); } catch (_) {}
  }

  function stopRecorder() {
    return new Promise((resolve) => {
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        resolve();
        return;
      }
      mediaRecorder.onstop = () => resolve();
      try { mediaRecorder.stop(); } catch (_) { resolve(); }
    });
  }

  async function startCapture() {
    if (listening) return;
    listening = true;
    holdMode = false;
    audioChunks = [];
    audioBlob = null;
    audioFile = null;
    audioPill.classList.remove("show");
    micWrap.classList.add("live");
    micBtn.setAttribute("aria-pressed", "true");
    result.classList.add("show");
    setStatus("Listening… tap mic to stop");

    speechBase = transcript.value;
    if (speechBase && !/\s$/.test(speechBase)) speechBase += " ";

    // MediaRecorder audio (preferred when available)
    if (canMedia) {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = pickMime();
        mediaRecorder = mime
          ? new MediaRecorder(mediaStream, { mimeType: mime })
          : new MediaRecorder(mediaStream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          if (!audioChunks.length) return;
          const type = mediaRecorder.mimeType || "audio/mp4";
          audioBlob = new Blob(audioChunks, { type });
          const ext = type.includes("webm") ? "webm" : type.includes("ogg") ? "ogg" : "m4a";
          audioFile = new File([audioBlob], "format-vault-voice." + ext, { type });
          const sec = Math.max(1, Math.round(audioBlob.size / 12000));
          audioLabel.textContent = "Audio note ready (~" + sec + "s)";
          audioPill.classList.add("show");
          syncActions();
        };
        mediaRecorder.start();
      } catch (err) {
        mediaStream = null;
        mediaRecorder = null;
        if (!canSpeech) {
          setStatus("Mic blocked — type below", "warn");
          listening = false;
          micWrap.classList.remove("live");
          micBtn.setAttribute("aria-pressed", "false");
          return;
        }
      }
    }

    // Live transcript when Web Speech exists (Safari often has webkit*)
    if (canSpeech) {
      try {
        if (!recog) {
          recog = new SR();
          recog.lang = "en-US";
          recog.interimResults = true;
          recog.continuous = true;
          recog.onresult = (ev) => {
            let interim = "";
            let finalPart = "";
            for (let i = ev.resultIndex; i < ev.results.length; i++) {
              const t = ev.results[i][0].transcript;
              if (ev.results[i].isFinal) finalPart += t;
              else interim += t;
            }
            if (finalPart) {
              speechBase += finalPart + " ";
              transcript.value = speechBase;
              syncActions();
            } else {
              transcript.value = speechBase + interim;
              syncActions();
            }
          };
          recog.onerror = () => {
            // keep MediaRecorder going; just note speech failed
            if (listening && !mediaRecorder) {
              setStatus("Speech unavailable — keep holding, or type", "warn");
            }
          };
          recog.onend = () => {
            if (listening && canSpeech) {
              try { recog.start(); } catch (_) {}
            }
          };
        }
        recog.start();
      } catch (_) {
        if (!mediaRecorder) setStatus("Mic unavailable — type below", "warn");
      }
    } else if (!mediaRecorder) {
      setStatus("Type your note, then Send to Ops", "warn");
      listening = false;
      micWrap.classList.remove("live");
      micBtn.setAttribute("aria-pressed", "false");
    }

    syncActions();
  }

  async function stopCapture() {
    if (!listening) return;
    listening = false;
    micWrap.classList.remove("live");
    micBtn.setAttribute("aria-pressed", "false");
    stopSpeech();
    await stopRecorder();
    stopTracks();
    mediaRecorder = null;
    if (transcript.value.trim() || audioBlob) {
      setStatus(audioBlob ? "Ready — Send to Ops" : "Edit transcript, then Send", "ok");
    } else {
      setStatus("Nothing captured — tap mic again", "warn");
    }
    syncActions();
  }

  async function toggleMic() {
    if (listening) await stopCapture();
    else await startCapture();
  }

  // Tap toggle + press-and-hold
  micBtn.addEventListener("click", (e) => {
    if (holdMode) { holdMode = false; return; }
    e.preventDefault();
    toggleMic();
  });

  micBtn.addEventListener("pointerdown", (e) => {
    if (e.button != null && e.button !== 0) return;
    holdTimer = setTimeout(async () => {
      holdMode = true;
      if (!listening) await startCapture();
      setStatus("Holding… release to stop");
    }, 280);
  });

  async function endHold() {
    clearTimeout(holdTimer);
    holdTimer = null;
    if (holdMode && listening) {
      await stopCapture();
      holdMode = false;
    }
  }
  micBtn.addEventListener("pointerup", endHold);
  micBtn.addEventListener("pointercancel", endHold);
  micBtn.addEventListener("pointerleave", () => {
    if (holdMode) endHold();
    else clearTimeout(holdTimer);
  });

  transcript.addEventListener("input", syncActions);

  copyBtn.addEventListener("click", async () => {
    await copyText(buildOpsText());
  });

  sendBtn.addEventListener("click", async () => {
    const text = buildOpsText();
    if (navigator.share) {
      try {
        const data = { title: "Format Vault voice", text };
        if (audioFile && navigator.canShare) {
          const withFile = { title: data.title, text, files: [audioFile] };
          if (navigator.canShare(withFile)) {
            await navigator.share(withFile);
            toast("Shared to Ops");
            return;
          }
        }
        await navigator.share(data);
        toast("Shared to Ops");
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    await copyText(text);
  });

  resetBtn.addEventListener("click", async () => {
    await stopCapture();
    transcript.value = "";
    audioBlob = null;
    audioFile = null;
    audioChunks = [];
    audioPill.classList.remove("show");
    result.classList.remove("show");
    setStatus("Tap mic to talk");
    syncActions();
  });

  // Boot hint
  if (!canSpeech && !canMedia) {
    setStatus("Mic not supported here — type below", "warn");
    result.classList.add("show");
  } else if (!canSpeech && canMedia) {
    setStatus("Tap mic — audio note (type transcript if needed)");
  }
})();
</script>
</body>
</html>
