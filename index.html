  <!-- iOS PWA — add to homescreen feels native, no browser chrome -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    pre { font-family: inherit; }
    /* Prevent 300ms tap delay on all interactive elements */
    button, a, input, select { touch-action: manipulation; }
    @keyframes pulse-ring {
      0%, 100% { opacity: 1; box-shadow: 0 0 22px rgba(34,197,94,0.55), 0 0 44px rgba(34,197,94,0.25); }
      50%       { opacity: 0.85; box-shadow: 0 0 36px rgba(34,197,94,0.8), 0 0 72px rgba(34,197,94,0.4); }
    }
    .new-scripts-glow { animation: pulse-ring 2s ease-in-out infinite; }
    /* Safe area inset for iPhone notch / home bar. Horizontal insets too, so a
       landscape notch doesn't sit on the toast. No Tailwind padding utilities here:
       the CDN stylesheet loads after this block and would override them. */
    .safe-bottom {
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    }
    /* Calendar month bar (Polish) -- only the narrowest phones (<360px, e.g. iPhone SE) swap
       the full month name for a 3-letter abbreviation to keep the title + Today button + nav
       arrows from crowding each other. Everything 360px and up keeps the full name. */
    .month-short { display: none; }
    @media (max-width: 359px) {
      .month-short { display: inline; }
      .month-full  { display: none; }
    }
  </style>
</head>

<style>
@font-face {

  font-weight: 100 900;

function dossierBlock(emoji, label, text, color, opts) {
  if (!text) return '';

    ref:  { bg: 'bg-blue-50',   border: 'border-blue-100',   label: 'text-blue-600',   text: 'text-blue-900' },

    edit: { bg: 'bg-pink-50',   border: 'border-pink-100',   label: 'text-pink-600',   text: 'text-pink-900' },
  }[color];
  const emphasis = opts.emphasize ? 'border-2 px-4 py-3.5' : 'px-3.5 py-3';
  const textSize = opts.emphasize ? 'text-base' : 'text-sm';
  const body = opts.truncateId
    ? truncatedField(text, opts.truncateId, opts.maxLen)
    : `<div class="whitespace-pre-wrap">${escHtml(text)}</div>`;

    <div class="${textSize} ${colors.text} leading-relaxed">${body}</div>

}

// Pulls real "12,936 likes" / "5.4M views" style numbers out of the free-text proof_stats field
// so they can render as big stat tiles like the dossier does -- the field itself stays the full
// verified narrative (resolution notes, what was checked, what was rejected and why), this just
// surfaces the headline numbers from inside it instead of asking Cristian to re-enter them as
// separate structured data.
function extractProofStats(text) {
  if (!text) return [];
  const re = /([\d][\d,]*\.?\d*\s?[KMB]?)\s+(views|likes|comments)\b/gi;
  const seen = {};
  let m;
  while ((m = re.exec(text))) {
    const label = m[2].toLowerCase();
    if (!seen[label]) seen[label] = m[1].trim();
  }
  return ['views', 'likes', 'comments'].filter(l => seen[l]).map(l => ({ num: seen[l], label: l[0].toUpperCase() + l.slice(1) }));
}

// The YouTube source clip (what Jan actually films his reaction to) was getting buried inside
// the long proof/verification paragraph -- this pulls it out so it can render as its own
// clickable, prominent link instead of plain text in a wall of text.
function extractVideoLink(text) {
  if (!text) return null;
  const m = text.match(/https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=[\w-]+|youtu\.be\/[\w-]+)[^\s)"'”]*/i);
  return m ? m[0].replace(/[.,;:]+$/, '') : null;
}

// Long verification/setup paragraphs (the full "what was checked, what was rejected and why"
// narrative) were making cards feel like a wall of text and visually burying the hook/script/
// tonality hero below them. Collapsed to a short preview by default with a "Show full notes"
// toggle -- nothing is deleted or hidden permanently, it's one tap away.
function truncatedField(text, id, maxLen) {
  maxLen = maxLen || 200;
  if (!text) return '';
  if (text.length <= maxLen) return `<div class="whitespace-pre-wrap">${escHtml(text)}</div>`;
  const cut = text.slice(0, maxLen);
  const preview = cut.slice(0, cut.lastIndexOf(' ')) || cut;
  const open = expandedSections.has(`txt:${id}`);
  return `
    <div id="prev-${id}" class="${open ? 'hidden' : ''}">
      <div class="whitespace-pre-wrap">${escHtml(preview)}…</div>
      <button onclick="toggleText('${id}')" class="text-xs font-bold underline mt-1.5 opacity-75">Show full notes ▾</button>
    </div>
    <div id="full-${id}" class="${open ? '' : 'hidden'}">
      <div class="whitespace-pre-wrap">${escHtml(text)}</div>
      <button onclick="toggleText('${id}')" class="text-xs font-bold underline mt-1.5 opacity-75">Show less ▴</button>
    </div>`;
}
// Flips the DOM directly (no full redraw -- that would cost a scroll jump for a purely local
// change) AND records the new state in expandedSections, so the next full redraw rebuilds it in
// the same open/closed state instead of snapping it shut. See expandedSections' declaration.
window.toggleText = id => {
  const key = `txt:${id}`;
  if (expandedSections.has(key)) expandedSections.delete(key); else expandedSections.add(key);
  document.getElementById(`prev-${id}`).classList.toggle('hidden');
  document.getElementById(`full-${id}`).classList.toggle('hidden');
};

// localStorage helpers — tiny try/catch wrappers so a browser with storage disabled (private
// mode edge cases, some in-app webviews) degrades to "use the default" instead of throwing and
// taking the whole render down with it.
// ─────────────────────────────────────────────
function lsGetStr(key, fallback)  { try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; } }
function lsSetStr(key, val)       { try { localStorage.setItem(key, val); } catch (e) {} }

// Refinement round -- new UI-only state. Same rule as viewTab/calMonth/calSelectedDay above:
// anything that drives what's on screen must live in a module-level `let`, consumed fresh on
// every renderDashInner() call, because a realtime Supabase update can trigger a full redraw
// at any moment and a value that only lived in the DOM (a toggled class, a hidden attribute)
// would be silently wiped out by that redraw.
// K1 -- a settings change (radio pick, switch flip) triggers a full renderDash() redraw, which
// tears down and rebuilds the whole #app subtree -- without this, a keyboard user tabbing/
// arrow-keying through the settings panel loses focus (lands on <body>) after every single
// selection. Each focusable control in the panel carries a stable `data-focus-id`; capture the
// id of whichever one is focused right before the redraw, then look it up again by that id and
// refocus it once the new DOM exists. captureFocusForRedraw() runs generically at the top of
// renderDashInner() itself (not just from the two settings setters below) so focus also
// survives a realtime update arriving while the panel is open -- it's a no-op for every other
// redraw path, since nothing outside the settings panel/gear button carries a `data-focus-id`
// except the List search box (which wants exactly this same "keep my focus" treatment).
let pendingFocusId = null;
function captureFocusForRedraw() {
  const el = document.activeElement;
  pendingFocusId = (el && el.dataset && el.dataset.focusId) ? el.dataset.focusId : null;
}

  if (!pendingFocusId) return;
  const id = pendingFocusId;
  pendingFocusId = null;
  requestAnimationFrame(() => {
    const el = document.querySelector(`[data-focus-id="${id}"]`);
    if (!el) return;
    el.focus();
    // A rebuilt text input gets focus with the caret at the START on some browsers -- put it
    // back at the end so the next keystroke appends instead of prepending (List search box).
    if (el.type === 'search') { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
  });
}

// Escape closes the settings popover (Item 2); Tab/Shift+Tab traps focus inside it while open
// (K2). Registered once at script load, not inside renderDashInner() -- the whole #app subtree
// gets replaced on every render, but a listener attached to `document` itself survives that
// fine, so this must only ever run once (adding it inside the render function would stack a
// new listener on every redraw).
document.addEventListener('keydown', (e) => {
  if (document.getElementById('edit-sheet') && e.key === 'Escape') {
    e.preventDefault();
    window.closeEdit();
    return;
  }
  if (document.getElementById('prep') && e.key === 'Escape') {
    e.preventDefault();
    window.closePrep();
    return;
  }
  if (document.getElementById('prompter')) {
    if (e.key === 'Escape') {
      e.preventDefault();
      if (prompterState && prompterState.player) { window.prompterClosePlayer(); return; }
      if (prompterState && prompterState.notes) { window.prompterNotes(false); return; }
      window.closePrompter();
      return;
    }
    const tag = e.target && e.target.tagName;
    if (e.key === ' ' && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
      if (prompterState && (prompterState.notes || prompterState.player)) return;
      e.preventDefault(); window.prompterToggle(); return;
    }
  }
  // K3 -- routed through window.closeSettings() (not a bare `settingsOpen = false; renderDash()`)
  // so Escape returns focus to the gear button the same way the backdrop tap and ✕ button do.
  if (e.key === 'Escape' && modal) {
    e.preventDefault();
    if (modal === 'whats-new') window.dismissWhatsNew();
    else window.dismissNewScripts();
    return;
  }
  if (e.key === 'Escape' && moreOpen) { window.toggleMore(false); return; }
  if (e.key === 'Escape' && settingsOpen) { window.closeSettings(); return; }
  if (e.key === 'Tab' && document.getElementById('hub-modal')) {
    const panel = document.querySelector('#hub-modal .modal-card');
    if (panel) {
      const focusables = Array.from(panel.querySelectorAll('button, a, input, select, textarea'));
      if (focusables.length) {
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
  }

  // K2 -- real focus trap for the settings panel. It declares aria-modal="true"/role="dialog",
  // so Tab must actually be unable to walk out of it into the rest of the page (and Shift+Tab
  // from the first control must wrap to the last, not land on the invisible full-screen
  // backdrop button that sits earlier in DOM order). The panel only ever has a handful of
  // `data-focus-id` controls, so a full roving-tabindex library would be overkill here --
  // wrapping Tab/Shift+Tab at the first/last of them is the whole trap.
  if (e.key === 'Tab' && settingsOpen) {
    const panel = document.getElementById('settings-panel');
    if (!panel) return;
    const focusables = Array.from(panel.querySelectorAll('[data-focus-id]'));
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  }
});

// Client-facing "how this works" guide. Persisted per-browser via localStorage so it doesn't
// nag on every visit once dismissed, but stays one tap away via the "?" button in the header.
// Admins (Cristian) never see this -- it's onboarding for CLIENTS, not for him.
// Opening a shot card clears its New badge without a full redraw, so the
// page does not jump. Stored per user, not per browser profile alone.
document.addEventListener('click', (e) => {
  const art = e.target && e.target.closest && e.target.closest('article.shot');
  if (!art) return;
  const ids = (art.getAttribute('data-script-ids') || '').split(',').map(s => s.trim()).filter(Boolean);
  let changed = false;
  ids.forEach(id => { if (!openedIds.has(id)) { openedIds.add(id); changed = true; } });
  if (!changed) return;
  persistOpened();
  art.querySelectorAll('.new-badge').forEach(n => n.remove());
  document.querySelectorAll('.script-nav-btn').forEach(btn => {
    const mine = (btn.getAttribute('data-script-ids') || '').split(',').map(s => s.trim());
    if (mine.some(id => ids.indexOf(id) !== -1)) btn.querySelectorAll('.new-badge').forEach(n => n.remove());
  });
});

let swipeGesture = null;
document.addEventListener('touchstart', (e) => {
  if (!e.touches || e.touches.length !== 1) { swipeGesture = null; return; }
  const zone = e.target.closest && e.target.closest('[data-swipe-scope]');
  if (!zone) { swipeGesture = null; return; }
  if (e.target.closest('button, a, input, textarea, select, label, .pr-progress, .pr-controls, .pr-sheet, .pr-player, .script-pager')) {
    swipeGesture = null;
    return;
  }

  if (scope === 'prompter' && prompterState && (prompterState.notes || prompterState.player)) return;

}, { passive: true });

function helpDismissed() { try { return localStorage.getItem('hub_help_dismissed') === '1'; } catch (e) { return false; } }
let showHelp = !helpDismissed();
window.toggleHelp = () => { showHelp = !showHelp; if (!showHelp) { try { localStorage.setItem('hub_help_dismissed', '1'); } catch (e) {} } renderDash(); };

// ─────────────────────────────────────────────
// ERROR STATE — a real, visible failure with a way out, instead of the page silently
// sticking on "Loading..." forever. This is the exact failure mode the Day 26 jsonb-field
// bug caused for every user, every session, at once -- this doesn't prevent a bad field from
// existing, it makes sure the NEXT unexpected error is recoverable instead of invisible.
// ─────────────────────────────────────────────
function renderError(e) {
  console.error(e);
  document.getElementById('app').innerHTML = `
    <div class="flex flex-col items-center justify-center min-h-screen px-5 text-center">
      <div class="text-3xl mb-3">⚠️</div>
      <div class="font-semibold text-slate-700 mb-1">Something went wrong loading this page.</div>
      <div class="text-xs text-slate-400 mb-4 max-w-xs break-words">${escHtml(e && e.message || String(e))}</div>
      <button onclick="location.reload()" class="bg-slate-800 text-white rounded-xl px-5 py-2.5 text-sm font-medium">Reload</button>
    </div>`;
}

// ─────────────────────────────────────────────
// TOAST — the non-destructive counterpart to renderError(). renderError() is right for "the
// page itself can't load", but it was also being used for a single failed WRITE (one status tap,
// one date pick), which threw away the whole screen -- the user's place in the list, their open
// day panel, everything -- over one retryable action. A failed write now leaves the screen
// exactly as it was and says what happened down here instead. Also carries the "Undo" action
// after a status change. One toast at a time; a new one replaces the old.
// ─────────────────────────────────────────────
let toastTimer = null;
let toastActionFn = null;
function showToast(message, opts) {
  opts = opts || {};
  const root = document.getElementById('toast-root');
  if (!root) return;
  clearTimeout(toastTimer);
  toastActionFn = opts.onAction || null;
  const isError = opts.tone === 'error';
  root.innerHTML = `
    <div class="pointer-events-auto mb-4 w-full max-w-md ${isError ? 'bg-red-600' : 'bg-slate-800'} text-white text-sm rounded-xl shadow-lg pl-4 pr-2 py-2 flex items-center gap-2">
      <div class="flex-1 min-w-0 py-1.5 leading-snug">${escHtml(message)}</div>
      ${toastActionFn ? `<button onclick="window.toastAction()" class="flex-shrink-0 px-3 py-1.5 rounded-lg font-semibold underline underline-offset-2 hover:bg-white/10">${escHtml(opts.actionLabel || 'Undo')}</button>` : ''}
      <button onclick="window.hideToast()" aria-label="Dismiss" class="flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center opacity-70 hover:opacity-100 hover:bg-white/10">✕</button>
    </div>`;
  toastTimer = setTimeout(hideToast, opts.duration || (isError ? 9000 : 6000));
}
function hideToast() {
  clearTimeout(toastTimer);
  toastActionFn = null;
  const root = document.getElementById('toast-root');
  if (root) root.innerHTML = '';
}
// Clears the toast BEFORE running the action so a slow action (e.g. an Undo write) can't be
// double-fired by a second tap on a still-visible button.
window.toastAction = () => { const fn = toastActionFn; hideToast(); if (fn) fn(); };

// Shared copy for the "the write call succeeded but matched zero rows" case -- see the comment
// in setGroupDate() for why an expired session produces exactly that, with no error.
const SESSION_EXPIRED_MSG = "That didn't save — your session may have expired. Sign out and back in, then try again.";

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (window.__previewLock) return;
    if (session && passwordRecoveryPending) renderSetNewPassword();
    else if (session) await afterLogin(session.user);
    else { passwordRecoveryPending = false; renderLogin(); } // expired/invalid reset link -> plain login

    sb.auth.onAuthStateChange(async (event, session) => {
      if (window.__previewLock) return;
      try {
        // Belt-and-braces with the URL check at the top of the script (PKCE-style links carry
        // no `type=recovery` in the URL, only this event).
        if (event === 'PASSWORD_RECOVERY') passwordRecoveryPending = true;
        if (session && passwordRecoveryPending) {
          // Hold on the set-new-password screen -- don't let INITIAL_SESSION/SIGNED_IN/
          // USER_UPDATED drop the user into the dashboard before they've actually set it.
          // Only render it if it isn't already up, so a stray event can't wipe a half-typed form.
          if (!document.getElementById('npw')) renderSetNewPassword();
          return;
        }
        if (session) await afterLogin(session.user);
        else {
          user = null; role = null; mySlug = null;
          passwordRecoveryPending = false;
          // Reset admin-only calendar state so it can't leak into the next person who signs in
          // on this same tab/device (the app never reloads on auth change -- these are plain
          // module-level `let`s that would otherwise survive across sessions).
          calSelectedDay = null; calShowUnscheduled = false; viewStatusExact = false;
          settingsOpen = false; calShowKey = false;
          listSearch = ''; expandedSections.clear();
          hubPage = 'main'; modal = null; modalPinned = false; previousOpen = false; moreOpen = false;
          openedIds = new Set(); freshScriptIds = new Set(); previewMode = false;
          viewSlug = null; previewSlug = null; viewAsOpen = false;
          navIndex = 0; previousIndex = 0; flatIndex = 0;
          navSets = { fresh: [], previous: [], flat: [] };
          requests = []; requestsLoaded = false; requestsError = '';
          scriptEdits = []; editsLoaded = false; editsError = ''; editFilter = 'all';
          document.body.classList.remove('modal-open', 'more-open', 'edit-open');
          // A pending "Undo" belongs to the session that just ended -- it must not be tappable
          // (and fail, or worse, act under the next person's session) after sign-out.
          hideToast();
          if (window.closeEdit) window.closeEdit(true);
          if (window.closePrep) window.closePrep(true);
          if (window.closePrompter) window.closePrompter();
          unsubscribeLiveChanges(); renderLogin();
        }
      } catch (e) { renderError(e); }
    });
  } catch (e) { renderError(e); }
}

async function afterLogin(u) {
  if (window.__previewLock) return;
  // C1 -- Supabase's JS client re-fires `SIGNED_IN` (and `TOKEN_REFRESHED`/`INITIAL_SESSION`)
  // whenever a backgrounded tab/app regains focus, not just on an actual new login (its
  // _onVisibilityChanged -> _recoverAndRefresh path). Capture whether this is really a NEW
  // person signing in BEFORE overwriting `user` below -- everything that resets or restores
  // VIEW state (selected day, shown month, status filter, remembered tab/client) must be
  // gated on this, or just switching back to the app from another app would silently wipe
  // out whatever the user was looking at.
  const isNewSignIn = !user || user.id !== u.id;

  user   = u;
  authLinkError = null;
  // Read from app_metadata, not user_metadata -- app_metadata is the only one RLS actually
  // trusts (a signed-in user can edit their own user_metadata), so this keeps the UI's idea of
  // "who am I" consistent with what the database will actually let them see/do. Fall back to
  // user_metadata only for an account created before the client-isolation fix that hasn't had
  // app_metadata backfilled yet -- see migrations/2026-10-22_scripts_client_isolation_rls.sql.
  role   = u.app_metadata?.role || u.user_metadata?.role || 'client';
  mySlug = u.app_metadata?.client_slug || u.user_metadata?.client_slug || null;
  // A missing slug must not become Andrew. Clients are locked to their slug.
  // Admins keep a preview across a token refresh, and land on their own slug
  // only when this is a real sign-in.
  if (role === 'client') {
    viewSlug = homeSlug(mySlug);
    previewSlug = null;
    viewAsOpen = false;
    viewMode = 'all';
  }

  if (isNewSignIn) {
    // A client can get stranded on Calendar/Pipeline after a logout/login in the same tab --
    // viewTab is plain module-level state that survives across sessions, and the toggle + status
    // tabs that would let them escape are both hidden whenever they can't see the view toggle.
    // Force back to List for any session that can't see the toggle, every time it logs in.
    if (!(role === 'admin' || CLIENT_VIEW_TABS)) viewTab = 'list';
    // Same leak as above: viewStatusExact must not survive into a new session either (e.g. an
    // admin jumped in from Pipeline right before signing out), or a client's List filter could
    // silently use the group-collapsed match instead of the normal per-take one.
    viewStatusExact = false;

    // Item 3 -- silent "remember last view" restore, admin only. Reset every piece of transient
    // view state that must NEVER be restored first (selected day, shown month, status filter) --
    // restoring those would either auto-scroll to a huge stale day panel or make a fresh login
    // look empty. Only viewSlug/viewTab are candidates for restore, and only when the "Open on
    // sign-in" setting is 'last'.
    calSelectedDay = null;
    calMonth = null;      // always open on the real current month, never a stale one
    viewStatus = 'all';   // always reset the List filter on a fresh login, never restore it
    viewType = 'all';     // Interview / B-roll filter must not hide scripts on a fresh login
    listSearch = '';
    expandedSections.clear();
    if (role === 'admin') {
      previewSlug = null;
      viewAsOpen = false;
      viewSlug = homeSlug(mySlug);
      if (viewSlug && settingOpenOnSignIn === 'last') {
        const saved = loadLastView(u.id);
        const tabValid = saved && VIEW_TABS.includes(saved.viewTab);
        viewTab = tabValid ? saved.viewTab : 'list';
      } else if (viewSlug && VIEW_TABS.includes(settingOpenOnSignIn)) {
        viewTab = settingOpenOnSignIn;
      } else {
        viewTab = 'list';
      }
    }
  }

  // A failed fetch on a genuine new sign-in has nothing on screen worth keeping, so let it
  // throw through to renderError() (visible error + Reload). On a C1 re-fire (tab refocus) the
  // screen already holds good data -- one flaky network moment shouldn't replace it with an
  // error page, so keep what's showing and say so.
  try {
    await fetchScripts();
  } catch (e) {
    if (window.__previewLock) return;
    if (isNewSignIn) throw e;
    console.error(e);
    showToast("Couldn't refresh — showing what was last loaded.", { tone: 'error' });
  }
  if (window.__previewLock) return;
  // Clients land on the fresh list (newest unfilmed batch), not Needs Review and not
  // the full archive. Only on a real sign-in, so a deliberate filter survives a tab refocus.
  if (isNewSignIn && role === 'client') {
    viewStatus = 'all';
    viewTab = 'list';
    previousOpen = false;
    hubPage = 'main';
  }
  if (isNewSignIn) loadOpened();
  renderDash();
  subscribeLiveChanges();
  fetchRequests();
  fetchEdits();
}

// ─────────────────────────────────────────────
// LIVE SYNC — multiple people (Cristian + Andrew, multiple devices) can be logged in at
// once. Without this, each session only sees the data it fetched at login -- someone else's
// status change is invisible until a manual reload. Any change to the scripts table refetches
// and re-renders for everyone currently connected, so a status update on one device shows up
// on the others within ~1s, not "whenever they happen to refresh."
// ─────────────────────────────────────────────

// element mid-interaction, which on iOS dismisses the native picker wheel entirely out from
// under the user. Holds the redraw back waiting for that element's own `change`/`blur` event
// instead of firing right away.

// can get stuck forever if that element is removed from the DOM without ever firing blur (an

// staying stuck.

  // dismisses the iOS keyboard, and even on desktop it would eat the keystroke in flight.
  // It resumes on a delayed blur rather than on change -- see redrawOrDeferForActivePicker().

  if (el.tagName === 'INPUT') {

    return t !== 'checkbox' && t !== 'radio' && t !== 'button' && t !== 'submit';

  // trusting it, so a stuck flag can never silently swallow this (or any future) update.
  if (pendingRealtimeRedrawEl && (pendingRealtimeRedrawEl !== el || !pendingRealtimeRedrawEl.isConnected)) {
    pendingRealtimeRedrawEl = null;
  }
  if (!isPickerElement(el)) { renderDash(); return; }
  if (pendingRealtimeRedrawEl === el) return; // already waiting on this exact element, don't stack listeners
  pendingRealtimeRedrawEl = el;
  const isDateInput = el.tagName === 'INPUT' && el.type === 'date';
  const isSearchInput = el.id === 'list-search' || el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'date');
  const detach = () => {
    el.removeEventListener('change', changeHandler);
    el.removeEventListener('blur', blurHandler);
    pendingRealtimeRedrawEl = null;
  };
  const cleanup = () => { detach(); renderDash(); };
  // F2 -- a <select> (Pipeline's stat picker) only ever fires `change` once it has a complete,
  // valid selection, so resuming the deferred redraw on its very first `change` is safe. A
  // date <input>, though, fires `change` on desktop Chrome for an intermediate, nonsensical
  // PARTIAL value while the user is still typing (e.g. one digit of a year) -- resuming on
  // that first partial change would interrupt typing mid-keystroke, the exact problem this
  // whole deferral exists to prevent. For date inputs, only resume on blur (interaction is
  // over) or on a change whose value already passes isValidPlannedDate() (a complete date).
  //
  // The List search box resumes on blur ONLY (its `change` fires on Enter while still focused),
  // and ~250ms AFTER the blur rather than on it: the usual reason it blurs is the user tapping
  // something else -- a Film/Pass button on a card -- and rebuilding the page between that
  // tap's pointerdown (which caused the blur) and its click would destroy the button under the
  // finger and silently swallow the tap. Re-enters this function afterwards instead of calling
  // renderDash() directly, so if focus went straight back into the search box it just re-defers.
  const changeHandler = isDateInput
    ? () => { if (isValidPlannedDate(el.value)) cleanup(); }
    : isSearchInput ? () => {} : cleanup;
  const blurHandler = isSearchInput
    ? () => { detach(); setTimeout(redrawOrDeferForActivePicker, 250); }
    : cleanup;
  el.addEventListener('change', changeHandler);
  el.addEventListener('blur', blurHandler);
}
function subscribeLiveChanges() {
  if (realtimeChannel) return; // already subscribed, don't double-subscribe on re-login
  try {
    realtimeChannel = sb.channel('scripts-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'scripts' }, () => {
        // Writing a date to a multi-take group fires one realtime event per row changed --
        // a 150ms debounce collapses a 3-take group's 3 events into a single refetch+render
        // instead of firing it 3 times in quick succession.
        clearTimeout(realtimeDebounceTimer);
        realtimeDebounceTimer = setTimeout(async () => {
          // A failed background refresh keeps the last good data on screen (fetchScripts()
          // throws before touching `scripts`) instead of replacing a working page with an error.
          try { await fetchScripts(); } catch (e) {
            console.error(e);
            showToast("Couldn't refresh — showing what was last loaded.", { tone: 'error' });
            return;
          }
          redrawOrDeferForActivePicker();
        }, 150);
      })
      .subscribe();
  } catch (e) { console.error('Realtime subscription failed (non-fatal):', e); }
}
function unsubscribeLiveChanges() {
  clearTimeout(realtimeDebounceTimer);
  pendingRealtimeRedrawEl = null;
  if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}

// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
async function fetchScripts() {
  let q = sb.from('scripts').select('*').order('reel_number', { ascending: false }); // newest first
  if (role === 'client') {
    if (!mySlug) { scripts = []; return; }
    q = q.eq('client_slug', mySlug);
  }
  const { data, error } = await q;
  // Throw instead of the old `console.error + scripts = []`: a failed fetch used to render as
  // "No scripts here." -- indistinguishable from the client genuinely having no scripts, and
  // on a realtime refresh it wiped a perfectly good list off the screen. Callers decide what a
  // failure means (see afterLogin() and the realtime handler); `scripts` is left untouched.
  if (error) throw error;
  scripts = data || [];
}

async function fetchRequests() {
  if (!user || previewMode) return;
  let error = null;
  let data = null;
  try {
    ({ data, error } = await sb.from('client_requests').select('*').order('created_at', { ascending: false }));
  } catch (e) { error = e; }
  if (!user) return;
  if (error) {
    requestsError = error.message || 'Could not load requests.';
    requests = [];
  } else {
    requestsError = '';
    requests = data || [];
  }
  requestsLoaded = true;
  if (hubPage === 'requests') renderDash();
}

async function fetchEdits() {
  if (!user || previewMode) return;
  let error = null;
  let data = null;
  try {
    ({ data, error } = await sb.from('script_edits').select('*').order('edited_at', { ascending: false }));
  } catch (e) { error = e; }
  if (!user) return;
  if (error) {
    editsError = error.message || 'Could not load edits.';
    scriptEdits = [];
  } else {
    editsError = '';
    scriptEdits = data || [];
  }
  editsLoaded = true;
  if (hubPage === 'edits' || editState) renderDash();
  if (editState) renderEdit();
  if (prepState) renderPrep();
}

// Friendlier confirmation copy for the status moves a CLIENT makes ("Moved to Filming" reads
// like internal jargon to Andrew/Jan); anything else falls back to "Moved to <status>".
const STATUS_MOVE_MSG = {
  'Filming': 'Marked ready to film',
  'Passed': 'Passed on this one',
};

// opts.isUndo -- this call IS an undo, so don't offer to undo it again.
// opts.message -- override the confirmation copy (requestTweak uses this).
async function setStatus(id, status, extra, opts) {
  opts = opts || {};
  const before = scripts.find(s => s.id === id);
  // Snapshot exactly the fields this write will touch, so Undo restores precisely them.
  const prev = before ? { status: before.status ?? null, client_feedback: before.client_feedback ?? null } : null;
  const payload = extra ? { status, ...extra } : { status };

  // .select('id') + row-count check -- the same session-expired guard setGroupDate() already
  // has (see the comment there): an expired token can make .update() match ZERO rows and still
  // resolve with no error. Status taps are the most common write in the whole app, and without
  // this a client could tap "Film", watch the card move, and the change never reach Cristian.
  let data = null, error = null;
  try {
    ({ data, error } = await sb.from('scripts').update(payload).eq('id', id).select('id'));
  } catch (e) { error = e; }
  if (error || !data || data.length !== 1) {
    if (error) console.error(error);
    showToast(error ? `Couldn't save that change: ${error.message || error}` : SESSION_EXPIRED_MSG, { tone: 'error' });
    return;
  }

  const s = scripts.find(s => s.id === id);
  if (s) Object.assign(s, payload);
  renderDash();

  if (opts.isUndo) { showToast('Undone'); return; }
  if (prev) {
    // Only restore client_feedback if this write changed it (a Tweak) -- a plain status move
    // must not overwrite a tweak note that someone else edited meanwhile.
    const undoExtra = ('client_feedback' in payload) ? { client_feedback: prev.client_feedback } : null;
    showToast(opts.message || STATUS_MOVE_MSG[status] || `Moved to ${status}`, {
      actionLabel: 'Undo',
      onAction: () => setStatus(id, prev.status, undoExtra, { isUndo: true }),
    });
  }
}

// Tweak now actually asks what needs to change, instead of silently moving the card to Draft
// with zero information -- this was the real bug behind "the tweaking process doesn't work":
// there was never a way to say WHAT to tweak, so the only option was texting Cristian directly.
async function requestTweak(id) {
  const note = window.prompt("What needs to change on this one?");
  if (note === null) return; // cancelled -- don't move status, don't lose anything
  await setStatus(id, 'Draft', { client_feedback: note || null }, { message: 'Sent back for changes' });
}

// ─────────────────────────────────────────────
// COPY SCRIPT — scripted content gets read off a teleprompter app, and selecting a long <pre>
// block by long-press on a phone is fiddly and easy to get wrong (a missed last line). One tap
// copies the exact stored script text. Looked up by row id from `scripts` rather than reading
// the rendered DOM, so it always copies the real field, not escaped/truncated display text.
// ─────────────────────────────────────────────
function copyTextToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  // Fallback for non-secure contexts (opening the file locally over http) and older webviews.
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    ok ? resolve() : reject(new Error('Copy command was rejected'));
  });
}
window.copyScript = async (id) => {
  const s = scripts.find(x => x.id === id);
  const text = s && typeof s.full_script === 'string' ? s.full_script : '';
  if (!text) return;
  try {
    await copyTextToClipboard(text);
    showToast('Script copied — ready to paste into your teleprompter.');
  } catch (e) {
    console.error(e);
    showToast("Couldn't copy automatically — press and hold the script to copy it instead.", { tone: 'error' });
  }
};

// ─────────────────────────────────────────────
// HTML HELPERS
// ─────────────────────────────────────────────
function pill(text, style) {
  // XSS-PRE -- `text` is sometimes raw user/client data (s.format, s.status), never escaped
  // here before. `style` is always a fixed, trusted CSS-class string from this file's own
  // STATUS_STYLE/FORMAT_STYLE maps, never interpolated from data, so it's left as-is.
  return `<span class="text-xs font-medium px-2 py-0.5 rounded-full ${style}">${escHtml(text)}</span>`;
}

function btn(label, onclick, style) {
  return `<button onclick="${onclick}" class="${style} text-xs py-2.5 px-3 rounded-xl font-medium active:scale-95 transition-all">${label}</button>`;
}

function linkOrText(val) {
  if (!val) return '';
  // XSS-PRE -- `val` is unescaped client-supplied data. The old `val.startsWith('http')` check
  // also let a crafted value that merely CONTAINED "http" early on, or a non-http(s) scheme
  // smuggled in alongside it, slip through to an unescaped `href="${val}"` -- a client who can
  // write to any row (RLS doesn't yet separate clients -- known, separately-tracked issue)
  // could store a quote-breaking or `javascript:`-style payload in reference_clip/camera and
  // have it execute in the admin's session. Now strictly requires an actual http(s) scheme AND
  // escapes both the href and the displayed text in both branches.
  const isUrl = /^https?:\/\//i.test(val);
  if (isUrl) return `<a href="${escHtml(val)}" target="_blank" class="text-blue-500 text-xs underline break-all">${escHtml(val)}</a>`;
  return `<span class="text-xs text-slate-500">${escHtml(val)}</span>`;
}

// RENDER LOGIN
// ─────────────────────────────────────────────
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        ${brandLockup('Content Hub')}
        <!-- A real <form> (not loose inputs + an onclick button): Enter now submits from the
             email field too, not just the password field, and iOS/Chrome password managers
             recognise it as a login form and offer to fill/save credentials. -->
        <form onsubmit="event.preventDefault(); doLogin()" class="auth-panel">
          <div id="err" class="hidden text-xs text-red-700 bg-red-50 px-3 py-2 mb-3"></div>
          <div class="mb-3">
            <label for="em">Email</label>
            <input id="em" type="email" autocomplete="email" placeholder="you@example.com">
          </div>
          <div class="mb-4">
            <label for="pw">Password</label>
            <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button id="lb" type="submit" class="brand-btn">Sign in</button>
          <div class="text-center pt-3">
            <button id="fpb" type="button" onclick="doForgotPassword()" class="signout-btn">Forgot password?</button>
          </div>
        </form>
      </div>
    </div>`;
  // An expired/already-used reset link came back with an error in the URL (captured at the top
  // of the script). Say so instead of leaving the user wondering why the link "didn't work".
  // Deliberately NOT cleared here: supabase-js fires INITIAL_SESSION (no session) right after
  // init() has already shown this screen, which re-runs renderLogin() -- clearing on first
  // display would wipe the message a moment after it appeared. Cleared once the user acts
  // (doLogin/doForgotPassword) or signs in (afterLogin) instead.
  if (authLinkError) {
    showLoginError(`${authLinkError}. Enter your email and tap "Forgot password?" to get a new link.`);
    try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
  }
}

// A thrown (not returned) auth error is a transport failure -- its raw message is something like
// "Failed to fetch", which means nothing to Andrew or Jan.
const NETWORK_ERROR_MSG = "Couldn't reach the server — check your connection and try again.";

// textContent, never innerHTML -- these messages can contain server-supplied text.
function showLoginError(msg) {
  const err = document.getElementById('err');
  if (!err) return;
  err.textContent = msg;
  err.classList.remove('hidden');
}

async function doLogin() {
  const em = document.getElementById('em').value.trim();
  const pw = document.getElementById('pw').value;
  const lb = document.getElementById('lb');
  const err = document.getElementById('err');
  if (lb.disabled) return; // already in flight -- a double Enter shouldn't fire two sign-ins
  authLinkError = null;
  lb.textContent = 'Signing in…'; lb.disabled = true;
  err.classList.add('hidden');
  // try/catch: a network failure (offline, captive wifi) can REJECT rather than resolve with
  // `error` -- previously that left the button stuck on "Signing in…" and disabled forever.
  let error = null;
  try { ({ error } = await sb.auth.signInWithPassword({ email: em, password: pw })); }
  catch (e) { console.error(e); error = { message: NETWORK_ERROR_MSG }; }
  if (error) {
    showLoginError(error.message || NETWORK_ERROR_MSG);
    lb.textContent = 'Sign in'; lb.disabled = false;
  }
}

async function doForgotPassword() {
  authLinkError = null;
  const em = document.getElementById('em').value.trim();
  if (!em) {
    showLoginError('Enter your email address first, then tap Forgot password.');
    return;
  }
  const fpb = document.getElementById('fpb');
  if (fpb) { fpb.disabled = true; fpb.textContent = 'Sending…'; }
  let error = null;
  try {
    ({ error } = await sb.auth.resetPasswordForEmail(em, {
      redirectTo: window.location.origin + window.location.pathname
    }));
  } catch (e) { console.error(e); error = { message: NETWORK_ERROR_MSG }; }
  if (error) {
    showLoginError(error.message || NETWORK_ERROR_MSG);
    if (fpb) { fpb.disabled = false; fpb.textContent = 'Forgot password?'; }
  } else {
    // XSS-PRE -- `em` is whatever was typed into the field; it was interpolated raw here.
    document.getElementById('app').innerHTML = `
      <div class="flex flex-col items-center justify-center min-h-screen px-5 text-center">
        <div class="text-2xl mb-3">📬</div>
        <div class="font-semibold text-slate-800 mb-1">Check your email</div>
        <div class="text-sm text-slate-400 max-w-xs">We sent a password reset link to <strong>${escHtml(em)}</strong>. Click the link in that email to set a new password.</div>
        <button onclick="renderLogin()" class="mt-6 text-xs text-slate-400 border border-slate-200 px-4 py-2 rounded-full hover:bg-slate-50">← Back to sign in</button>
      </div>`;
  }
}

// ─────────────────────────────────────────────
// SET NEW PASSWORD — the missing second half of "Forgot password?". The reset email's link
// signs the user in and lands here (see passwordRecoveryPending at the top of the script);
// before this screen existed it dropped them straight into the dashboard with no way to
// actually choose a new password, so the next time they signed out they were locked out again.
// ─────────────────────────────────────────────
function renderSetNewPassword() {
  document.getElementById('app').innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        ${brandLockup('Choose a new password')}
        <form onsubmit="event.preventDefault(); doSetNewPassword()" class="auth-panel">
          <div id="err" class="hidden text-xs text-red-700 bg-red-50 px-3 py-2 mb-3"></div>
          <div class="mb-3">
            <label for="npw">New password</label>
            <input id="npw" type="password" autocomplete="new-password" minlength="8">
            <div class="text-[12px] text-neutral-500 mt-1">At least 8 characters. You'll use this to sign in from now on.</div>
          </div>
          <div class="mb-4">
            <label for="npw2">Type it again</label>
            <input id="npw2" type="password" autocomplete="new-password">
          </div>
          <button id="npb" type="submit" class="brand-btn">Save new password</button>
          <div class="text-center pt-3">
            <button type="button" onclick="doLogout()" class="signout-btn">Cancel and sign out</button>
          </div>
        </form>
      </div>
    </div>`;
}

async function doSetNewPassword() {
  const pw = document.getElementById('npw').value;
  const pw2 = document.getElementById('npw2').value;
  const npb = document.getElementById('npb');
  if (npb.disabled) return;
  if (pw.length < 8) { showLoginError('Use at least 8 characters.'); return; }
  if (pw !== pw2) { showLoginError("Those two passwords don't match."); return; }
  npb.disabled = true; npb.textContent = 'Saving…';
  let data = null, error = null;
  try { ({ data, error } = await sb.auth.updateUser({ password: pw })); }
  catch (e) { console.error(e); error = { message: NETWORK_ERROR_MSG }; }
  if (error || !data || !data.user) {
    showLoginError((error && error.message) || NETWORK_ERROR_MSG);
    npb.disabled = false; npb.textContent = 'Save new password';
    return;
  }
  passwordRecoveryPending = false;
  try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
  // afterLogin() failures (e.g. the scripts fetch) belong on the normal error screen, not in
  // this form's inline error -- the password itself DID save at this point.
  try { await afterLogin(data.user); } catch (e) { renderError(e); }
  showToast('New password saved.');
}

// ─────────────────────────────────────────────
// TAKE GROUPING — rows sharing (client_slug, batch, reel_number) are "takes" of one
// script, shown as one card with a tab-switcher. A group of 1 renders exactly like a
// plain card always has — this is the backward-compatible default for every existing
// row (Jan's cards, any Andrew day without multiple takes).
// ─────────────────────────────────────────────
function takeGroupKey(s) {
  return `${s.client_slug}__${s.batch}__${s.reel_number}`;
}

function groupIntoTakes(list) {
  const groups = {};
  const order = [];
  list.forEach(s => {
    const key = takeGroupKey(s);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(s);
  });
  // Within a group, order by take_label so 'Take A' < 'Take B' < 'Take C' when present.
  order.forEach(key => groups[key].sort((a, b) => (a.take_label || '').localeCompare(b.take_label || '')));
  return order.map(key => groups[key]);
}

window.setTake = (groupKey, idx) => { activeTake[groupKey] = idx; renderDash(); };

// ─────────────────────────────────────────────
// CALENDAR / PIPELINE SHARED DATA LAYER — pure functions over a take-group (the same
// array-of-rows a card already groups into). A group can have mixed statuses across its
// takes (e.g. 3 takes = {Needs Review, Passed}); these collapse that down to one
// representative status/date for the whole group, matching the "one card per group" model
// the rest of the app already uses.
// ─────────────────────────────────────────────
function groupStatus(group) {
  // Matches the existing "all" filter behavior above: one Archived take hides the whole
  // group, so Archived wins outright over anything else in the group.
  if (group.some(s => s.status === 'Archived')) return 'Archived';
  const active = group.filter(s => s.status !== 'Passed');
  if (active.length === 0) return 'Passed'; // every take passed -- group as a whole is passed
  // Furthest-along non-Passed status by STATUS_ORDER position. Null/unknown status falls
  // back to 'Draft', same fallback STATUS_STYLE already uses elsewhere.
  let best = 'Draft', bestIdx = -1;
  active.forEach(s => {
    const st = s.status && STATUS_ORDER.includes(s.status) ? s.status : 'Draft';
    const idx = STATUS_ORDER.indexOf(st);
    if (idx > bestIdx) { bestIdx = idx; best = st; }
  });
  return best;
}

// Shared predicate so a group bucketed under ONE status in Pipeline (its furthest-along
// non-Passed status) is matched by that SAME status in List -- not List's native `.some()`
// filter, which shows a group under EVERY status any of its takes has. Without this, a group
// Pipeline counts under "Approved" can still show up when List's own `.some()` filter is asked
// for "Needs Review", because one of its takes happens to carry that status. Also fixes a
// null/unrecognized take status "disappearing" on a jump-in, since groupStatus() already
// applies the same Draft fallback STATUS_STYLE uses.
function groupMatchesStatus(group, status) {
  return groupStatus(group) === status;
}

function groupDate(group) {
  // 'YYYY-MM-DD' | null. date_planned is the planned POSTING date (not filming), stored by
  // Postgres as a plain 'date' and returned as a plain 'YYYY-MM-DD' string -- never run it
  // through `new Date(...)`, see ymd() below for why.
  const active = group.filter(s => s.status !== 'Passed' && s.date_planned);
  const pool = active.length ? active : group.filter(s => s.date_planned);
  if (!pool.length) return null;
  return pool.map(s => s.date_planned.slice(0, 10)).sort()[0];
}

function activeGroupsFor(slug) {
  return groupIntoTakes(scripts.filter(s => s.client_slug === slug)).filter(g => groupStatus(g) !== 'Archived');
}

// Shared by the Next-7-days strip (Item 4) and Pipeline's "Scheduled next 7 days" stat (Item 6)
// -- a single source of truth for the window, so both features agree on the exact same range.
// Deliberately a ROLLING 7-day window (today + the next 6 days), NOT a Sun-Sat calendar week
// (hence the "next 7 days" wording, not "this week") -- a calendar week would show mostly
// past days by Thursday/Friday, which is
// useless for "what's coming up." Returns plain 'YYYY-MM-DD' strings built from LOCAL date
// parts (see the CRITICAL CORRECTNESS note on ymd() below) so the range can be compared
// lexicographically against groupDate()'s output.
function rollingWeekRange() {
  const now = new Date();
  const start = ymd(now.getFullYear(), now.getMonth(), now.getDate());
  const endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 6);
  const end = ymd(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());
  return { start, end };
}

// Groups whose groupDate() falls within [startStr, endStr] (inclusive, both 'YYYY-MM-DD').
// String comparison is safe here because 'YYYY-MM-DD' sorts lexicographically == chronologically.
function groupsInRange(groups, startStr, endStr) {
  return groups.filter(g => {
    const d = groupDate(g);
    return d && d >= startStr && d <= endStr;
  });
}

// Builds a 'YYYY-MM-DD' string from LOCAL year/month(0-11)/day parts.
//
// CRITICAL: date_planned arrives from Supabase as a plain 'YYYY-MM-DD' string (Postgres
// `date` type). NEVER call `new Date('2026-10-01')` on it -- that parses as UTC midnight,
// which is the previous evening in US timezones, silently shifting every date back a day.
// Always compare/group using the raw string (`s.date_planned.slice(0,10)`), and build
// calendar grid cells from local `new Date(y, m, d)` + this helper, with "today" computed
// from local getFullYear()/getMonth()/getDate(). If a future "fix" replaces this with
// `new Date(dateString)`, it will reintroduce the off-by-one bug -- don't do it.
function ymd(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

// Guards against two separate desktop <input type=date> misbehaviors: (1) typing a partial
// year (e.g. just "2") can fire a `change` event with a nonsensical value like '0002-10-21'
// before the user finishes typing, and (2) a malformed/empty string should never reach
// Supabase. Deliberately strict shape check (not just "does Date parse it") plus a sane year
// range -- rejects anything outside it instead of silently writing garbage to the database.
function isValidPlannedDate(v) {
  if (typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const year = Number(v.slice(0, 4));
  return year >= 2020 && year <= 2100;
}

// Today as a local 'YYYY-MM-DD' (same local-parts rule as ymd() above -- never toISOString(),
// which is UTC and is already "tomorrow" every US evening).
function localTodayStr() {
  const now = new Date();
  return ymd(now.getFullYear(), now.getMonth(), now.getDate());
}

function parseBatchDate(batch) {
  const s = String(batch || '');

  if (m) {
    const mm = Number(m[2]);
    const dd = Number(m[3]);
    if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return m[1] + '-' + m[2] + '-' + m[3];
  }
  m = s.match(/(\d{1,2})[./](\d{1,2})[./](\d{4})/);
  if (!m) return '';
  const mm = Number(m[1]);
  const dd = Number(m[2]);

  return m[3] + '-' + String(mm).padStart(2, '0') + '-' + String(dd).padStart(2, '0');

        <button type="button" onclick="doLogout()" class="signout-btn">Sign out</button>
      </div>
    </div>`;

  // ───────────────────────────────────────────
  // ITEM 1 (row 3) — collapsed "Filters" pill + always-visible mode/status chips. Admin + List
  // only. The chips must always reflect the REAL active filter even while collapsed -- admin
  // defaults to 'testing' mode, which hides most of the backlog, so silently hiding that from
  // view would be a "where did my scripts go" trap.
  // ───────────────────────────────────────────
  const modeChipLabel = effectiveMode === 'testing' ? '🧪 In Testing' : '📋 All';
  const modeChipCount = effectiveMode === 'testing' ? testingGroups.length : allGroups.length;
  const modeChip = `<span class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">${modeChipLabel} <span class="opacity-60">· ${modeChipCount}</span></span>`;

  // F4 -- count GROUPS (visibleGroups, already filtered to this exact status above), not raw
  // takes (countByStatus) -- the cards actually on screen are grouped, so a chip built from
  // per-take counts can show a different number than what's visible, the same mismatch a prior
  // QA round already fixed for the Pipeline->List jump path.
  const statusChip = viewStatus !== 'all' ? `
    <button onclick="window.setStatus2('all')" class="flex-shrink-0 min-h-11 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-white">
      ${viewStatus} <span class="opacity-70">· ${visibleGroups.length}</span> <span class="opacity-80">✕</span>
    </button>` : '';

  const moreDrawer = (isAdmin && !previewSlug && moreOpen && hubPage === 'main') ? `
    <div class="more-back" id="more-drawer" onclick="window.toggleMore(false)">
      <div class="more-sheet" role="dialog" aria-modal="true" aria-label="More" onclick="event.stopPropagation()">
        <div class="more-head">
          <div class="eyebrow">More</div>
          <button type="button" class="tool-btn" onclick="window.toggleMore(false)">Done</button>
        </div>
        <button type="button" class="shot-edit" onclick="window.openEdits()">Script edits</button>
        ${clientTabs ? `<div class="eyebrow">Clients</div>${clientTabs}` : ''}
        ${viewToggle ? `<div class="eyebrow">View</div>${viewToggle}` : ''}
        ${modeTabs ? `<div class="eyebrow">Scripts</div>${modeTabs}` : ''}
        <div class="eyebrow">Status</div>
        <div class="filter-row">${statusTabs}</div>
        ${typeBar ? `<div class="eyebrow">Type</div>${typeBar}` : ''}
        ${searchBox}
        ${viewStatus !== 'all' || viewMode !== 'all' || viewType !== 'all' || listSearch ? modeChip + statusChip : ''}
      </div>
    </div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="hub-shell min-h-screen flex flex-col relative">

      <div class="hub-header">
        ${headerRow1}
      </div>

      <!-- Settings popover (Item 2) -- backdrop first (so it's visually "behind"), panel
           second. Both are siblings of the sticky header (not nested inside it) so z-index
           comparisons aren't capped by the header's own stacking context. -->
      ${settingsBackdrop}
      ${settingsPanel}

      <div class="hub-main">
        ${renderContextBar()}
        ${body}
      </div>
    </div>
    ${moreDrawer}
    ${renderHubModal()}`;

  // Day-panel scroll (Calendar view only) -- DOM is fully rebuilt above, so the panel can't
  // be scrolled to until after this innerHTML assignment. See renderCalendar() for details.
  // One-shot: only consume calScrollPending (set by an actual day-tap/jump-to-date action),
  // never re-derive from calSelectedDay existing -- that would re-fire the scroll on every
  // unrelated redraw while a day stays selected (realtime updates, take-tab taps, status
  // buttons inside the day panel, expanding unscheduled, month nav).
  if (calScrollPending) { calScrollPending = false; scrollToDayPanel(); }

  // Restore the Next-7-days strip's scroll position captured at the top of this function --
  // same requestAnimationFrame-after-rebuild technique as scrollToDayPanel(), just for
  // scrollLeft instead of scrollIntoView. A no-op when the strip isn't in the DOM (not on
  // Calendar) or was already at scrollLeft 0.
  requestAnimationFrame(() => {
    const el = document.getElementById('next7-strip');
    if (el) el.scrollLeft = next7ScrollLeft;
  });

  // F2 -- single source of truth for "remember last view" persistence (admin only), instead of
  // requiring every individual navigation action to remember to call saveLastView() itself.
  // jumpToList() (Pipeline/Calendar -> List) was exactly this gap: it changes viewSlug/viewTab
  // just like setClient()/setViewTab() do, but never saved, so "Where I left off" silently
  // stopped reflecting reality after a jump-in. Runs once per render and compares against what's
  // already saved so it's a no-op write when nothing actually changed.
  if (isAdmin && user && !previewSlug) {
    const saved = loadLastView(user.id);
    if (!saved || saved.viewTab !== viewTab) saveLastView();
  }

  // K1 -- restore keyboard focus into the just-rebuilt DOM, if a settings change captured it
  // above. No-op when nothing was captured (every other redraw path).
  restoreFocusAfterRedraw();
  syncHubHeaderOffset();
  requestAnimationFrame(() => {
    syncHubHeaderOffset();
    requestAnimationFrame(syncHubHeaderOffset);
  });
  if (navScrollScope) {
    const scope = navScrollScope;
    navScrollScope = '';
    requestAnimationFrame(() => {
      const header = document.querySelector('.hub-header');
      const detail = document.getElementById('detail-' + scope);
      if (!detail) return;
      const headerH = header ? header.offsetHeight : 0;
      const top = detail.getBoundingClientRect().top;
      if (top < headerH + 4 || top > window.innerHeight * 0.4) {
        window.scrollTo({ top: Math.max(0, top + window.scrollY - (headerH + 8)), behavior: 'auto' });
      }
      const stage = detail.closest('.script-stage');
      const onBtn = stage && stage.querySelector('.script-nav-btn.is-on');
      if (onBtn) {
        const nav = onBtn.closest('.script-nav');
        if (nav && nav.scrollHeight > nav.clientHeight + 8) onBtn.scrollIntoView({ block: 'nearest' });
      }
    });
  }
  if (modalFocusPending) {
    modalFocusPending = false;
    requestAnimationFrame(() => {
      const el = document.getElementById('modal-primary');
      if (el) el.focus();
    });
  }
  kickThumbResolves();
}

// ─────────────────────────────────────────────
// SETTINGS POPOVER (Item 2) — admin only. Anchored top-right under the header row, closes on
// backdrop tap / Escape / its own ✕. Changing a setting does NOT close it (so you can see the
// "Currently: ..." line update live, or flip the color-key toggle and immediately see the
// calendar react, without the panel snapping shut).
// ─────────────────────────────────────────────
function renderSettingsPanel() {
  // "Currently: ..." reflects whatever is actually SAVED to localStorage (what would be
  // restored on the next sign-in), not just the live in-memory state -- the two normally match
  // (renderDashInner() centrally calls saveLastView() once per render whenever viewSlug/viewTab
  // changed, see F2 there), but this is the one piece of UI that makes the otherwise-invisible
  // "remember last view" rule inspectable.
  const saved = user ? loadLastView(user.id) : null;
  const curTab  = (saved && VIEW_TABS.includes(saved.viewTab)) ? saved.viewTab : viewTab;
  const curTabLabel = VIEW_TAB_LABEL[curTab];
  const currentlyLine = curTabLabel;

  const openOptions = [
    { v: 'last',     label: 'Where I left off' },
    { v: 'list',     label: 'List' },
    { v: 'calendar', label: 'Calendar' },
    { v: 'pipeline', label: 'Pipeline' },
  ];

  const radioRows = openOptions.map(o => `
    <label class="flex items-start gap-2.5 py-2 cursor-pointer">
      <input type="radio" name="openOnSignIn" value="${o.v}" data-focus-id="signin-${o.v}" ${settingOpenOnSignIn === o.v ? 'checked' : ''}

  return `
  <!-- C2 -- this outer wrapper is "fixed inset-x-0 top-0", anchored to the VIEWPORT, not to the
       page's scrolling flow. The old markup put "absolute" directly on the panel, positioned
       relative to the outer page wrapper (which scrolls with the page) -- so scrolling down even
       slightly carried the panel off-screen while the gear icon (sticky header) stayed visible,
       and the still-fixed, still-full-viewport backdrop kept eating the next tap. The wrapper
       itself has no height (zero-height box, "pointer-events-none") so it can't block clicks
       outside the panel; the panel re-enables pointer-events on itself. Constraining the inner
       column to "max-w-xl mx-auto" keeps the panel lined up with the rest of the app's content
       column exactly like before.

       K2 -- id="settings-panel" is how the document-level Tab-trap keydown listener (see its
       declaration above) finds this panel's focusable controls without needing its own
       per-render listener. max-h-[calc(100vh-5rem)]/overflow-y-auto keeps the whole panel
       reachable (scrollable) on a short/landscape screen instead of letting its bottom content
       get cut off with no way to scroll down to it. -->
  <div class="fixed inset-x-0 top-0 z-40 pointer-events-none">
    <div class="hub-shell relative">
      <div id="settings-panel" class="settings-panel pointer-events-auto absolute top-16 overflow-y-auto bg-white rounded-2xl border border-slate-200 shadow-lg p-4" role="dialog" aria-modal="true" aria-label="Settings">

        </div>

        <div class="mb-1">
          <div id="open-on-signin-label" class="text-[11px] font-semibold text-slate-400 uppercase tracking-widest mb-1">Open on sign-in</div>

        </div>

        <div class="border-t border-slate-100 mt-2 pt-3 flex items-center justify-between gap-3">
          <div id="always-show-key-label" class="text-sm text-slate-700">Always show color key</div>
          <button data-focus-id="always-show-key" onclick="window.toggleAlwaysShowKey()" role="switch" aria-checked="${settingAlwaysShowKey}" aria-labelledby="always-show-key-label"
            class="relative w-11 h-6 rounded-full flex-shrink-0 transition-colors ${settingAlwaysShowKey ? 'bg-slate-800' : 'bg-slate-200'}">
            <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform ${settingAlwaysShowKey ? 'translate-x-5' : ''}"></span>
          </button>
        </div>
      </div>

function copyScriptButton(s) {

// ─────────────────────────────────────────────
// SHOT CARD — phone-first filming view. Parsers only reorganize text that
// already lives on the row. Every column is also printed, raw, under All fields.
// ─────────────────────────────────────────────
function asText(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); }
}
function clipText(str, n) {
  str = (str || '').trim();
  if (str.length <= n) return str;
  const cut = str.slice(0, n - 1);
  const sp = cut.lastIndexOf(' ');
  return ((sp > 40 ? cut.slice(0, sp) : cut).trim()) + '…';
}
function wordCount(text) {
  const m = String(text || '').trim().match(/\S+/g);
  return m ? m.length : 0;
}
function readLabel(text) {
  const w = wordCount(text);
  if (!w) return '';
  const sec = Math.max(1, Math.round((w / 150) * 60));
  const time = sec < 60 ? sec + ' sec' : Math.round(sec / 60) + ' min';
  return w + ' words · about ' + time;
}

function parseHookPair(hook) {
  const raw = asText(hook).trim();
  if (!raw) return { proven: '', adapted: '', raw: '' };
  const parts = raw.split(/\n(?=ADAPTED\b)/i);
  let proven = '', adapted = '';
  parts.forEach(part => {
    const p = part.trim();
    if (/^ADAPTED\b/i.test(p)) adapted = p.replace(/^ADAPTED\b[^:\n]*:\s*/i, '').trim();
    else if (/PROVEN HOOK/i.test(p)) proven = p.replace(/^[\s\S]*?PROVEN HOOK\b[^:\n]*:\s*/i, '').trim();
  });
  adapted = adapted.replace(/\n?On-screen bold caps:[\s\S]*$/i, '').trim();
  if (!proven && !adapted) return { proven: '', adapted: raw, raw };
  return { proven, adapted, raw };
}

function parseSetup(setup, camera) {
  const text = asText(setup).trim();
  const labeled = (name) => {
    // Labels are often inline ("…pass. LOCATION: Fairmont…"), not only at the start of a line.
    const m = text.match(new RegExp('(?:^|[\\n.]\\s*)' + name + '\\s*:\\s*([^\\n]+)', 'i'));
    return m ? m[1].trim() : '';
  };
  let location = labeled('LOCATION');
  let mic = labeled('MIC TIP') || labeled('MIC');
  let shots = '';
  const sm = text.match(/(?:^|\n)\s*SHOT LIST\s*:\s*([\s\S]*?)(?=\n\s*(?:TIME|MIC|LOCATION|HANDHELD OPTION|FRAMING|PHONE)\b|$)/i);
  if (sm) shots = sm[1].trim();
  let rig = '';
  const rigSentence = text.split(/(?<=\.)\s+|\n/).map(s => s.trim()).find(s => /handheld|tripod|gimbal|\bphone\b/i.test(s));
  if (rigSentence) rig = rigSentence.replace(/\s+/g, ' ').trim();
  if (!mic) {
    const mm = text.match(/[^.!\n]*\b(lav|shotgun|wireless mic|dji mic|clip\/wireless mic|mic)[^.!\n]*[.!]?/i);
    if (mm) mic = mm[0].trim();
  }
  const cam = asText(camera).trim();
  let framing = '';
  if (cam && /fram|chest|head-on|vertical|eye|two-shot|close|medium/i.test(cam)) framing = cam;
  if (!framing) {
    const fm = text.match(/[^.!\n]*\b(framing|head-on|chest-up|mid-chest|eye height)[^.!\n]*[.!]?/i);
    if (fm) framing = fm[0].trim();
  }
  return { location, rig, framing, mic, shots, raw: text, camera: cam };
}

function parseShots(raw) {
  raw = (raw || '').trim();
  if (!raw) return [];
  const out = [];
  const re = /(\d+)\)\s*([\s\S]*?)(?=\s*\d+\)|$)/g;
  let m;
  while ((m = re.exec(raw))) {
    const t = m[2].trim().replace(/[.\s]+$/, '');
    if (t) out.push(t);
  }
  if (out.length) return out;
  if (raw.includes('→')) return raw.split(/\s*→\s*/).map(s => s.trim()).filter(Boolean);
  return [raw];
}

function parseOnScreen(notes, hook) {
  const items = [];
  const text = [asText(notes), asText(hook)].filter(Boolean).join('\n');
  const block = text.match(/ON-SCREEN TEXT\s*:\s*([^\n]+)/i);
  if (block) {
    block[1].split(/\s+\/\s+/).forEach(part => {
      const p = part.trim();
      if (!p) return;
      const tm = p.match(/^(\d{1,2}:\d{2})\s+([\s\S]+)$/);
      if (tm) items.push({ t: tm[1], text: tm[2].trim() });
      else items.push({ t: '', text: p });
    });
  }
  const re = /on-screen(?:\s+text)?(?:\s+at)?\s*(\d{1,2}:\d{2})\s*:\s*["“']?([^"\n”']+)/gi;
  let m;
  while ((m = re.exec(text))) {
    const tx = m[2].trim();
    if (!items.some(i => i.t === m[1] && i.text.slice(0, 16) === tx.slice(0, 16))) items.push({ t: m[1], text: tx });
  }
  const lt = text.match(/lower third at\s*(\d{1,2}:\d{2})\s*:\s*([^\n]+)/i);
  if (lt) items.push({ t: lt[1], text: lt[2].trim() });
  const caps = asText(hook).match(/On-screen bold caps:\s*([^\n]+)/i);
  if (caps) items.unshift({ t: '0:00', text: caps[1].trim() });
  const ov = asText(notes).match(/OVERLAYS:\s*([^\n]+)/i);
  if (ov) items.push({ t: '', text: ov[1].trim() });
  return items;
}

function parsePasses(notes) {
  const raw = asText(notes);
  if (!/7-PASS/i.test(raw)) return [];
  const body = raw.split(/7-PASS REVIEW\s*:?/i)[1] || '';
  const out = [];
  const re = /(?:^|\n)\s*(\d+)\s+([^:\n]+):\s*([\s\S]*?)(?=\n\s*\d+\s+[^:\n]+:|$)/g;
  let m;
  while ((m = re.exec(body))) out.push({ n: m[1], name: m[2].trim(), text: m[3].trim() });
  return out;
}

function scriptReadModel(script) {
  const text = asText(script).trim();
  if (!text) return { mode: 'empty', intro: '', questions: [], prose: '' };
  const introM = text.match(/INTRO[^\n]*:\s*([^\n]+)/i);
  let questions = [];
  const qBlock = text.split(/QUESTION SHEET[^\n]*\n/i)[1];
  if (qBlock) {
    const re = /^\s*(\d+)\.\s+(.+)$/gm;
    let m;
    while ((m = re.exec(qBlock))) questions.push({ n: m[1], q: m[2].trim() });
  }
  let rest = '';
  if (questions.length) {
    const lines = text.split('\n');
    let lastQ = -1;
    lines.forEach((line, i) => { if (/^\s*\d+\.\s+/.test(line)) lastQ = i; });
    rest = lastQ >= 0 ? lines.slice(lastQ + 1).join('\n').trim() : '';
    return { mode: 'questions', intro: introM ? introM[1].trim() : '', questions, prose: text, rest };
  }
  return { mode: 'prose', intro: '', questions: [], prose: text, rest: '' };
}

function videoInfo(url) {
  const raw = asText(url).trim();
  if (!raw) return null;
  const found = raw.match(/https?:\/\/[^\s]+/i);
  const s = found ? found[0].replace(/[),.;]+$/, '') : raw;
  let m = s.match(/instagram\.com\/(?:[\w.]+\/)?(reel|p|tv)\/([\w-]+)/i);
  if (m) {
    const kind = m[1].toLowerCase();
    const watch = 'https://www.instagram.com/' + kind + '/' + m[2] + '/';
    return { kind: 'ig', src: watch + 'embed/', watch: watch, label: 'Instagram' };
  }
  m = s.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]+)/i);
  if (m) {
    const watch = /shorts\//i.test(s)
      ? 'https://www.youtube.com/shorts/' + m[1]
      : 'https://www.youtube.com/watch?v=' + m[1];
    return { kind: 'yt', src: 'https://www.youtube.com/embed/' + m[1], thumb: 'https://i.ytimg.com/vi/' + m[1] + '/hqdefault.jpg', watch: watch, label: 'YouTube' };
  }
  m = s.match(/tiktok\.com\/@([\w.]+)\/video\/(\d+)/i);
  if (m) {
    const watch = 'https://www.tiktok.com/@' + m[1] + '/video/' + m[2];
    return { kind: 'tt', src: 'https://www.tiktok.com/embed/v2/' + m[2], watch: watch, label: 'TikTok · @' + m[1] };
  }
  if (/^https?:\/\//i.test(s)) return { kind: 'link', watch: s, label: 'Link' };
  return { kind: 'text', label: raw, watch: '' };
}
// Resolved covers for reference URLs that have no stored thumbnail_url yet.
// Keyed by the canonical watch URL. Empty string means we already tried.
const thumbCache = new Map();
function displayThumb(s, info) {
  if (!info || !info.watch || info.kind === 'text') return '';
  const stored = asText(s && s.thumbnail_url).trim();
  const primary = videoInfo(s && s.reference_clip);
  if (stored && primary && primary.watch === info.watch) return stored;
  if (info.thumb) return info.thumb;
  return thumbCache.get(info.watch) || '';
}
async function resolveRemoteThumb(info) {
  if (!info || !info.watch || info.kind === 'text') return '';
  const oembed = info.kind === 'yt'
    ? 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(info.watch)
    : info.kind === 'tt'
      ? 'https://www.tiktok.com/oembed?url=' + encodeURIComponent(info.watch)
      : info.kind === 'ig'
        ? 'https://www.instagram.com/oembed/?url=' + encodeURIComponent(info.watch)
        : '';
  if (oembed) {
    try {
      const r = await fetch(oembed);
      if (r.ok) {
        const j = await r.json();
        if (j && j.thumbnail_url) return j.thumbnail_url;
      }
    } catch (e) {}
  }
  if (info.kind === 'yt' && info.thumb) return info.thumb;
  try {
    const r = await fetch(info.watch);
    if (r.ok) {
      const html = await r.text();
      const m = html.match(/property=["']og:image["'][^>]*content=["']([^"']+)["']/i)
        || html.match(/content=["']([^"']+)["'][^>]*property=["']og:image["']/i);
      if (m) return m[1].replace(/&amp;/g, '&').replace(/&#38;/g, '&');
    }
  } catch (e) {}
  return '';
}
function applyThumb(watch, url) {
  if (!watch || !url) return;
  document.querySelectorAll('[data-ref]').forEach(el => {
    if (el.getAttribute('data-ref') !== watch) return;
    if (el.tagName === 'IMG') {
      if (!el.getAttribute('src')) el.src = url;
      el.hidden = false;
      const poster = el.closest('.ref-poster');
      if (poster) poster.classList.add('has-frame');
      return;
    }
    const poster = el.closest('.ref-poster');
    if (!poster || poster.querySelector('img.thumb-lg')) return;
    const img = document.createElement('img');
    img.className = 'thumb-lg';
    img.alt = '';
    img.referrerPolicy = 'no-referrer';
    img.setAttribute('data-ref', watch);
    img.setAttribute('data-kind', el.getAttribute('data-kind') || '');
    img.onerror = function () { window.thumbNext(img); };
    img.src = url;
    poster.classList.add('has-frame');
    poster.insertBefore(img, poster.firstChild);
  });
}
function kickThumbResolves() {
  const pending = new Map();
  document.querySelectorAll('[data-ref]').forEach(el => {
    const watch = el.getAttribute('data-ref');
    if (!watch) return;
    if (el.tagName === 'IMG' && el.getAttribute('src')) {
      pending.set(watch, '');
      return;
    }
    if (pending.has(watch)) return;
    pending.set(watch, el.getAttribute('data-kind') || 'link');
  });
  pending.forEach((kind, watch) => {
    if (!kind) return;
    if (thumbCache.has(watch)) {
      const hit = thumbCache.get(watch);
      if (hit) applyThumb(watch, hit);
      return;
    }
    thumbCache.set(watch, '');
    const parsed = videoInfo(watch);
    const info = { kind: kind, watch: watch, thumb: (parsed && parsed.thumb) || '' };
    resolveRemoteThumb(info).then(url => {
      thumbCache.set(watch, url || '');
      if (url) applyThumb(watch, url);
    });
  });
}
window.thumbNext = (img) => {
  if (!img || img.dataset.tried === '1') {
    if (img) {
      img.hidden = true;
      const poster = img.closest('.ref-poster');
      if (poster) poster.classList.remove('has-frame');
    }
    return;
  }
  img.dataset.tried = '1';
  const info = videoInfo(img.getAttribute('data-ref')) || { kind: img.getAttribute('data-kind'), watch: img.getAttribute('data-ref') };
  resolveRemoteThumb(info).then(url => {
    if (url && url !== img.src) {
      thumbCache.set(info.watch, url);
      img.hidden = false;
      img.src = url;
      return;
    }
    img.hidden = true;
    const poster = img.closest('.ref-poster');
    if (poster) poster.classList.remove('has-frame');
  });
};
function embedHtml(info) {
  if (!info || !info.src) return '';

}

// ─────────────────────────────────────────────
// PIPELINE VIEW — a stacked stage list with a progress bar, not kanban (six status columns
// don't fit a phone screen). One row per STATUS_ORDER stage Draft..Posted, a quieter Passed
// row below a divider, and an admin-only Archived footer line.
// ─────────────────────────────────────────────
const PIPELINE_STAGES = STATUS_ORDER.filter(s => s !== 'Passed'); // Draft..Posted

// Item 6 -- Pipeline's "pick your stat" chip (admin only; clients always see the fixed
// "posted" headline below). `status` is the STATUS_ORDER/bucket key for the 5 status-based
// options; `verb` fills the existing "N of Total {verb}" headline pattern. "Scheduled next 7
// days" is the one non-status option -- no bucket, no verb, its own sentence instead. Named
// "next 7 days" rather than "this week" because the underlying range is the same rolling
// 7-day window as the Next-7-days strip (see rollingWeekRange()), not a Sun-Sat calendar week.
const PIPELINE_STAT_OPTIONS = [
  { v: 'posted',        label: 'Posted',                 status: 'Posted',       verb: 'posted',      color: 'text-blue-600' },
  { v: 'needsReview',   label: 'Needs Review',           status: 'Needs Review', verb: 'need review',  color: 'text-yellow-700' }, // not yellow-600 -- fails contrast at this weight/size
  { v: 'approved',      label: 'Approved',               status: 'Approved',     verb: 'approved',     color: 'text-emerald-600' },
  { v: 'filming',       label: 'Filming',                status: 'Filming',      verb: 'filming',      color: 'text-orange-600' },
  { v: 'draft',         label: 'Draft',                  status: 'Draft',        verb: 'in draft',     color: 'text-slate-600' },
  { v: 'scheduledWeek', label: 'Scheduled next 7 days',  status: null,           verb: null,            color: 'text-slate-800' },
];

function renderPipeline() {
  const isAdmin = role === 'admin';
  const clientName = viewSlug ? (CLIENTS[viewSlug]?.name || clientLabel(viewSlug)) : 'your workspace';
  const groups = activeGroupsFor(viewSlug);

  if (!groups.length) {
    return `
    <div class="text-center py-16 px-6">
      <div class="text-3xl mb-3">📊</div>
      <div class="text-sm font-semibold text-slate-600 mb-1">No scripts yet for ${escHtml(clientName)}.</div>
    </div>`;
  }

  const bucket = {};
  PIPELINE_STAGES.forEach(s => bucket[s] = []);
  const passedBucket = [];
  groups.forEach(g => {
    const st = groupStatus(g);

  // headline (no picker rendered for them below), regardless of whatever an admin session on

  const statOpt = PIPELINE_STAT_OPTIONS.find(o => o.v === effectiveStat) || PIPELINE_STAT_OPTIONS[0];

  if (statOpt.status) {
    const count = bucket[statOpt.status] ? bucket[statOpt.status].length : 0;
    headlineNumber = count;
    headlineSuffix = `of ${totalNonPassed} ${statOpt.verb}`;
    highlightStatus = statOpt.status;
  } else {
    // "Scheduled next 7 days" -- a count, not a status bucket, so it gets its own sentence.
    const { start, end } = rollingWeekRange();
    const scheduledNext7Days = groupsInRange(groups.filter(g => groupStatus(g) !== 'Passed'), start, end);
    headlineNumber = scheduledNext7Days.length;
    headlineSuffix = `script${headlineNumber === 1 ? '' : 's'} scheduled in the next 7 days`;
  }

  // real status to point at AND it actually has a nonzero slice to point to -- dimming
  // everything when the count is 0, or when a non-status stat ("Scheduled next 7 days") is
  // selected, would read as broken/disabled rather than as a filter.
  const dimOtherSegments = highlightStatus !== null && headlineNumber > 0;

  // Summary card + segmented progress bar -- flex-grow by raw COUNT (not percentage) so
  // rounding never leaves a visible gap, min-width 6px so a count of 1 doesn't disappear.

  const nonZeroStages = PIPELINE_STAGES.filter(s => bucket[s].length > 0);

  // overlaid <select> a properly finger-sized hit area; the equal-and-opposite -my-3 keeps the
  // wrapper's CONTRIBUTION to this row's height exactly what it was before (a negative margin

  const statPicker = isAdmin ? `

      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[10px] font-semibold uppercase tracking-widest whitespace-nowrap">

      </select>

  <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">

      <span>Draft</span><span>Posted</span>

  // Stage rows — zero-count stage renders as a <div>, not a <button>, so there's no dead-end

  const stageRows = PIPELINE_STAGES.map(stage => {
    const stageGroups = bucket[stage];

    const dot = STATUS_DOT[stage];

    if (count === 0) {
      return `
      <div class="w-full flex gap-3 pl-3 pr-4 py-3.5 opacity-50">
        <div class="w-1 self-stretch rounded-full ${dot}"></div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">${pill(stage, STATUS_STYLE[stage])}<span class="text-base font-bold text-slate-300 tabular-nums">0</span></div>
