<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Engine Teleprompter</title>
<style>
:root{--red:#ce2029;--acc:#e6313a;--bg:#080808;--fg:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#setup{max-width:760px;margin:0 auto;padding:24px}
h1{font-size:22px;margin:0 0 4px}h1 b{color:var(--acc)}p{color:#bbb;margin:0 0 16px}
textarea{width:100%;height:46vh;background:#141414;color:#fff;border:1px solid #2a2a2a;border-radius:12px;padding:14px;font-size:16px;line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}
label{font-size:14px;color:#ccc}input[type=range]{accent-color:var(--red);width:160px}
button{background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer}
button.g{background:transparent;border:1px solid #333}
#stage{display:none;position:fixed;inset:0;background:var(--bg);overflow:hidden}
#text{position:absolute;left:6%;right:6%;top:100%;font-weight:700;line-height:1.35;white-space:pre-wrap}
#guide{position:fixed;left:0;right:0;top:32%;height:3px;background:var(--acc);opacity:.6}
#bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.mirror #text{transform:scaleX(-1)}
</style></head><body>
<div id="setup">
<h1>Content Engine <b>Teleprompter</b></h1>
<p>Paste only the words you will say. Tap Start. Space pauses, arrows change speed, Esc exits. Runs offline.</p>
<textarea id="src" placeholder="Paste your teleprompter script here"></textarea>
<div class="row">
<label>Speed <input id="spd" type="range" min="10" max="160" value="45"></label>
<label>Size <input id="size" type="range" min="28" max="96" value="52"></label>
<label><input id="mir" type="checkbox"> Mirror</label>
</div>
<div class="row"><button id="go">Start</button></div>
</div>
<div id="stage"><div id="guide"></div><div id="text"></div>
<div id="bar"><button class="g" id="slow">Slower</button><button id="pause">Pause</button><button class="g" id="fast">Faster</button><button class="g" id="exit">Exit</button></div></div>
<script>
const $=id=>document.getElementById(id);let y=0,run=false,last=0,spd=45;
$('src').value=localStorage.getItem('ce_tp')||'';
function frame(t){if(!last)last=t;const dt=(t-last)/1000;last=t;if(run){y-=spd*dt;$('text').style.top=y+'px'}if($('stage').style.display==='block')requestAnimationFrame(frame)}
$('go').onclick=()=>{localStorage.setItem('ce_tp',$('src').value);$('text').textContent=$('src').value;$('text').style.fontSize=$('size').value+'px';spd=+$('spd').value;document.body.classList.toggle('mirror',$('mir').checked);$('stage').style.display='block';y=innerHeight*0.34;$('text').style.top=y+'px';run=true;last=0;requestAnimationFrame(frame)};
const stop=()=>{$('stage').style.display='none';run=false};
$('exit').onclick=stop;$('pause').onclick=()=>{run=!run;$('pause').textContent=run?'Pause':'Play'};
$('slow').onclick=()=>spd=Math.max(5,spd-8);$('fast').onclick=()=>spd+=8;
addEventListener('keydown',e=>{if($('stage').style.display!=='block')return;if(e.code==='Space'){e.preventDefault();$('pause').click()}if(e.key==='ArrowUp')$('fast').click();if(e.key==='ArrowDown')$('slow').click();if(e.key==='Escape')stop()});
</script></body></html>
